  drawText(ctx,'TOR', x+w-17, y+8, '#9fb79a', 1);
}
function drawEdgeMarkers(){
  const pad=4;
  const mark=(wx,wy,col)=>{
    const sx=wx-cam.x, sy=wy-cam.y;
    if(sx>=0&&sx<VW&&sy>=0&&sy<VH) return;
    const x=clamp(sx,pad,VW-pad), y=clamp(sy,pad+11,VH-pad-11);
    ctx.fillStyle=col; ctx.fillRect(Math.round(x)-1,Math.round(y)-1,3,3);
    ctx.fillStyle='#141019'; ctx.fillRect(Math.round(x),Math.round(y),1,1);
  };
  for(const e of enemies) if(!e.dead && e.spawnT<=0) mark(e.x,e.y, e.d.boss?PAL.O:PAL.r);
  mark(CAS.gatePost.x, CAS.gatePost.y, PAL.H);
}
function drawShopButton(){
  const r=shopBtnRect();
  panel(r.x, r.y, r.w, r.h, game.shopOpen?'rgba(26,46,26,.95)':'rgba(10,18,12,.92)', game.shopOpen?PAL.l:PAL.H);
  drawSpr(SPR.stand, r.x+3, r.y+2, false, false);
  drawText(ctx, 'SHOP', r.x+19, r.y+5, PAL.y, 1);
}
function drawShopPanel(){
  const p=shopPanelRect();
  ctx.globalAlpha=0.5; ctx.fillStyle='#07100a'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1;
  panel(p.x, p.y, p.w, p.h, 'rgba(10,18,12,.97)', PAL.H);
  drawText(ctx, 'WERKSTATT', p.x+6, p.y+5, PAL.H, 1);
  const scr=String(game.scrap);
  drawText(ctx, scr, p.x+p.w-6-textW(scr,1), p.y+5, PAL.y, 1);
  drawSpr(SPR.bolt, p.x+p.w-13-textW(scr,1), p.y+5, false, false);
  const cr=codeRowRect();
  drawText(ctx, 'CODE', cr.x, cr.y-9, '#5f7a5a', 1);
  cardRects().forEach((r,i)=>{
    const c=game.cards[i]; if(!c) return;
    const afford = game.scrap>=c.cost && !c.bought;
    panel(r.x, r.y, r.w, r.h, c.bought?'rgba(24,40,24,.95)':'rgba(16,26,18,.95)',
      c.bought?'#3d6b3a':(afford?PAL.H:'#4a4a4a'));
    drawText(ctx, String(i+1), r.x+4, r.y+3, afford?PAL.y:'#7a7a7a', 1);
    drawText(ctx, c.u.name, r.x+12, r.y+3, c.bought?'#8fbf86':(afford?'#e9f5dc':'#8a8a8a'), 1);
    drawText(ctx, c.u.desc(lvl(c.u.id)), r.x+12, r.y+11, '#9fb79a', 1);
    if(c.bought) drawText(ctx, 'OK', r.x+r.w-17, r.y+7, PAL.H, 1);
    else {
      const cs=String(c.cost);
      drawText(ctx, cs, r.x+r.w-5-textW(cs,1), r.y+7, afford?PAL.y:'#8a6a4a', 1);
      drawSpr(SPR.bolt, r.x+r.w-12-textW(cs,1), r.y+7, false, false);
    }
  });
}
function drawHUD(){
  drawHearts();
  drawSchild();
  drawRegen();
  drawGateBar();
  drawEdgeMarkers();
  bar(4, 15, 22, 1-player.dashCd/player.dashCdMax, player.dashCd>0?'#3a4a3a':PAL.C, 'ROLLE', player.dashCd>0);
  bar(4, 25, 22, 1-player.bowCd/player.bowCdMax,   player.bowCd>0 ?'#4a4030':PAL.O, 'BOGEN', player.bowCd>0);
  bar(4, 35, 22, 1-player.healCd/player.healCdMax, player.healCd>0?'#4a3038':PAL.R, 'HEILEN', player.healCd>0);
  const u=activeUltra();
  if(u){
    const full=player.ultra>=player.ultraMax;
    const pulse = full && Math.floor(game.time*4)%2===0;
    bar(4, 45, 30, player.ultra/player.ultraMax, full?(pulse?'#fff3c4':PAL.y):PAL.p, 'ULTRA', !full);
    const r=ultraChipRect();
    panel(r.x, r.y, r.w, r.h, full?'rgba(46,40,10,.92)':'rgba(10,18,12,.9)', full?PAL.y:'#4a4a4a');
    drawText(ctx, u.name, r.x+4, r.y+2, full?PAL.y:'#8f9a86', 1);
    if(ownedUltras().length>1)
      drawText(ctx, isTouch?'TIPPEN: WECHSELN':'C: WECHSELN', r.x+r.w+4, r.y+2, '#6f7f6c', 1);
  }

  const left = enemies.length + game.spawnList.length;
  if(game.phase==='wave'){
    drawTextC(ctx, 'WELLE '+game.wave, VW/2, 3, '#e9f5dc', 1);
    drawTextC(ctx, 'BOTS '+left, VW/2, 11, left>0?PAL.O:'#9fb79a', 1);
  } else {
    drawTextC(ctx, 'RUHE  '+Math.ceil(game.restT), VW/2, 3, PAL.C, 1);
    drawTextC(ctx, 'WELLE '+(game.wave+1)+' KOMMT', VW/2, 11, '#9fb79a', 1);
  }
  drawSpr(SPR.bolt, 4, VH-10, false, false);
  const scr=String(game.scrap);
  drawText(ctx, scr, 12, VH-10, PAL.y, 1);
  drawText(ctx, String(game.score), 18+textW(scr,1), VH-10, '#9fb79a', 1);

  const chef = game.phase==='wave' ? enemies.find(e=>!e.dead && e.d.boss && e.spawnT<=0) : null;
  if(chef){
    const w=150, x=Math.round((VW-w)/2), y=VH-20;
    drawTextC(ctx, chef.d.name + (chef.hp<chef.hpMax*0.5 ? '  ·  WUT' : ''), VW/2, y-9,
      chef.hp<chef.hpMax*0.5 ? PAL.O : '#e9c0b0', 1);
    ctx.fillStyle='#141019'; ctx.fillRect(x-1,y-1,w+2,6);
    ctx.fillStyle='#3a1d22'; ctx.fillRect(x,y,w,4);
    ctx.fillStyle=PAL.r; ctx.fillRect(x,y,Math.round(w*clamp(chef.hp/chef.hpMax,0,1)),4);
    ctx.fillStyle=PAL.R; ctx.fillRect(x,y,Math.round(w*clamp(chef.hp/chef.hpMax,0,1)),1);
  }
  let hintY = VH-26;
  if(game.phase==='rest'){
    drawShopButton();
    if(game.shopOpen) hintY = -99;              // Fensterhinweis genuegt
    const inHof = inRect(player.x,player.y,COURT);
    if(!game.shopOpen && inHof) drawTextC(ctx, 'IM BURGHOF HEILST DU', VW/2, hintY, PAL.H, 1);
    hintY -= 10;
  }
  if(game.tutorial>0 && game.wave<=1 && game.msgT<=0){
    ctx.globalAlpha=Math.min(1,game.tutorial/2);
    drawTextC(ctx, isTouch ? 'LINKS LAUFEN · RECHTS ZIELEN' : 'WASD LAUFEN · MAUS ZIELEN',
      VW/2, hintY-10, '#cfe8c2', 1);
    drawTextC(ctx, isTouch ? 'TASTEN: SCHWERT, BOGEN, ROLLE' : 'KLICK SCHWERT · RECHTS BOGEN',
      VW/2, hintY, '#9fb79a', 1);
    ctx.globalAlpha=1;
  }
  if(game.msgT>0){
    const a=Math.min(1,game.msgT);
    const sc = textW(game.msg,2) <= VW-16 ? 2 : 1;
    ctx.globalAlpha=a; drawTextC(ctx, game.msg, VW/2, 24, game.msgCol||PAL.y, sc); ctx.globalAlpha=1;
  }
  if(game.white>0){
    ctx.globalAlpha=Math.min(0.5,game.white*0.5); ctx.fillStyle='#dff6ff'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1;
  }
  if(game.redFlash>0){
    ctx.globalAlpha=game.redFlash*0.5; ctx.fillStyle='#8c1c1c'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1;
  }
  if(game.shopOpen) drawShopPanel();
  if(player.hp<=2 && player.alive){
    const pulse=0.18+0.12*Math.sin(game.time*7);
    ctx.globalAlpha=pulse; ctx.fillStyle='#7a1212';
    ctx.fillRect(0,0,VW,4); ctx.fillRect(0,VH-4,VW,4); ctx.fillRect(0,0,3,VH); ctx.fillRect(VW-3,0,3,VH);
    ctx.globalAlpha=1;
  }
}

function drawTitle(){
  ctx.globalAlpha=0.55; ctx.fillStyle='#0b120d'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1;
  const w=232, h=122, x=Math.round((VW-w)/2), y=4;
  panel(x,y,w,h);
  drawTextC(ctx,'WALDWACHT', VW/2, y+6, PAL.H, 3);
  if(game.best>0){
    const b='BESTE '+game.best;
    drawText(ctx, b, x+w-6-textW(b,1), y+6, PAL.y, 1);
  }
  drawTextC(ctx,'HALTE DIE BOTS VON DER BURG FERN', VW/2, y+30, '#cfe8c2', 1);
  const rows = isTouch ? [
    'LINKER DAUMEN: LAUFEN',
    'RECHTER DAUMEN: ZIELEN',
    'TASTEN: SCHWERT, BOGEN, ROLLE',
    'HEILEN-TASTE: ALLE 15 SEKUNDEN',
    'AB WELLE 3: ULTRA UNTEN LINKS',
    'IN DER RUHE: SHOP UNTEN LINKS'
  ] : [
    'WASD LAUFEN · MAUS ZIELEN',
    'KLICK ODER LEERTASTE: SCHWERT',
    'RECHTSKLICK ODER Q: PFEIL',
    'SHIFT: ROLLE · H: HEILEN (15 S)',
    'AB WELLE 3: X ULTRA · C WECHSELN',
    'B: SHOP · ENTER: WELLE STARTEN'
  ];
  rows.forEach((r,i)=> drawTextC(ctx, r, VW/2, y+43+i*10, '#9fb79a', 1));
  drawTextC(ctx, 'HERZEN LEER ODER TOR KAPUTT = ENDE', VW/2, y+h-12, '#7f927b', 1);
  const blink = Math.floor(game.time*2)%2===0;
  drawTextC(ctx, blink ? (isTouch?'TIPPEN ZUM START':'LEERTASTE ZUM START') : '', VW/2, y+h+5, PAL.y, 1);
}
function drawOver(){
  ctx.globalAlpha=0.6; ctx.fillStyle='#20060a'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1;
  const w=200, h=92, x=Math.round((VW-w)/2), y=Math.round((VH-h)/2)-4;
  panel(x,y,w,h,'rgba(14,8,10,.94)','#7a2a2a');
  drawTextC(ctx,'WALD VERLOREN', VW/2, y+8, PAL.R, 2);
  drawTextC(ctx, game.msg, VW/2, y+26, '#e9c0b0', 1);
  drawTextC(ctx,'WELLEN GEHALTEN: '+Math.max(0,game.wave-1), VW/2, y+40, '#cfe8c2', 1);
  drawTextC(ctx,'BOTS ZERLEGT: '+game.kills, VW/2, y+51, '#cfe8c2', 1);
  drawTextC(ctx,'PUNKTE: '+game.score, VW/2, y+62, PAL.y, 1);
  drawTextC(ctx,'BESTE: '+game.best, VW/2, y+73, '#9fb79a', 1);
  if(game.deadT>1.0 && Math.floor(game.time*2)%2===0)
    drawTextC(ctx, isTouch?'TIPPEN':'LEERTASTE', VW/2, y+h+4, '#cfe8c2', 1);
}
function drawPause(){
  ctx.globalAlpha=0.6; ctx.fillStyle='#0b120d'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1;
  drawTextC(ctx,'PAUSE', VW/2, VH/2-12, PAL.H, 2);
  drawTextC(ctx,'P ODER ESC: WEITER', VW/2, VH/2+6, '#9fb79a', 1);
}

const btnDash=document.getElementById('dashBtn'), btnHeal=document.getElementById('healBtn');
const btnUltra=document.getElementById('ultraBtn');
function render(){
  ctx.setTransform(SS,0,0,SS,0,0);
  ctx.imageSmoothingEnabled=false;
  touchUI.classList.toggle('rest', game.state==='play' && game.phase==='rest');
  const warVersteckt = codeBox.hidden;
  codeBox.hidden = !(game.state==='play' && game.shopOpen);
  if(codeBox.hidden && document.activeElement===codeInput) codeInput.blur();
  if(warVersteckt && !codeBox.hidden) sizeCodeBoxFont();   // Groesse war beim Verstecken 0
  if(btnDash) btnDash.classList.toggle('cool', player.dashCd>0);
  if(btnHeal) btnHeal.classList.toggle('cool', player.healCd>0 || player.hp>=player.maxHp);
  touchUI.classList.toggle('hasUltra', ownedUltras().length>0);
  if(btnUltra) btnUltra.classList.toggle('cool', !ultraReady());
  ctx.fillStyle='#0b120d'; ctx.fillRect(0,0,VW,VH);
  const sh = game.shake>0.5 ? game.shake : 0;      // unter einem halben Pixel: gar nichts
  const sx = sh ? Math.round(rr(-sh,sh)) : 0;
  const sy = sh ? Math.round(rr(-sh,sh)) : 0;
  ctx.save(); ctx.translate(sx,sy);
  drawWorld();
  ctx.restore();
  if(game.state==='play'){ drawHUD(); if(game.paused) drawPause(); }
  else if(game.state==='over'){ drawHUD(); drawOver(); }
  else drawTitle();
}

/* ------------------------------------------------------------------
   15. Schleife
   ------------------------------------------------------------------ */
resetPlayer();
cam.x=clamp(q(player.x-VW/2),0,WW-VW-1); cam.y=clamp(q(player.y-VH/2),0,WH-VH-1);
rollCards();
layoutCodeBox();

let last=performance.now();
const MAXSTEP=1/40;                       // groesster Simulationsschritt
function frame(now){
  requestAnimationFrame(frame);
  // Genau die verstrichene Zeit simulieren — nicht in festen 60-Hz-Paketen.
  // Sonst bewegt sich die Welt bei 120 Hz nur in jedem zweiten Bild und in
  // Doppelschritten: genau das sah wie Wackeln aus.
  let dt=(now-last)/1000; last=now;
  if(!(dt>0)) dt=1/60;
  if(dt>0.2) dt=0.2;
  let rest=dt;
  while(rest>0.00001){ const step=Math.min(rest, MAXSTEP); update(step); rest-=step; }
  render();
}
requestAnimationFrame(frame);

// Zum Herumprobieren in der Konsole
window.WALDWACHT = { game, player, enemies, BOT, UPGRADES, spawnEnemy, startWave };
})();
</script>
