function gateDist(e){
  const cx=clamp(e.x, GATE_RECT.x, GATE_RECT.x+GATE_RECT.w);
  const cy=clamp(e.y, GATE_RECT.y, GATE_RECT.y+GATE_RECT.h);
  return { d:Math.hypot(e.x-cx, e.y-cy), x:cx, y:cy };
}
function explode(e){
  shocks.push({x:e.x, y:e.y-4, r:4, max:30, t:0, col:PAL.O});
  burst(e.x,e.y-4, 30, PAL.O, 140, 0.6, 2); burst(e.x,e.y-4, 16, PAL.R, 100, 0.5);
  SFX.boom(); shake(3);
  if(player.alive && dist(e.x,e.y,player.x,player.y) < 30) hurtPlayer(e.dmg, e.x, e.y);
  for(const o of enemies){
    if(o===e||o.dead) continue;
    if(dist(e.x,e.y,o.x,o.y) < 28) damageEnemy(o, 16, 120, Math.atan2(o.y-e.y,o.x-e.x), false);
  }
  const g=gateDist(e); if(g.d<24) damageCastle(6, g.x, g.y);
  e.hp=0; e.dead=true;
  game.score+=5;
}
function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead) continue;
    e.flash=Math.max(0,e.flash-dt);
    e.anim+=dt*(2.2+Math.hypot(e.vx,e.vy)*0.06);
    if(e.burnT>0){                                   // Feuerklinge brennt nach
      e.burnT-=dt; e.burnAcc=(e.burnAcc||0)+e.burnDps*dt;
      if(e.burnAcc>=1){
        const d=Math.floor(e.burnAcc); e.burnAcc-=d;
        e.hp-=d; e.flash=0.06; chargeUltra(d*0.4);
        if(e.hp<=0){ killEnemy(e); continue; }
      }
      if(Math.random()<dt*22) part(e.x+rr(-4,4), e.y-rr(2,10), rr(-6,6), rr(-24,-10), 0.4,
        Math.random()<0.5?PAL.O:PAL.y, 1);
    }
    if(e.slowT>0){
      e.slowT-=dt;
      if(Math.random()<dt*10) part(e.x+rr(-4,4), e.y-rr(2,8), 0,0, 0.3, PAL.C, 1);
    }
    if(e.spawnT>0){ e.spawnT-=dt; continue; }

    // Ziel waehlen: die Spielfigur, wenn sie draussen und nah ist — sonst das Tor
    const pOut = player.alive && !inRect(player.x,player.y,COURT);
    const dp = pOut ? dist(e.x,e.y,player.x,player.y) : 1e9;
    const onPlayer = dp < e.d.aggro;
    const tx = onPlayer ? player.x : CAS.gatePost.x;
    const ty = onPlayer ? player.y : CAS.gatePost.y;
    const gd = gateDist(e);

    // --- Lenkung: Ziel + Hindernisse + Abstand zu anderen Bots ---
    let ax=0, ay=0;
    let ang=Math.atan2(ty-e.y, tx-e.x);
    const wantRange = e.d.ranged ? e.d.range*0.75 : 0;
    if(e.d.ranged && onPlayer){
      if(dp < wantRange*0.75) ang += Math.PI;                    // zu nah: zurueck
      else if(dp < wantRange)  ang += Math.PI/2*(e.hp%2?1:-1);   // umkreisen
    }
    ax+=Math.cos(ang); ay+=Math.sin(ang);
    for(const s of solids){
      const dx=e.x-s.x, dy=e.y-s.y, d=Math.hypot(dx,dy), rng=s.r+e.r+12;
      if(d<rng && d>0.01){ const w=(1-d/rng)*1.6; ax+=dx/d*w; ay+=dy/d*w; }
    }
    for(const r of WALLS){
      const cx=clamp(e.x,r.x,r.x+r.w), cy=clamp(e.y,r.y,r.y+r.h);
      const dx=e.x-cx, dy=e.y-cy, d=Math.hypot(dx,dy), rng=e.r+10;
      if(d<rng && d>0.01){ const w=(1-d/rng)*1.4; ax+=dx/d*w; ay+=dy/d*w; }
    }
    for(const o of enemies){
      if(o===e||o.dead) continue;
      const dx=e.x-o.x, dy=e.y-o.y, d2=dx*dx+dy*dy, rng=e.r+o.r+2;
      if(d2<rng*rng && d2>0.01){ const d=Math.sqrt(d2), w=(1-d/rng)*1.1; ax+=dx/d*w; ay+=dy/d*w; }
    }
    const al=Math.hypot(ax,ay)||1; ax/=al; ay/=al;
    e.ang=Math.atan2(ay,ax);

    let spd = e.d.speed * (inBush(e.x,e.y)?0.75:1) * (e.slowT>0?0.5:1);
    if(e.d.boss && e.hp < e.hpMax*0.5) spd *= 1.35;          // angeschlagen wird er wild
    if(e.st!=='walk') spd *= (e.st==='windup'?0.25:0.5);
    if(e.st==='fuse') spd *= 1.35;
    e.vx = lerp(e.vx, ax*spd, 1-Math.pow(0.002,dt));
    e.vy = lerp(e.vy, ay*spd, 1-Math.pow(0.002,dt));
    e.x += (e.vx+e.kx)*dt; e.y += (e.vy+e.ky)*dt;
    e.kx*=Math.pow(0.0009,dt); e.ky*=Math.pow(0.0009,dt);
    collideWorld(e,true);
    if(Math.abs(e.vx)>4) e.flip = e.vx<0;

    // --- Kampfzustaende ---
    e.cd=Math.max(0,e.cd-dt);
    const reachP = onPlayer && dp < e.d.range + player.r + 2;
    const reachG = !onPlayer && gd.d < (e.d.ranged ? e.d.range : e.d.range*0.8);
    if(e.st==='walk'){
      if(e.cd<=0 && (reachP || reachG || (e.d.ranged && onPlayer && dp<e.d.range)
                     || (e.d.bossKind==='kolossus' && onPlayer && dp<150))){
        e.st = e.d.fuse ? 'fuse' : 'windup'; e.t=0;
        e.aimX = onPlayer ? player.x : gd.x; e.aimY = onPlayer ? player.y : gd.y;
      }
    } else if(e.st==='windup'){
      e.t+=dt;
      if(e.d.lunge && e.t<e.d.windup*0.5){ e.vx*=0.6; e.vy*=0.6; }
      if(e.t>=e.d.windup){
        strike(e, onPlayer, gd);
        e.st='cool'; e.t=0; e.cd=e.d.cd;
      }
    } else if(e.st==='cool'){
      e.t+=dt; if(e.t>=e.d.cd*0.45){ e.st='walk'; e.t=0; }
    } else if(e.st==='fuse'){
      e.t+=dt;
      if(Math.random()<dt*14) part(e.x+rr(-4,4), e.y-8, rr(-8,8), rr(-24,-8), 0.3, PAL.y,1);
      if(e.t>=e.d.windup) explode(e);
    }

    // --- Boss ruft Verstaerkung ---
    if(e.d.boss){
      const isUltra = e.d.bossKind==='ultra';
      e.callT=(e.callT||(isUltra?4:6))-dt;
      if(e.callT<=0 && enemies.filter(x=>!x.dead).length<44){
        const wut = e.hp < e.hpMax*0.5;
        const ruf = (e.d.bossKind==='golem'||isUltra) ? 'bruiser' : 'scout';
        e.callT = isUltra ? (wut?3:4) : (wut?5:7);
        for(let i=0;i<(wut?3:2)+(isUltra?1:0);i++) spawnEnemy(ruf, e.x+rr(-24,24), e.y+rr(-16,16));
        burst(e.x,e.y-10,14,PAL.C,70,0.5);
      }
    }
  }
  // Aufraeumen
  for(let i=enemies.length-1;i>=0;i--) if(enemies[i].dead) enemies.splice(i,1);
}
function strike(e, onPlayer, gd){
  const d=e.d;
  if(d.lunge){ e.kx+=Math.cos(e.ang)*90; e.ky+=Math.sin(e.ang)*90; }
  if(d.ranged){
    const tx = onPlayer ? player.x : gd.x, ty = onPlayer ? (player.y-6) : gd.y;
    const a=Math.atan2(ty-(e.y-6), tx-e.x);
    bullets.push({x:e.x+Math.cos(a)*6, y:e.y-6+Math.sin(a)*6, vx:Math.cos(a)*104, vy:Math.sin(a)*104,
                  dmg:e.dmg, t:0, col:PAL.P});
    SFX.shoot(); return;
  }
  if(d.boss){
    const wut = e.hp < e.hpMax*0.5;                      // zweite Phase: er dreht durch
    if(d.bossKind==='golem'){
      // Reiner Nahkaempfer: ein einzelner, aber schwerer und weitreichender Stampfer
      shocks.push({x:e.x, y:e.y+2, r:10, max:wut?78:60, t:0, col:PAL.O});
      if(wut) shocks.push({x:e.x, y:e.y+2, r:5, max:40, t:0, col:PAL.y});
      shake(3.5); SFX.boom();
      burst(e.x,e.y+2, wut?36:26, PAL.O, 120, 0.6);
      const rad = wut?68:54;
      if(player.alive && dist(e.x,e.y,player.x,player.y) < rad) hurtPlayer(e.dmg, e.x, e.y);
      if(gd.d < rad-14) damageCastle(d.gateDmg, gd.x, gd.y);
      return;
    }
    if(d.bossKind==='shadow'){
      // Kurzer Teleportsprung aufs Ziel zu, dann ein schneller Klingenwirbel
      const tx=onPlayer?player.x:gd.x, ty=onPlayer?player.y:gd.y;
      const a0=Math.atan2(ty-e.y, tx-e.x);
      e.x += Math.cos(a0)*(wut?34:24); e.y += Math.sin(a0)*(wut?34:24);
      collideWorld(e,true);
      burst(e.x,e.y-8,20,PAL.p,110,0.4);
      slashes.push({x:e.x,y:e.y-8,ang:a0,arc:wut?3.0:2.3,reach:32,t:0,dur:0.2,heavy:true});
      SFX.swing(); SFX.dash(); shake(1.6);
      if(player.alive && dist(e.x,e.y,player.x,player.y) < 36) hurtPlayer(e.dmg, e.x, e.y);
      if(gd.d < 34) damageCastle(d.gateDmg, gd.x, gd.y);
      return;
    }
    if(d.bossKind==='ultra'){
      // Endgegner: wechselt zwischen allen drei Angriffsmustern der anderen
      // Bosse, wird schon ab 65% Leben wuetend und schlaegt haerter zu.
      const wutU = e.hp < e.hpMax*0.65;
      e.atkCycle = ((e.atkCycle||0)+1) % 3;
      const dpU = player.alive ? dist(e.x,e.y,player.x,player.y) : 1e9;
      if(e.atkCycle===0){
        shocks.push({x:e.x, y:e.y+2, r:11, max:wutU?96:76, t:0, col:PAL.R});
        shocks.push({x:e.x, y:e.y+2, r:5, max:wutU?58:44, t:0, col:PAL.y});
        shake(4.5); SFX.boom();
        burst(e.x,e.y+2, wutU?44:32, PAL.y, 130, 0.6);
        const rad = wutU?88:70;
        if(player.alive && dpU<rad) hurtPlayer(e.dmg, e.x, e.y);
        if(gd.d<rad-16) damageCastle(d.gateDmg, gd.x, gd.y);
      } else if(e.atkCycle===1){
        const n = wutU?11:8, speed=wutU?98:80;
        const basis = Math.atan2((player.y-6)-(e.y-14), player.x-e.x);
        for(let i=0;i<n;i++){
          const a = basis + (i-(n-1)/2) * (1.15/Math.max(1,n-1));
          bullets.push({ x:e.x+Math.cos(a)*13, y:e.y-14+Math.sin(a)*11,
            vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, dmg:3, t:0, col:PAL.y });
        }
        SFX.shoot(); SFX.heavy(); shake(1.6);
      } else {
        const tx=player.alive?player.x:gd.x, ty=player.alive?player.y:gd.y;
        const a0=Math.atan2(ty-e.y, tx-e.x);
        e.x += Math.cos(a0)*(wutU?40:30); e.y += Math.sin(a0)*(wutU?40:30);
        collideWorld(e,true);
        burst(e.x,e.y-10,26,PAL.y,120,0.45);
        slashes.push({x:e.x,y:e.y-10,ang:a0,arc:wutU?3.4:2.8,reach:38,t:0,dur:0.22,heavy:true});
        SFX.swing(); SFX.dash(); shake(2.2);
        if(player.alive && dist(e.x,e.y,player.x,player.y)<42) hurtPlayer(e.dmg, e.x, e.y);
        if(gd.d<40) damageCastle(d.gateDmg, gd.x, gd.y);
      }
      return;
    }
    const dp = player.alive ? dist(e.x,e.y,player.x,player.y) : 1e9;
    if(dp < 52 || !onPlayer){
      // Stampfer: Druckwelle am Boden
      shocks.push({x:e.x, y:e.y+2, r:8, max:wut?62:48, t:0, col:PAL.R});
      if(wut) shocks.push({x:e.x, y:e.y+2, r:4, max:36, t:0, col:PAL.O});
      shake(2.5); SFX.boom();
      burst(e.x,e.y+2, wut?30:22, PAL.n, 110, 0.55);
      if(player.alive && dp < (wut?58:46)) hurtPlayer(e.dmg, e.x, e.y);
      if(gd.d<38) damageCastle(d.gateDmg, gd.x, gd.y);
    } else {
      // Salve aus den Schulterwerfern
      const n = wut?7:5, weite=wut?0.95:0.6, speed=wut?85:68;   // langsam genug zum Ausweichen
      const basis = Math.atan2((player.y-6)-(e.y-12), player.x-e.x);
      for(let i=0;i<n;i++){
        const a = basis + (i-(n-1)/2) * (weite/(n-1));
        bullets.push({ x:e.x+Math.cos(a)*11, y:e.y-12+Math.sin(a)*9,
          vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, dmg:2, t:0, col:PAL.R });
      }
      SFX.shoot(); SFX.heavy(); shake(1.2);
    }
    return;
  }
  if(onPlayer){
    if(dist(e.x,e.y,player.x,player.y) < d.range+player.r+5){
      hurtPlayer(e.dmg, e.x, e.y);
      if(player.thorns>0) damageEnemy(e, player.thorns, 60, Math.atan2(e.y-player.y,e.x-player.x), false);
    } else {                                    // daneben — kleine Staubwolke
      burst(e.x+Math.cos(e.ang)*8, e.y+Math.sin(e.ang)*8, 4, '#7a6a4a', 30, 0.3);
    }
  } else if(gd.d < d.range){
    damageCastle(d.gateDmg||d.dmg, gd.x, gd.y);
  }
}

/* ------------------------------------------------------------------
   11. Geschosse, Beute, Partikel
   ------------------------------------------------------------------ */
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.t+=dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
    let gone = b.t>3.5 || b.x<4||b.x>WW-4||b.y<8||b.y>WH-4;
    if(!gone) for(const s of solids) if(dist2(b.x,b.y+4,s.x,s.y) < s.r*s.r*0.8){ gone=true; break; }
    if(!gone) for(const r of WALLS) if(inRect(b.x,b.y+4,r)){ gone=true; break; }
    if(b.own){
      if(!gone) for(const e of enemies){
        if(e.dead || e.spawnT>0) continue;
        if(dist(b.x, b.y, e.x, e.y-e.r*0.7) < e.r+3.5){
          damageEnemy(e, b.dmg, 80, Math.atan2(b.vy,b.vx), false);
          if(player.ice>0 && !e.dead) e.slowT=1.8;
          gone=true; break;
        }
      }
    } else {
      if(!gone && inRect(b.x,b.y+4,GATE_RECT)){ damageCastle(1,b.x,b.y); gone=true; }
      if(!gone && player.alive && player.inv<=0 && dist(b.x,b.y,player.x,player.y-6) < 6.5){
        hurtPlayer(b.dmg, b.x, b.y); gone=true;
      }
    }
    if(gone){ burst(b.x,b.y,5,b.col,50,0.25); bullets.splice(i,1); continue; }
    if(!b.own && Math.random()<dt*30) part(b.x,b.y,0,0,0.25,b.col,1);
  }
}
function updateDrops(dt){
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.t+=dt;
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.vx*=Math.pow(0.02,dt); d.vy*=Math.pow(0.02,dt);
    d.vz-=140*dt; d.z+=d.vz*dt;
    if(d.z<0){ d.z=0; d.vz*=-0.42; }
    if(player.alive){
      const dd=dist(d.x,d.y,player.x,player.y);
      const mag = d.type==='heart' ? player.magnet*0.8 : player.magnet;
      if(dd<mag && d.t>0.25){
        const a=Math.atan2(player.y-d.y, player.x-d.x), s=(1-dd/mag)*260+40;
        d.vx=lerp(d.vx,Math.cos(a)*s,0.25); d.vy=lerp(d.vy,Math.sin(a)*s,0.25);
      }
      if(dd<7){
        if(d.type==='scrap'){ game.scrap++; game.score+=3; SFX.pick(); }
        else { player.hp=Math.min(player.maxHp, player.hp+2); SFX.heal();
               floater(player.x,player.y-20,'HERZ',PAL.R); }
        burst(d.x,d.y,4,d.type==='heart'?PAL.R:PAL.M,40,0.25);
        drops.splice(i,1); continue;
      }
    }
    if(d.t>32) drops.splice(i,1);
  }
}
function updateFX(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt;
    p.vx*=Math.pow(0.25,dt); p.vy*=Math.pow(0.25,dt);
  }
  for(let i=slashes.length-1;i>=0;i--){ const s=slashes[i]; s.t+=dt; if(s.t>=s.dur) slashes.splice(i,1); }
  for(let i=shocks.length-1;i>=0;i--){
    const s=shocks[i]; s.t+=dt; s.r+=(s.max-s.r)*Math.min(1,dt*7);
    if(s.r>s.max-1.5) shocks.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.t+=dt; f.y-=14*dt; if(f.t>1) floaters.splice(i,1); }
  for(let i=blitze.length-1;i>=0;i--){ const b=blitze[i]; b.t+=dt; if(b.t>=b.dur) blitze.splice(i,1); }
  updateRoots(dt);
}

/* ------------------------------------------------------------------
   12. Haupt-Aktualisierung
   ------------------------------------------------------------------ */
let lastTap=null;
const SHOP = { w:176, h:132 };
function shopPanelRect(){ return { x:Math.round((VW-SHOP.w)/2), y:Math.round((VH-SHOP.h)/2)-4, w:SHOP.w, h:SHOP.h }; }
function shopBtnRect(){ return { x:VW-52, y:VH-22, w:48, h:16 }; }   // HUD-Koordinaten, unten rechts (Kampftasten sind in der Ruhe aus)
const ULTRA_LABEL = 'SUPERKRÄFTE!';
function ultraBtnRect(){
  if(!ownedUltras().length) return null;
  return { x:4, y:53, w:textW(ULTRA_LABEL,1)+14, h:11 };   // +14 fuer das Blitzsymbol
}
// Aufgeklappte Listen erscheinen rechts neben ihrem Knopf, damit sie die
// Knoepfe darunter nicht verdecken.
function ultraMenuRect(){
  const p=ultraBtnRect(), n=ownedUltras().length;
  return { x:p.x+p.w+3, y:p.y, w:118, h:n*12+4 };
}
function ultraMenuRowRect(i){
  const m=ultraMenuRect();
  return { x:m.x+2, y:m.y+2+i*12, w:m.w-4, h:11 };
}
// Knoepfe untereinander, gleich breit wie SUPERKRAEFTE! (bzw. an dessen
// Stelle, solange es noch kein Ultra gibt).
const HUD_BTN_W = textW('EINSTELLUNGEN',1)+17;
function hudBtnRowY(){ const u=ultraBtnRect(); return u ? u.y+u.h+2 : 45; }
function guideBtnRect(){
  if(isTouch) return null;                         // Tastenliste gilt nur fuer Tastatur/Maus
  return { x:4, y:hudBtnRowY(), w:HUD_BTN_W, h:11 };
}
function levelInfoBtnRect(){
  const g=guideBtnRect();
  return { x:4, y:g ? g.y+g.h+2 : hudBtnRowY(), w:HUD_BTN_W, h:11 };
}
function settingsHudBtnRect(){
  const l=levelInfoBtnRect();
  return { x:4, y:l.y+l.h+2, w:HUD_BTN_W, h:11 };
}
// Ultra-Leiste selbst antippbar: loest das Ultra aus (fuer Maus-Spieler)
function ultraBarRect(){ return activeUltra() ? { x:2, y:43, w:66, h:9 } : null; }
function closeHudMenus(){ game.ultraMenuOpen=false; game.guideOpen=false; game.levelInfoOpen=false; }
function cardRects(){
  if(!game.shopOpen) return [];
  const p=shopPanelRect();
  return game.cards.map((c,i)=>({ x:p.x+5, y:p.y+16+i*20, w:p.w-10, h:20, i }));
}
function codeRowRect(){
  const p=shopPanelRect();
  return { x:p.x+5, y:p.y+SHOP.h-18, w:p.w-10, h:16 };
}
const hitRect=(t,r)=> t.x>=r.x && t.x<=r.x+r.w && t.y>=r.y && t.y<=r.y+r.h;
function tryTapCards(){
  if(!lastTap || game.state!=='play') return false;
  const tl = toHud(lastTap, 0, 0);                 // Tipp in HUD-Koordinaten (oben links verkleinert)
  if(game.ultraMenuOpen){
    const o=ownedUltras();
    for(let i=0;i<o.length;i++) if(hitRect(tl, ultraMenuRowRect(i))){
      player.ultraSel=i; game.ultraMenuOpen=false; game.ultraNameT=5; SFX.pick(); return true;
    }
    if(!hitRect(tl, ultraMenuRect()) && !hitRect(tl, ultraBtnRect())) game.ultraMenuOpen=false;
    return true;
  }
  // Anleitung/Level-Liste offen: jeder Tipp schliesst sie wieder (Knopf selbst = umschalten)
  if(game.guideOpen || game.levelInfoOpen){
    const gb=guideBtnRect(), lb=levelInfoBtnRect();
    const wasGuide=game.guideOpen, wasLevel=game.levelInfoOpen;
    closeHudMenus();
    if(gb && hitRect(tl, gb) && !wasGuide){ game.guideOpen=true; }
    if(hitRect(tl, lb) && !wasLevel){ game.levelInfoOpen=true; }
    SFX.pick(); return true;
  }
  if(!game.shopOpen){
    const ub=ultraBtnRect(), gb=guideBtnRect(), lb=levelInfoBtnRect(), bar=ultraBarRect();
    if(ub && hitRect(tl, ub)){ const o=!game.ultraMenuOpen; closeHudMenus(); game.ultraMenuOpen=o; SFX.pick(); return true; }
    if(gb && hitRect(tl, gb)){ closeHudMenus(); game.guideOpen=true; SFX.pick(); return true; }
    if(hitRect(tl, lb)){ closeHudMenus(); game.levelInfoOpen=true; SFX.pick(); return true; }
    if(hitRect(tl, settingsHudBtnRect())){ closeHudMenus(); game.settingsOpen=true; SFX.pick(); return true; }
    if(bar && hitRect(tl, bar)){ fireUltra(); return true; }
  }
  if(game.phase==='rest' && hitRect(toHud(lastTap, VW, VH), shopBtnRect())){
    game.shopOpen=!game.shopOpen; game.ultraMenuOpen=false; SFX.pick(); return true;
  }
  if(game.shopOpen){
    for(const r of cardRects()) if(hitRect(lastTap,r)){ buyCard(r.i); return true; }
    if(!hitRect(lastTap, shopPanelRect())){ game.shopOpen=false; SFX.pick(); }
    return true;
  }
  return false;
}
function update(dt){
  readInput();
  game.time+=dt; game.dt=dt;
  const startEdge = pressed.has(' ')||pressed.has('Enter')||pressed.has('__attack')||pressed.has('e');
  if(pressed.has('m')){ muted=!muted; applyAudio(); }
  if(game.settingsOpen){ updateSettings(); return; }   // Einstellungen offen: Spiel steht

  if(game.state==='title'){
    if(game.helpOpen){
      if((lastTap && !hitRect(lastTap, helpPanelRect())) || pressed.has('Escape') || pressed.has('?') || pressed.has('F1'))
        game.helpOpen=false;
      lastTap=null; pressed.clear(); return;
    }
    if(game.levelSelectOpen){
      if(lastTap){
        for(let i=0;i<LEVELS.length;i++){
          if(hitRect(lastTap, levelRowRect(i))){
            const L=LEVELS[i];
            if(L.n<=getUnlockedLevel()){ audioUnlock(); startLevel(L.n); SFX.pick(); }
            else SFX.no();
            lastTap=null; pressed.clear(); return;
          }
        }
        if(!hitRect(lastTap, levelSelectPanelRect())) game.levelSelectOpen=false;
      }
      if(pressed.has('Escape')) game.levelSelectOpen=false;
      lastTap=null; pressed.clear(); return;
    }
    if(lastTap){
      if(hitRect(lastTap, levelBtnRect())){ game.levelSelectOpen=true; SFX.pick(); lastTap=null; pressed.clear(); return; }
      if(hitRect(lastTap, settingsBtnTitleRect())){ game.settingsOpen=true; SFX.pick(); lastTap=null; pressed.clear(); return; }
      if(hitRect(lastTap, helpBtnRect())){ game.helpOpen=true; SFX.pick(); lastTap=null; pressed.clear(); return; }
      for(const b of saveSlotRects()){
        if(hitRect(lastTap, b)){ audioUnlock(); hasSave(b.slot) ? continueGame(b.slot) : newGame(b.slot); lastTap=null; pressed.clear(); return; }
      }
    }
    for(let s=1; s<=SAVE_SLOTS; s++){
      if(pressed.has(String(s))){ audioUnlock(); hasSave(s) ? continueGame(s) : newGame(s); lastTap=null; pressed.clear(); return; }
    }
    if(pressed.has('l')){ game.levelSelectOpen=true; lastTap=null; pressed.clear(); return; }
    if(pressed.has('?') || pressed.has('F1')){ game.helpOpen=true; lastTap=null; pressed.clear(); return; }
    if(startEdge){ audioUnlock(); hasSave(1) ? continueGame(1) : newGame(1); }
    lastTap=null; pressed.clear(); return;
  }
  if(game.state==='over'){
    game.slow=Math.max(0,game.slow-dt);
    updateFX(dt*0.4);
    if(game.deadT===undefined) game.deadT=0;
    game.deadT+=dt;
    if(startEdge && game.deadT>1.0){ game.deadT=undefined; game.state='title'; }
    pressed.clear(); return;
  }
  if(game.state==='levelwin'){
    updateFX(dt*0.4);
    game.slow=Math.max(0,game.slow-dt);
    if(game.winT===undefined) game.winT=0;
    game.winT+=dt;
    if(startEdge && game.winT>0.8){ game.winT=undefined; game.state='title'; game.levelSelectOpen=true; }
    pressed.clear(); return;
  }
  if(game.paused && game.helpOpen){
    // Steuerungs-Uebersicht in der Pause: Esc/?/F1 schliesst nur die Uebersicht
    if(pressed.has('Escape')||pressed.has('?')||pressed.has('F1')||pressed.has('p')) game.helpOpen=false;
    lastTap=null; pressed.clear(); return;
  }
  if(pressed.has('p')||pressed.has('Escape')) game.paused=!game.paused;
  if(!game.paused) game.helpOpen=false;
  if(game.paused){
    if(pressed.has('?')||pressed.has('F1')){ game.helpOpen=true; lastTap=null; pressed.clear(); return; }
    // Pause ist "sticky": nur P/Esc oder der Pause-Knopf setzen fort - kein
    // Tippen irgendwo im Bild, damit ein App-Wechsel oder ein Bildschirm-Aus
    // das Spiel nie versehentlich wieder loslaufen laesst.
    if(pressed.has('s')){
      if(saveGame()){ say('GESPEICHERT', 1.4, PAL.H); SFX.pick(); }
      else{ say('SPEICHERN NICHT MÖGLICH', 1.8, PAL.R); SFX.no(); }
    }
    lastTap=null; pressed.clear(); return;
  }

  // Werkstatt
  if(game.phase==='rest'){
    if(pressed.has('b')||pressed.has('Tab')) game.shopOpen=!game.shopOpen;
    if(pressed.has('1')){ game.shopOpen=true; buyCard(0); }
    if(pressed.has('2')){ game.shopOpen=true; buyCard(1); }
    if(pressed.has('3')){ game.shopOpen=true; buyCard(2); }
    if(pressed.has('4')){ game.shopOpen=true; buyCard(3); }
    if((pressed.has('Enter')||pressed.has('e')) && game.restT>0.6){ game.shopOpen=false; game.restT=0.3; }
  } else game.shopOpen=false;
  if(tryTapCards()) IN.attackEdge=false;
  lastTap=null;

  // Trefferstopp und Zeitlupe
  let sim=dt;
  if(game.hitstop>0){ game.hitstop-=dt; sim*=0.08; }
  if(game.slow>0){ game.slow-=dt; sim*=0.4; }

  updatePlayer(sim);
  updateEnemies(sim);
  updateBullets(sim);
  updateDrops(sim);
  updateFX(sim);

  // Turmwache: die Burg feuert auf alles in Torna(e)he
  if(game.turret>0){
    game.turretT-=sim;
    if(game.turretT<=0){
      // Bescheidene Unterstuetzung, kein Ersatz fuer die eigene Klinge:
      // Stufe 1 etwa alle 2,6s, Stufe 3 (Maximum) etwa zweimal in zwei Sekunden.
      game.turretT = 3.4 - game.turret*0.8;
      let ziel=null, bd=90*90;
      for(const e of enemies){
        if(e.dead||e.spawnT>0) continue;
        const d2=dist2(CAS.gatePost.x, CAS.gatePost.y, e.x, e.y);
        if(d2<bd){ bd=d2; ziel=e; }
      }
      if(ziel){
        const a=Math.atan2(ziel.y-CAS.gatePost.y, ziel.x-CAS.gatePost.x);
        bullets.push({ x:CAS.gatePost.x, y:CAS.gatePost.y-8,
          vx:Math.cos(a)*170, vy:Math.sin(a)*170,
          dmg:1+game.turret, t:0, col:PAL.S, own:true });
        SFX.bow();
      }
    }
  }

  // Wellenablauf
  if(game.phase==='wave'){
    doSpawns(sim);
    if(!game.spawnList.length && enemies.length===0){
      const lvl = game.levelMode ? LEVELS[game.levelMode-1] : null;
      if(lvl && (lvl.finalBoss || game.wave>=lvl.target)) winLevel(); else endWave();
    }
  } else {
    if(!game.shopOpen) game.restT-=dt;        // in Ruhe stoebern
    if(game.restT<=0) startWave();
  }

  // Kamera: fest auf die Spielfigur gerastert — kein Vorhalten, kein Nachziehen,
  // dadurch steht das Bild relativ zum Helden absolut ruhig.
  cam.x = clamp(q(player.x - VW/2), 0, WW-VW-1);
  cam.y = clamp(q(player.y - VH/2), 0, WH-VH-1);

  game.shake=Math.max(0,game.shake-dt*22);
  game.flash=Math.max(0,game.flash-dt*2);
  game.redFlash=Math.max(0,game.redFlash-dt*2);
  game.white=Math.max(0,(game.white||0)-dt*3.2);
  game.msgT=Math.max(0,game.msgT-dt);
  if(game.msgT<=0 && MSGQ.length){ const m=MSGQ.shift(); game.msg=m.txt; game.msgT=m.dur; game.msgCol=m.col; }
  game.tutorial=Math.max(0,game.tutorial-dt);
  game.ultraNameT=Math.max(0,game.ultraNameT-dt);
  musicTick();
  pressed.clear();
}

/* ------------------------------------------------------------------
   13. Zeichnen
   ------------------------------------------------------------------ */
function drawSpr(s, x, y, flip, flash, scale=1){
  const img = flash ? s.flash : s.img;
  x=q(x); y=q(y);
  if(scale!==1){
    ctx.save();
    if(flip){ ctx.translate(x+s.w*scale, y); ctx.scale(-scale,scale); } else { ctx.translate(x,y); ctx.scale(scale,scale); }
    ctx.drawImage(img,0,0);
    ctx.restore();
    return;
  }
  if(flip){ ctx.save(); ctx.translate(x+s.w, y); ctx.scale(-1,1); ctx.drawImage(img,0,0); ctx.restore(); }
  else ctx.drawImage(img, x, y);
}
function shadow(x,y,w,a=0.28){
  ctx.globalAlpha=a;
  pxDisc(ctx, Math.round(x), Math.round(y)-1, w/2, '#0a1408');
  ctx.globalAlpha=1;
}
function pxLine(x0,y0,x1,y1,col,th=1){
  ctx.fillStyle=col;
  const dx=x1-x0, dy=y1-y0, n=Math.max(Math.abs(dx),Math.abs(dy))|0;
  for(let i=0;i<=n;i++){
    const x=Math.round(x0+dx*i/n), y=Math.round(y0+dy*i/n);
    ctx.fillRect(x,y,th,th);
  }
}
function panel(x,y,w,h,bg='rgba(10,18,12,.86)',bd='#2f5c31'){
  ctx.fillStyle=bg; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=bd; ctx.fillRect(x,y,w,1); ctx.fillRect(x,y+h-1,w,1);
  ctx.fillRect(x,y,1,h); ctx.fillRect(x+w-1,y,1,h);
  ctx.fillStyle='#141019'; ctx.fillRect(x+1,y+1,1,1); ctx.fillRect(x+w-2,y+1,1,1);
  ctx.fillRect(x+1,y+h-2,1,1); ctx.fillRect(x+w-2,y+h-2,1,1);
}

function drawSlash(s){
  const p=clamp(s.t/s.dur,0,1);
  const cur = s.ang - s.arc*0.5 + s.arc*p;
  const span = s.arc*0.5;
  const r0=s.reach*0.5, r1=s.reach;
  for(let k=0;k<7;k++){
    const a = cur - span*(k/7);
    if(a < s.ang-s.arc*0.5) break;
    const fade = 1-k/7;
    ctx.fillStyle = s.heavy ? (k<2?'#fff3c4':(k<4?PAL.O:PAL.o)) : (k<2?'#ffffff':(k<4?'#dff0ff':PAL.C));
    ctx.globalAlpha = fade*(1-p*0.35);
    const rr0 = r0 + (1-fade)*3;
    for(let r=rr0; r<=r1; r+=1.1){
      const x=Math.round(s.x+Math.cos(a)*r), y=Math.round(s.y+Math.sin(a)*r*0.85);
      ctx.fillRect(x,y,1,1);
    }
  }
  ctx.globalAlpha=1;
}
// Heldenname klein ueber dem Kopf (2/3 Groesse wie das HUD, weiter pixelscharf)
function drawHeroName(){
  const n=heroName(); if(!n || !player.alive) return;
  ctx.save(); ctx.translate(q(player.x), q(player.y)-22); ctx.scale(HUDK,HUDK);
  drawText(ctx, n, -Math.round(textW(n,1)/2), 0, '#e9f5dc', 1);
  ctx.restore();
}
function drawPlayer(){
  const p=player;
  shadow(p.x, p.y, 11);
  drawHeroName();
  // --- Rolle: eingerollte Figur, die sich einmal ueberschlaegt ---
  if(p.dashT>0){
    const t=1-clamp(p.dashT/0.22,0,1);
    const dir=Math.cos(p.dashDir)>=0 ? 1 : -1;
    ctx.save();
    ctx.translate(Math.round(p.x), Math.round(p.y-6));
    ctx.rotate(t*TAU*1.15*dir);
    ctx.drawImage(SPR.roll.img, -7, -7);
    ctx.restore();
    return;
  }
  const moving=Math.hypot(p.vx,p.vy)>12;
  const fr = moving ? WALK_CYCLE[Math.floor(p.anim*7)%4] : 0;
  const set = p.face==='side' ? SPR.pSide : (p.face==='up' ? SPR.pUp : SPR.pDown);
  const s=set[fr];
  const px=p.x-8, py=p.y-15;
  // Schwert in der Hand (zeigt in Zielrichtung)
  const hx=p.x+Math.cos(p.aim)*5, hy=p.y-8+Math.sin(p.aim)*4;
  const tipx=hx+Math.cos(p.aim)*8, tipy=hy+Math.sin(p.aim)*7;
  const behind = Math.sin(p.aim) < -0.35;
  if(behind && !p.swing){ pxLine(hx,hy,tipx,tipy,PAL.M); pxLine(hx,hy+1,tipx,tipy+1,PAL.K); }
  if(p.shootT>0){                                   // Bogen kurz sichtbar
    const bx=p.x+Math.cos(p.aim)*6, by=p.y-8+Math.sin(p.aim)*5, n=p.aim+Math.PI/2;
    pxLine(bx+Math.cos(n)*4, by+Math.sin(n)*3, bx-Math.cos(n)*4, by-Math.sin(n)*3, PAL.B);
    pxLine(bx+Math.cos(n)*3+Math.cos(p.aim), by+Math.sin(n)*2, bx-Math.cos(n)*3+Math.cos(p.aim), by-Math.sin(n)*2, PAL.n);
  }
  const blink = p.inv>0 && Math.floor(p.inv*18)%2===0;
  if(!blink) drawSpr(s, px, py, p.flip, p.hurtT>0);
  if(!behind && !p.swing){ pxLine(hx,hy+1,tipx,tipy+1,PAL.K); pxLine(hx,hy,tipx,tipy,PAL.w); }
}
function drawEnemy(e){
  const s = e.d.spr[Math.floor(e.anim)%2];
  const scale = e.d.scale||1;
  const bob = (e.st==='walk') ? (Math.floor(e.anim)%2) : 0;
  const x=e.x-s.w*scale/2, y=e.y-s.h*scale+2-bob;
  shadow(e.x, e.y, e.r*2.1);
  let flash = e.flash>0;
  if(e.st==='windup' && e.t > e.d.windup*0.45) flash = Math.floor(e.t*22)%2===0;
  if(e.st==='fuse') flash = Math.floor(e.t*(6+e.t*22))%2===0;
  if(e.spawnT>0){ ctx.globalAlpha=0.35+0.65*(1-e.spawnT/0.35); }
  drawSpr(s, x, y, e.flip, flash, scale);
  ctx.globalAlpha=1;
  // Lebensbalken fuer dicke Brocken
  if((e.d.boss || e.hpMax>30) && e.hp<e.hpMax){
    const w=Math.round(s.w*scale*0.9), bx=Math.round(e.x-w/2), by=Math.round(y-4);
    ctx.fillStyle='#141019'; ctx.fillRect(bx-1,by-1,w+2,4);
    ctx.fillStyle=PAL.r; ctx.fillRect(bx,by,Math.round(w*e.hp/e.hpMax),2);
  }
}
function drawBlitz(b){
  const a = 1 - b.t/b.dur, oben = b.y-78, n = 10;
  let px = b.x + Math.sin(b.seed)*9, py = oben;
  ctx.globalAlpha = Math.max(0, a);
  for(let i=1;i<=n;i++){
    const f=i/n;
    const nx = b.x + (1-f)*Math.sin(b.seed + i*2.7)*13;
    const ny = oben + (b.y-oben)*f;
    pxLine(px, py, nx, ny, i%3===0 ? PAL.C : '#ffffff', 1);
    if(i%3===1) pxLine(nx, ny, nx + Math.sin(b.seed+i*1.7)*8, ny+6, PAL.C, 1);
    px=nx; py=ny;
  }
  ctx.globalAlpha=1;
}
function drawRoot(r){
  const x=Math.round(r.x), y=Math.round(r.y);
  if(r.delay>0){
    // Erde reisst kurz auf, bevor die Wurzel hochschiesst
    ctx.fillStyle=PAL.K; ctx.fillRect(x-2,y,5,1);
    ctx.fillStyle=PAL.b; ctx.fillRect(x-1,y,3,1);
    if(r.delay<0.12){ ctx.fillStyle=PAL.n; ctx.fillRect(x,y-1,1,1); }
    return;
  }
  const p=clamp(r.t/r.dur,0,1);
  const riseP=clamp(p/0.3,0,1);
  const rise=riseP*(2-riseP);                         // ease-out Hochschiessen
  const overshoot = (riseP>0.7 && riseP<1) ? Math.sin((riseP-0.7)/0.3*Math.PI)*0.15 : 0;
  const h=r.h*(rise+overshoot);
  const fade = p>0.65 ? Math.max(0,1-(p-0.65)/0.35) : 1;
  ctx.globalAlpha=fade;
  const segs=Math.max(3,Math.round(h));
  // dunkler Kernschatten zuerst, damit die Wurzel sich vom Gras/Weg abhebt
  for(let i=0;i<segs;i++){
    const f=i/segs;
    const yy=y-i;
    const xx=Math.round(x + r.lean*i*0.5 + Math.sin(r.seed+i*0.8)*0.6*(1-f));
    const wOut=Math.max(2, Math.round(5*(1-f*0.85)));
    ctx.fillStyle=PAL.K; ctx.fillRect(xx-(wOut>>1)-1, yy, wOut+1, 1);
  }
  for(let i=0;i<segs;i++){
    const f=i/segs;
    const yy=y-i;
    const xx=Math.round(x + r.lean*i*0.5 + Math.sin(r.seed+i*0.8)*0.6*(1-f));
    const w=Math.max(1, Math.round(4*(1-f*0.8)));
    ctx.fillStyle = f<0.15 ? PAL.b : (f<0.6 ? PAL.B : PAL.n);
    ctx.fillRect(xx-(w>>1), yy, w, 1);
  }
  if(riseP>=1){
    const tipX=Math.round(x+r.lean*h*0.5), tipY=Math.round(y-h);
    ctx.fillStyle = Math.floor(game.time*20)%2===0 ? PAL.l : PAL.H;
    ctx.fillRect(tipX, tipY-1, 1, 1);
  }
  ctx.globalAlpha=1;
}
function drawShocks(){
  for(const s of shocks){
    const a=1-s.r/s.max;
    ctx.globalAlpha=Math.max(0,a*0.9); ctx.fillStyle=s.col;
    const steps=Math.max(12, Math.round(s.r*2.2));
    for(let i=0;i<steps;i++){
      const an=i/steps*TAU;
      ctx.fillRect(Math.round(s.x+Math.cos(an)*s.r), Math.round(s.y+Math.sin(an)*s.r*0.65), 1,1);
    }
    ctx.globalAlpha=1;
  }
}
function drawWorld(){
  const cx=Math.floor(cam.x), cy=Math.floor(cam.y);
  const fx=cam.x-cx, fy=cam.y-cy;                 // Bruchteil: immer ein Drittelvielfaches
  ctx.drawImage(GROUND, cx, cy, VW+1, VH+1, -fx, -fy, VW+1, VH+1);
  ctx.save(); ctx.translate(-cam.x, -cam.y);

  // Tor (mit Schadensstufe)
  const stage = game.castleHp<=0 ? 3 : (game.castleHp/game.castleMax>0.66 ? 0 : (game.castleHp/game.castleMax>0.33 ? 1 : 2));
  ctx.drawImage(GATE_IMG[stage], CAS.gate.x, CAS.gate.y);
  if(game.flash>0){ ctx.globalAlpha=game.flash; ctx.fillStyle='#ffd9a0';
    ctx.fillRect(CAS.gate.x, CAS.gate.y, CAS.gate.w, CAS.gate.h); ctx.globalAlpha=1; }

  // Lagerfeuer im Hof
  {
    const f=game.time*9;
    for(let i=0;i<7;i++){
      const h=i*1.3, w=3.2-i*0.38;
      const off=Math.sin(f+i*0.8)*w*0.5;
      ctx.fillStyle = i<2 ? PAL.y : (i<4 ? PAL.O : PAL.o);
      ctx.fillRect(Math.round(FIRE.x+off-w/2), Math.round(FIRE.y-2-h), Math.max(1,Math.round(w)), 2);
    }
    ctx.fillStyle='rgba(255,180,80,.10)';
    pxDisc(ctx, FIRE.x, FIRE.y, 16+Math.sin(f*0.7)*1.5, 'rgba(255,180,80,.10)');
    if(Math.random()<0.25) part(FIRE.x+rr(-2,2), FIRE.y-6, rr(-6,6), rr(-22,-10), 0.7, PAL.O, 1);
  }

  // Beute liegt unter allem anderen
  for(const d of drops){
    const y=d.y-d.z;
    shadow(d.x, d.y+1, 5, 0.22);
    if(d.type==='scrap'){ drawSpr(SPR.bolt, d.x-2.5, y-5, false, Math.floor(game.time*8)%6===0); }
    else drawSpr(SPR.heart, d.x-3.5, y-8, false, false);
  }
  // Geschosse
  for(const b of bullets){
    if(b.own){
      const a=Math.atan2(b.vy,b.vx);
      pxLine(b.x-Math.cos(a)*5, b.y-Math.sin(a)*5, b.x, b.y, PAL.B);
      ctx.fillStyle=PAL.w; ctx.fillRect(Math.round(b.x),Math.round(b.y),1,1);
      ctx.fillStyle=PAL.S;
      ctx.fillRect(Math.round(b.x-Math.cos(a)*6),Math.round(b.y-Math.sin(a)*6),1,1);
    } else {
      ctx.fillStyle=PAL.P; ctx.fillRect(Math.round(b.x)-1, Math.round(b.y)-1, 3,3);
      ctx.fillStyle='#ffffff'; ctx.fillRect(Math.round(b.x), Math.round(b.y), 1,1);
    }
  }
  // Alles Sortierbare nach Fusslinie zeichnen
  const list=[];
  const vx0=cx-40, vx1=cx+VW+40, vy0=cy-60, vy1=cy+VH+60;   // grosszuegiger Rand
  for(const p of props){
    if(p.x+p.w<vx0||p.x>vx1||p.y+p.h<vy0||p.y>vy1) continue;
    list.push({s:p.sort, kind:'prop', o:p});
  }
  for(const e of enemies){
    if(e.x<vx0||e.x>vx1||e.y<vy0||e.y>vy1) continue;
    list.push({s:e.y, kind:'bot', o:e});
  }
  if(player.alive) list.push({s:player.y, kind:'player', o:player});
  list.sort((a,b)=>a.s-b.s);
  // Wer laesst Laub durchscheinen: die Spielfigur und Bots dicht bei ihr
  const boxen=[];
  if(player.alive) boxen.push({x0:player.x-6, x1:player.x+6, y0:player.y-16, y1:player.y+2});
  for(const e of enemies){
    if(e.dead || e.spawnT>0) continue;
    if(dist2(e.x,e.y,player.x,player.y) > 90*90) continue;
    boxen.push({x0:e.x-e.r, x1:e.x+e.r, y0:e.y-e.r*2.2, y1:e.y+2});
  }
  for(const it of list){
    if(it.kind==='prop'){
      const p=it.o;
      const x=Math.round(p.x), y=Math.round(p.y);
      if(p.ghost){
        // Steckt jemand im Laub? Dann durchscheinend zeichnen.
        let drin=false;
        for(const b of boxen)
          if(b.x1>p.x && b.x0<p.x+p.w && b.y1>p.y && b.y0<p.y+p.h){ drin=true; break; }
        const ziel = drin ? 1 : 0;
        if(p.gh===undefined) p.gh=ziel;
        p.gh = lerp(p.gh, ziel, 1-Math.pow(0.0008, game.dt||0.016));
        if(p.gh>0.02){
          if(p.gh<0.98){ ctx.globalAlpha=1-p.gh; ctx.drawImage(p.img, x, y); }
          ctx.globalAlpha=p.gh; ctx.drawImage(p.ghost, x, y);
          ctx.globalAlpha=1;
        } else ctx.drawImage(p.img, x, y);
      } else ctx.drawImage(p.img, x, y);
    }
    else if(it.kind==='bot') drawEnemy(it.o);
    else drawPlayer();
  }
  // Effekte obenauf
  for(const r of roots) drawRoot(r);
  for(const s of slashes) drawSlash(s);
  for(const b of blitze) drawBlitz(b);
  drawShocks();
  for(const p of parts){
    const a=p.life/p.max;
    ctx.globalAlpha=a>0.35?1:a*2.8; ctx.fillStyle=p.col;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }
  ctx.globalAlpha=1;
  for(const f of floaters){
    ctx.globalAlpha=1-f.t;
    drawTextC(ctx, f.txt, f.x, f.y, f.col, 1);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

    ctx.fillStyle=PAL.R; ctx.fillRect(x,y,Math.round(w*clamp(chef.hp/chef.hpMax,0,1)),1);
  });
  if(game.phase==='rest'){

  }
  if(game.msgT>0){

function setMinusRect(i){ return { x:setCtrlX(), y:setRowY(i)-2, w:11, h:11 }; }
function setSegRect(i,n){ return { x:setCtrlX()+14+n*7, y:setRowY(i)-2, w:6, h:11 }; }
function setPlusRect(i){ return { x:setCtrlX()+14+70+2, y:setRowY(i)-2, w:11, h:11 }; }

  ctx.globalAlpha=0.85; ctx.fillStyle='#0b120d'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1;

  const nr=setNameRect();
  panel(nr.x, nr.y, nr.w, nr.h, '#0d140e', '#2f5c31');   // Rahmen unter dem echten Eingabefeld
  SET_SLIDERS.forEach(([key,label],k)=>{
    const i=k+1, v=SETTINGS[key];
    drawText(ctx, label, lx, setRowY(i), '#cfe8c2', 1);
    const m=setMinusRect(i), pl=setPlusRect(i);
    panel(m.x,m.y,m.w,m.h,'rgba(16,32,18,.92)','#4a4a4a'); drawText(ctx,'-',m.x+3,m.y+2,PAL.y,1);
    panel(pl.x,pl.y,pl.w,pl.h,'rgba(16,32,18,.92)','#4a4a4a'); drawText(ctx,'+',pl.x+3,pl.y+2,PAL.y,1);
    for(let n=0;n<10;n++){
      const r=setSegRect(i,n);
      ctx.fillStyle = n<v ? (key==='music'?PAL.p:(key==='sfx'?PAL.O:PAL.H)) : '#22301f';
      ctx.fillRect(r.x, r.y+2, r.w, r.h-4);
    }
  });
  drawText(ctx,'WACKELN', lx, setRowY(4), '#cfe8c2', 1);
  const sr=setShakeRect(), on=SETTINGS.shake;
  panel(sr.x,sr.y,sr.w,sr.h, on?'rgba(26,46,26,.95)':'rgba(30,14,14,.95)', on?PAL.H:'#7a3a3a');
  drawTextC(ctx, on?'AN':'AUS', sr.x+sr.w/2, sr.y+2, on?PAL.l:'#e9a0a0', 1);
  const d=setDoneRect();
  panel(d.x,d.y,d.w,d.h,'rgba(46,40,10,.95)',PAL.y);

function updateSettings(){
  musicTick();                                     // Musik laeuft weiter, Lautstaerke hoerbar
  let changed=false;
  if(lastTap){
    const t=lastTap;
    SET_SLIDERS.forEach(([key],k)=>{
      const i=k+1;
      if(hitRect(t,setMinusRect(i))){ SETTINGS[key]=Math.max(0,SETTINGS[key]-1); changed=true; }
      else if(hitRect(t,setPlusRect(i))){ SETTINGS[key]=Math.min(10,SETTINGS[key]+1); changed=true; }
      else for(let n=0;n<10;n++) if(hitRect(t,setSegRect(i,n))){ SETTINGS[key]=n+1; changed=true; }
    });
    if(hitRect(t,setShakeRect())){ SETTINGS.shake=!SETTINGS.shake; changed=true; }
    if(hitRect(t,setDoneRect()) || !hitRect(t,setPanelRect())) game.settingsOpen=false;
  }
  if(pressed.has('Escape')) game.settingsOpen=false;
  if(changed){ saveSettings(); audioUnlock(); applyAudio(); SFX.pick(); }
  lastTap=null; pressed.clear();
}
function drawOver(){
  ctx.globalAlpha=0.6; ctx.fillStyle='#20060a'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1;
  const w=200, h=92, x=Math.round((VW-w)/2), y=Math.round((VH-h)/2)-4;
  panel(x,y,w,h,'rgba(14,8,10,.94)','#7a2a2a');
  drawTextC(ctx,'WALD VERLOREN', VW/2, y+8, PAL.R, 2);
  drawTextC(ctx, game.levelMode?('LEVEL '+game.levelMode+' NICHT GESCHAFFT'):game.msg, VW/2, y+26, '#e9c0b0', 1);
  drawTextC(ctx,'WELLEN GEHALTEN: '+Math.max(0,game.wave-1), VW/2, y+40, '#cfe8c2', 1);
  drawTextC(ctx,'BOTS ZERLEGT: '+game.kills, VW/2, y+51, '#cfe8c2', 1);
  drawTextC(ctx,'PUNKTE: '+game.score, VW/2, y+62, PAL.y, 1);
  drawTextC(ctx,'BESTE: '+game.best, VW/2, y+73, '#9fb79a', 1);
  if(game.deadT>1.0 && Math.floor(game.time*2)%2===0)
    drawTextC(ctx, isTouch?'TIPPEN':'LEERTASTE', VW/2, y+h+4, '#cfe8c2', 1);
}
function drawLevelWin(){
  ctx.globalAlpha=0.6; ctx.fillStyle='#0b1f10'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1;
  const w=210, h=104, x=Math.round((VW-w)/2), y=Math.round((VH-h)/2)-4;
  panel(x,y,w,h,'rgba(10,20,12,.94)',PAL.H);
  const n=game.levelWonN||1, isEnd = n>=LEVELS.length;
  let statY;
  if(isEnd){
    drawTextC(ctx,'ENDLEVEL GESCHAFFT!', VW/2, y+9, PAL.H, 1);
    drawTextC(ctx,'DU HAST WALDWACHT BESIEGT', VW/2, y+20, PAL.y, 1);
    statY = 36;
  } else {
    drawTextC(ctx,'LEVEL '+n+' GESCHAFFT!', VW/2, y+9, PAL.H, 1);
    statY = 28;
  }
  drawTextC(ctx, 'PUNKTE: '+game.score, VW/2, y+statY, PAL.y, 1);
  drawTextC(ctx, 'BESTE: '+game.best, VW/2, y+statY+11, '#9fb79a', 1);
  if(!isEnd) drawTextC(ctx, 'LEVEL '+(n+1)+' IST JETZT FREI', VW/2, y+statY+25, '#cfe8c2', 1);
  if(Math.floor(game.time*2)%2===0)
    drawTextC(ctx, isTouch?'TIPPEN: ZURÜCK ZUR AUSWAHL':'LEERTASTE: ZURÜCK ZUR AUSWAHL', VW/2, y+h+4, '#cfe8c2', 1);
}
function pauseSaveRect(){ return { x:VW/2-42, y:VH/2+18, w:84, h:16 }; }
function drawPause(){
  // Deutlich abgedunkelt, damit HUD-Text im Hintergrund nicht mehr lesbar
  // durchscheint - nur noch die Umrisse der Welt bleiben schemenhaft sichtbar.
  ctx.globalAlpha=0.86; ctx.fillStyle='#0b120d'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1;
  const w=182, h=46, x=Math.round((VW-w)/2), y=Math.round((VH-h)/2)-10;
  panel(x,y,w,h);
  drawTextC(ctx,'PAUSE', VW/2, y+7, PAL.H, 2);
  drawTextC(ctx, isTouch?'PAUSE-KNOPF ANTIPPEN: WEITER':'P ODER ESC: WEITER', VW/2, y+30, '#9fb79a', 1);
  const r=pauseSaveRect();
  panel(r.x, r.y, r.w, r.h, 'rgba(16,32,18,.92)', PAL.H);
  drawTextC(ctx, 'SPEICHERN', VW/2, r.y+5, PAL.y, 1);
  if(!isTouch) drawTextC(ctx, '? ODER F1: STEUERUNG', VW/2, r.y+r.h+6, '#9fb79a', 1);
}

const btnDash=document.getElementById('dashBtn'), btnHeal=document.getElementById('healBtn');
const btnUltra=document.getElementById('ultraBtn');
function render(){
  ctx.setTransform(SS,0,0,SS,0,0);
  ctx.imageSmoothingEnabled=false;
  // Kampf-Knoepfe nur waehrend einer echten, laufenden Welle zeigen - sonst
  // liegen sie im Titelbild, im Game-Over-Schirm oder in der Pause über
  // allem und blockieren Taps auf Boxen/Knoepfe darunter.
  const showCombatBtns = game.state==='play' && game.phase!=='rest' && !game.paused;
  touchUI.classList.toggle('rest', !showCombatBtns);
  const warVersteckt = codeBox.hidden;
  codeBox.hidden = !(game.state==='play' && game.shopOpen);
  pauseBtn.hidden = game.state!=='play' || game.settingsOpen;
  if(nameInput.hidden === game.settingsOpen){       // Namensfeld nur im Einstellungsfenster
    nameInput.hidden = !game.settingsOpen;
    if(game.settingsOpen){
      const r=setNameRect(); placePct(nameInput, r.x, r.y, r.w, r.h);
      nameInput.value=SETTINGS.name;
      const h=nameInput.getBoundingClientRect().height; if(h>0) nameInput.style.fontSize=Math.max(9,h*0.55)+'px';
    } else if(document.activeElement===nameInput) nameInput.blur();
  }
  pauseSaveBtn.hidden = !game.paused;
  pauseSaveBtn.classList.toggle('show', game.paused);
  if(codeBox.hidden && document.activeElement===codeInput) codeInput.blur();
  if(warVersteckt && !codeBox.hidden) sizeCodeBoxFont();   // Groesse war beim Verstecken 0
  if(btnDash) btnDash.classList.toggle('cool', player.dashCd>0);
  if(btnHeal) btnHeal.classList.toggle('cool', player.healCd>0 || player.hp>=player.maxHp);
  touchUI.classList.toggle('hasUltra', ownedUltras().length>0);
  if(btnUltra) btnUltra.classList.toggle('cool', !ultraReady());
  ctx.fillStyle='#0b120d'; ctx.fillRect(0,0,VW,VH);
  const sh = game.shake>0.5 ? game.shake : 0;      // unter einem halben Pixel: gar nichts
  const sx = sh ? Math.round(rr(-sh,sh)) : 0;
  const sy = sh ? Math.round(rr(-sh,sh)) : 0;
  ctx.save(); ctx.translate(sx,sy);
  drawWorld();
  ctx.restore();
  if(game.state==='play'){ drawHUD(); if(game.paused) drawPause(); if(game.paused && game.helpOpen) drawHelp(); }
  else if(game.state==='over'){ drawHUD(); drawOver(); }
  else if(game.state==='levelwin'){ drawHUD(); drawLevelWin(); }
  else { drawTitle(); if(game.levelSelectOpen) drawLevelSelect(); if(game.helpOpen) drawHelp(); }
  if(game.settingsOpen) drawSettings();
  // Ohne Fokus kommt keine Taste an (z.B. eingebettet in einer Vorschau) - sagen statt raten lassen.
  if(!isTouch && !document.hasFocus()){
    const t='INS SPIEL KLICKEN FÜR TASTATUR', w=textW(t,1)+8, x=Math.round((VW-w)/2);
    panel(x, 1, w, 10, 'rgba(40,30,8,.95)', PAL.y);
    drawTextC(ctx, t, VW/2, 2, PAL.y, 1);
  }
}

/* ------------------------------------------------------------------
   15. Schleife
   ------------------------------------------------------------------ */
resetPlayer();
cam.x=clamp(q(player.x-VW/2),0,WW-VW-1); cam.y=clamp(q(player.y-VH/2),0,WH-VH-1);
rollCards();
layoutCodeBox();
function placePct(el,x,y,w,h){
  el.style.left=(x/VW*100)+'%'; el.style.top=(y/VH*100)+'%';
  el.style.width=(w/VW*100)+'%'; el.style.height=(h/VH*100)+'%';
}
placePct(pauseSaveBtn, pauseSaveRect().x, pauseSaveRect().y, pauseSaveRect().w, pauseSaveRect().h);
(function(){
  requestAnimationFrame(()=>{ const h=pauseSaveBtn.getBoundingClientRect().height;
    if(h>0) pauseSaveBtn.style.fontSize=Math.max(8,h*0.45)+'px'; });
  let lastSaveT=0;
  const doSave=e=>{
    if(e.cancelable) e.preventDefault();
    e.stopPropagation();
    const now=performance.now();
    if(now-lastSaveT<400) return;      // ein Antippen kann mehrere Events feuern - nur einmal ausloesen
    lastSaveT=now;
    audioUnlock();
    if(saveGame()){ say('GESPEICHERT', 1.4, PAL.H); SFX.pick(); }
    else{ say('SPEICHERN NICHT MÖGLICH', 1.8, PAL.R); SFX.no(); }
  };
  // Auf mehrere Ereignistypen gleichzeitig hoeren: je nach Browser/Geraet
  // (Handy, iPad, Desktop, eingebettete Ansichten) kommt nicht ueberall
  // derselbe Event zuerst oder ueberhaupt an. 'pointerdown' deckt Maus,
  // Touch und Stift einheitlich ab; touchstart/mousedown/click bleiben als
  // Rueckfallebenen, das oben stehende Zeitfenster verhindert Doppelauslöser.
  pauseSaveBtn.addEventListener('pointerdown', doSave, {passive:false});
  pauseSaveBtn.addEventListener('touchstart', doSave, {passive:false});
  pauseSaveBtn.addEventListener('mousedown', doSave);
  pauseSaveBtn.addEventListener('click', doSave);
})();
// Pause- und Vollbild-Knopf exakt unter die Torleiste setzen - keine
// vmin-Schaetzung mehr, die je nach Bildschirmform woanders landen konnte.
placePct(pauseBtn, pauseBtnRect().x, pauseBtnRect().y, pauseBtnRect().w, pauseBtnRect().h);
placePct(fsBtn, fsBtnRect().x, fsBtnRect().y, fsBtnRect().w, fsBtnRect().h);
requestAnimationFrame(()=>{ const h=fsBtn.getBoundingClientRect().height;
  if(h>0) fsBtn.style.fontSize=Math.max(9,h*0.55)+'px'; });

let last=performance.now();
const MAXSTEP=1/40;                       // groesster Simulationsschritt
function frame(now){
  requestAnimationFrame(frame);
  // Genau die verstrichene Zeit simulieren — nicht in festen 60-Hz-Paketen.
  // Sonst bewegt sich die Welt bei 120 Hz nur in jedem zweiten Bild und in
  // Doppelschritten: genau das sah wie Wackeln aus.
  let dt=(now-last)/1000; last=now;
  if(!(dt>0)) dt=1/60;
  if(dt>0.2) dt=0.2;
  let rest=dt;
  while(rest>0.00001){ const step=Math.min(rest, MAXSTEP); update(step); rest-=step; }
  render();
}
requestAnimationFrame(frame);

// Zum Herumprobieren in der Konsole
window.WALDWACHT = { game, player, enemies, BOT, UPGRADES, spawnEnemy, startWave };
})();
// Installierbare App (Zum Home-Bildschirm): Service Worker nur registrieren,
// wenn ueber http(s) geladen - bei einer lokal geoeffneten Datei (file://)
// gibt es dafuer keine Unterstuetzung, das Spiel laeuft dann trotzdem normal.
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}
