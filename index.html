<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16241a">
<title>WALDWACHT</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; background:#0b120d; overflow:hidden; touch-action:none;
    overscroll-behavior:none; overflow-anchor:none;
    font-family:"Trebuchet MS",Verdana,system-ui,sans-serif; color:#cfe8c2; }
  body{ position:fixed; inset:0; width:100%; }
  #wrap{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stack{ position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; max-height:100vh; }
  canvas{ display:block; width:100%; height:100%; image-rendering:pixelated;
    image-rendering:crisp-edges; background:#1a2c1c;
    box-shadow:0 0 40px rgba(0,0,0,.7), 0 0 120px rgba(40,120,50,.18); }
  /* --- Touch: zwei Sticks im Brawl-Stars-Stil, rein visuell --- */
  #touch{ position:absolute; inset:0; display:none; pointer-events:none; }
  #touch.on{ display:block; }
  .stick{ position:absolute; width:17vmin; height:17vmin; margin:-8.5vmin 0 0 -8.5vmin; border-radius:50%;
    border:2px solid rgba(200,240,190,.26); background:rgba(10,25,12,.24); opacity:0; transition:opacity .12s; }
  .stick.on{ opacity:1; }
  .knob{ position:absolute; width:7vmin; height:7vmin; margin:-3.5vmin 0 0 -3.5vmin; border-radius:50%;
    background:rgba(205,240,180,.45); border:2px solid rgba(230,255,220,.6); box-shadow:0 0 10px rgba(0,0,0,.4); }
  #stickR{ border-color:rgba(255,190,120,.4); }
  #stickR .knob{ background:rgba(255,190,110,.5); border-color:rgba(255,220,160,.7); }
  .abtn{ position:absolute; border-radius:50%; pointer-events:auto; display:flex;
    align-items:center; justify-content:center; text-align:center; line-height:1.05;
    font-size:2.4vmin; font-weight:bold; letter-spacing:.04em; user-select:none;
    background:rgba(16,32,18,.5); text-shadow:0 0 6px rgba(0,0,0,.7); }
  #swordBtn{ right:2.5vmin; bottom:3vmin;   width:18vmin; height:18vmin;
    border:2px solid rgba(215,220,236,.65); color:#eef3ff; font-size:2.6vmin; }
  #bowBtn  { right:23vmin;  bottom:5.5vmin; width:14vmin; height:14vmin;
    border:2px solid rgba(255,200,120,.6);  color:#ffd9a0; }
  #dashBtn { right:4vmin;   bottom:24vmin;  width:12vmin; height:12vmin;
    border:2px solid rgba(150,230,255,.55); color:#cfeeff; font-size:2.1vmin; }
  #healBtn { right:21vmin;  bottom:22vmin;  width:11vmin; height:11vmin;
    border:2px solid rgba(255,140,150,.6);  color:#ffc9cf; font-size:2.0vmin; }
  .abtn.cool{ opacity:.38; }
  #ultraBtn{ left:2.5vmin; bottom:11vmin; width:15vmin; height:15vmin;
    border:2px solid rgba(255,230,120,.75); color:#ffe66d;
    background:rgba(40,34,10,.5); box-shadow:0 0 10px rgba(255,220,100,.25); }
  #touch:not(.hasUltra) #ultraBtn{ display:none; }
  #touch.rest .abtn{ display:none !important; }
  #codeBox{ position:absolute; inset:0; pointer-events:none; }
  #codeBox[hidden]{ display:none; }
  #codeInput{ position:absolute; box-sizing:border-box; pointer-events:auto;
    background:#0d140e; border:2px solid #3d6b3a; color:#e9f5dc;
    font-family:"Trebuchet MS",Verdana,system-ui,sans-serif; letter-spacing:.06em;
    text-transform:uppercase; padding:0 6px; outline:none; }
  #codeInput::placeholder{ color:#5f7a5a; text-transform:none; letter-spacing:0; }
  #codeInput:focus{ border-color:#7fd35a; }
  #codeBtn{ position:absolute; box-sizing:border-box; pointer-events:auto;
    background:#1a2e1c; border:2px solid #3d6b3a; color:#ffe66d; font-weight:bold;
    letter-spacing:.05em; cursor:pointer; }
  #codeBtn:hover{ background:#24402a; }
  #codeBtn:active{ background:#12200f; }
  #fsBtn{ position:absolute; right:2vmin; top:2vmin; width:9vmin; height:9vmin; border-radius:22%;
    pointer-events:auto; display:flex; align-items:center; justify-content:center;
    font-size:3.4vmin; user-select:none; color:#cfe8c2;
    background:rgba(16,32,18,.45); border:2px solid rgba(200,240,190,.35); }
  .abtn.hit{ background:rgba(140,220,255,.45); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stack">
    <canvas id="game" width="768" height="432"></canvas>
    <div id="touch">
      <div class="stick" id="stickL"><div class="knob" id="knobL"></div></div>
      <div class="stick" id="stickR"><div class="knob" id="knobR"></div></div>
      <div class="abtn" id="swordBtn">SCHWERT</div>
      <div class="abtn" id="bowBtn">BOGEN</div>
      <div class="abtn" id="dashBtn">ROLLE</div>
      <div class="abtn" id="healBtn">HEILEN</div>
      <div class="abtn" id="ultraBtn">ULTRA</div>
      <div id="fsBtn">⛶</div>
    </div>
    <div id="codeBox" hidden>
      <input id="codeInput" type="text" maxlength="20" placeholder="CODE EINLÖSEN"
        autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button id="codeBtn" type="button">OK</button>
    </div>
  </div>
</div>
<script>
"use strict";
(function(){
/* ==================================================================
   WALDWACHT  —  Top-Down-Pixel-Wellenkampf im Wald
   Eine einzige Datei: kein Build, keine Assets, kein Server.
   Alles (Sprites, Wald, Burg, Musik) entsteht zur Laufzeit.
   ================================================================== */

/* ------------------------------------------------------------------
   0. Grundlagen
   ------------------------------------------------------------------ */
const cv  = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha:false });
ctx.imageSmoothingEnabled = false;

const VW = 256, VH = 144;                 // sichtbare Aufloesung in Spielpixeln
const SS = 3;                             // Rueckpuffer je Spielpixel: erlaubt
                                          // Drittelschritte beim Scrollen
const q  = v => Math.round(v*SS)/SS;      // auf Drittelpixel rasten
const WW = 896, WH = 640;                 // Weltgroesse

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const TAU   = Math.PI*2;
const dist2 = (ax,ay,bx,by)=>{ const dx=bx-ax, dy=by-ay; return dx*dx+dy*dy; };
const dist  = (ax,ay,bx,by)=> Math.hypot(bx-ax, by-ay);
const angDiff = (a,b)=>{ let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; };

// deterministischer Zufall (damit der Wald bei gleichem Seed gleich aussieht)
function mulberry(seed){ let a=seed>>>0; return function(){
  a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
let rnd = Math.random;                    // Laufzeit-Zufall (Partikel usw.)
const rr = (a,b)=> a+Math.random()*(b-a);
const ri = (a,b)=> Math.floor(a+Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

/* ------------------------------------------------------------------
   1. Palette, Sprite-Decoder, Bitmap-Schrift
   ------------------------------------------------------------------ */
const PAL = {
  '.':null,
  'K':'#141019',  'k':'#241d2e',                                  // Umriss / dunkel
  'g':'#1e3a22','G':'#356b33','h':'#4f9340','H':'#6dbb52','l':'#9ade6e', // Gruen
  'b':'#4a3320','B':'#6b4a2b','n':'#a9763f',                       // Braun
  's':'#d9ab7a','S':'#f2d3a6',                                     // Haut
  'i':'#2a2d3c','m':'#5f6475','M':'#8f95ab','w':'#d7dcec',         // Metall
  'c':'#5fd7ff','C':'#c7f3ff',                                     // Glut cyan
  'r':'#c8392f','R':'#f0704a',                                     // Rot
  'o':'#e08a2a','O':'#ffc861',                                     // Orange
  'p':'#8a4fd4','P':'#c78bff',                                     // Lila
  'y':'#ffe66d','a':'#3f6fb5','A':'#6fa8e8'
};
const PRGB = {}; for(const k in PAL){ const v=PAL[k]; PRGB[k] = v ? [parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)] : null; }

function cvs(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false; return c; }

// Zeichenkette -> Pixelbild
function mk(rows){
  const w=rows[0].length, h=rows.length, c=cvs(w,h), g=c.getContext('2d');
  const id=g.createImageData(w,h), d=id.data;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const col=PRGB[rows[y][x]]; if(!col) continue;
    const i=(y*w+x)*4; d[i]=col[0]; d[i+1]=col[1]; d[i+2]=col[2]; d[i+3]=255;
  }
  g.putImageData(id,0,0); return c;
}
// weiss ausgebrannte Kopie fuer den Trefferblitz
function flashOf(src, col='#ffffff'){
  const c=cvs(src.width,src.height), g=c.getContext('2d');
  g.drawImage(src,0,0); g.globalCompositeOperation='source-atop';
  g.fillStyle=col; g.fillRect(0,0,c.width,c.height); return c;
}
function sprite(rows){ const img=mk(rows); return { img, flash:flashOf(img), w:img.width, h:img.height }; }

const FONT_SRC = {

 '8':'01110,10001,10001,01110,10001,10001,01110','9':'01110,10001,10001,01111,00001,00010,01100',
 ' ':'00000,00000,00000,00000,00000,00000,00000','.':'00000,00000,00000,00000,00000,01100,01100',
 ',':'00000,00000,00000,00000,01100,01100,01000','!':'00100,00100,00100,00100,00100,00000,00100',

 '/':'00001,00010,00010,00100,01000,01000,10000','(':'00010,00100,01000,01000,01000,00100,00010',
 ')':'01000,00100,00010,00010,00010,00100,01000','*':'00000,10101,01110,11111,01110,10101,00000',
 '\'':'00100,00100,00100,00000,00000,00000,00000','"':'01010,01010,00000,00000,00000,00000,00000',
 '%':'11001,11010,00010,00100,01000,01011,10011','=':'00000,00000,11111,00000,11111,00000,00000',
 '<':'00010,00100,01000,10000,01000,00100,00010','>':'01000,00100,00010,00001,00010,00100,01000',
 '·':'00000,00000,00000,00110,00110,00000,00000','#':'01010,11111,01010,01010,11111,01010,00000'
};
const GLYPH = {};
for(const ch in FONT_SRC){ GLYPH[ch] = FONT_SRC[ch].split(','); }

function textW(str, sc=1, sp=1){ return str.length*(5+sp)*sc - sp*sc; }
function drawText(g, str, x, y, col='#e9f5dc', sc=1, shadow='#141019'){
  str = String(str).toUpperCase();
  const step=(5+1)*sc;
  for(let pass=shadow?0:1; pass<2; pass++){
    g.fillStyle = pass===0 ? shadow : col;
    const ox = pass===0 ? sc : 0, oy = pass===0 ? sc : 0;
    let cx=x;
    for(let i=0;i<str.length;i++){
      const gl=GLYPH[str[i]] || GLYPH['?'];
      for(let r=0;r<7;r++){ const row=gl[r];
        for(let c=0;c<5;c++) if(row[c]==='1') g.fillRect(cx+c*sc+ox, y+r*sc+oy, sc, sc);
      }
      cx += step;
    }
  }
}
function drawTextC(g, str, cx, y, col, sc=1, shadow='#141019'){
  drawText(g, str, Math.round(cx - textW(String(str),sc)/2), y, col, sc, shadow);
}

/* ------------------------------------------------------------------

   ------------------------------------------------------------------ */

  ['....KGGGK.......','....KBBKKBK.....','....KBBK.KBK....','.....KK...KK....']];

SPR.pDown = P_LEGS.map(l => sprite(P_TOP_DOWN.concat(l)));
SPR.pUp   = P_LEGS.map(l => sprite(P_TOP_UP.concat(l)));

const WALK_CYCLE = [0,1,0,2];

// --- Rolle: die Figur macht sich zur Kugel und dreht sich ---

  '..............','....KKKKKK....','..KKhhhhhhKK..','.KhHHHHHHHHhK.',

sprite([

SPR.bomber = [sprite([

  '.KyyKKKKyyK.','..KyyKKyyK..','...KKKKKK...','...KiKKiK...','...Ki..iK...','...KK..KK...']),

  '.KyyKKKKyyK.','..KyyKKyyK..','...KKKKKK...','...KiKKiK...','..Ki....iK..','..KK....KK..'])];

SPR.bruiser = [sprite([

  '.......KiKKiK.......','.......Ki..iK.......','.......Ki..iK.......','.......KK..KK.......']),
sprite([

  '...KMMKMiiiiMKMMK...','...KMMKMiiiiMKMMK...','...KMMKMMMMMMKMMK...','...KwwKKMMMMKKwwK...',
  '....KwKKMMMMKKwK....','.....KK.KMMK.KK.....','........KMMK........','.......KMMMMK.......',
  '.......KiKKiK.......','......Ki....iK......','......Ki....iK......','......KK....KK......'])];

SPR.boss = [sprite([
  '................................','.........KKKKKKKKKKKKKK.........','........KmMMMMMMMMMMMMmK........',
  '.......KmMMMMMMMMMMMMMMmK.......','.......KMrrrrrrrrrrrrrrMK.......','.......KMrRRrrrrrrrrRRrMK.......',
  '.......KmMMMMMMMMMMMMMMmK.......','.....KKKKMMMMMMMMMMMMMMKKKK.....','....KMMMMKMMMMMMMMMMMMKMMMMK....',
  '....KMMMMKMiiiiiiiiiiMKMMMMK....','....KMMMMKMiicccccciiMKMMMMK....','....KMMMMKMiicCCCCciiMKMMMMK....',
  '....KMMMMKMiicccccciiMKMMMMK....','....KwwwwKMMMMMMMMMMMMKwwwwK....','....KwwwwKKMMMMMMMMMMKKwwwwK....',
  '.....KKKK..KMMMMMMMMK..KKKK.....','...........KMMMMMMMMK...........','..........KMiiiiiiiiMK..........',
  '..........KMMMMMMMMMMK..........','........KKKMMMMMMMMMMKKK........','........KMMKMMMMMMMMKMMK........',

  '.........KMMMK....KMMMK.........','........KKMMMKK..KKMMMKK........','........KwwwwwK..KwwwwwK........',
  '........KKKKKKK..KKKKKKK........']),
sprite([

/* ------------------------------------------------------------------
   3. Prozedurale Grafik: Wald, Felsen, Burg, Boden
   ------------------------------------------------------------------ */
function pxDisc(g, cx, cy, r, col){          // pixelgenauer Kreis
  g.fillStyle=col;
  const r2=r*r;
  for(let y=Math.floor(cy-r); y<=cy+r; y++){
    const dy=y-cy+0.5, w=r2-dy*dy; if(w<0) continue;
    const hw=Math.sqrt(w), x0=Math.round(cx-hw), x1=Math.round(cx+hw);
    g.fillRect(x0, y, Math.max(1,x1-x0), 1);
  }
}
// Durchscheinende Fassung eines Bildes: Farben blass, dunkler Umriss kraeftiger,
// damit man die Form des Baums noch erkennt, waehrend man hindurchlaeuft.
function makeGhost(src){
  const c=cvs(src.width, src.height), g=c.getContext('2d');
  g.drawImage(src,0,0);
  const id=g.getImageData(0,0,c.width,c.height), d=id.data;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]===0) continue;
    const dunkel = d[i]<46 && d[i+1]<46 && d[i+2]<56;
    d[i+3] = dunkel ? 200 : 96;
  }
  g.putImageData(id,0,0); return c;
}
function hash2(x,y,s){
  let h=Math.imul(x|0,374761393) ^ Math.imul(y|0,668265263) ^ Math.imul(s|0,1274126177);
  h=Math.imul(h^(h>>>13), 1274126177);
  return ((h^(h>>>16))>>>0)/4294967296;
}
function vnoise(x,y,sc,s){
  const fx=x/sc, fy=y/sc, x0=Math.floor(fx), y0=Math.floor(fy);
  const tx=fx-x0, ty=fy-y0, sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
  return lerp(lerp(hash2(x0,y0,s),hash2(x0+1,y0,s),sx),
              lerp(hash2(x0,y0+1,s),hash2(x0+1,y0+1,s),sx), sy);
}

// --- Baum: Stamm + Blaetterballen, vier Varianten -------------------
function makeTree(seed){
  const R=mulberry(seed*7919+13);
  const w=30, h=40, c=cvs(w,h), g=c.getContext('2d');
  const cx=w/2, cy=13+R()*3, trunkW=3+Math.floor(R()*2);
  // Stamm
  g.fillStyle=PAL.K; g.fillRect(cx-trunkW/2-1, 18, trunkW+2, h-18);
  g.fillStyle=PAL.b; g.fillRect(cx-trunkW/2, 18, trunkW, h-19);
  g.fillStyle=PAL.B; g.fillRect(cx-trunkW/2, 18, 1, h-19);
  // Krone: erst Umriss, dann Fuellungen von dunkel nach hell
  const blobs=[]; const n=4+Math.floor(R()*3);
  for(let i=0;i<n;i++){
    const a=(i/n)*TAU + R()*0.6, rad=(i===0?0:5+R()*4);
    blobs.push({x:cx+Math.cos(a)*rad, y:cy+Math.sin(a)*rad*0.75, r:5+R()*4});
  }
  for(const b of blobs) pxDisc(g,b.x,b.y,b.r+1,PAL.K);
  for(const b of blobs) pxDisc(g,b.x,b.y,b.r,PAL.g);
  for(const b of blobs) pxDisc(g,b.x-0.5,b.y-1.5,b.r*0.82,PAL.G);
  for(const b of blobs) pxDisc(g,b.x-1.5,b.y-2.5,b.r*0.5,PAL.h);
  for(const b of blobs) if(R()<0.7) pxDisc(g,b.x-2,b.y-3.5,b.r*0.22,PAL.H);
  return { img:c, ghost:makeGhost(c), w, h, anchorY:h-2 };
}
// --- Busch: flach, ohne Kollision, dient als Deckung ----------------
function makeBush(seed){
  const R=mulberry(seed*104729+7), w=20, h=15, c=cvs(w,h), g=c.getContext('2d');
  const blobs=[];
  for(let i=0;i<3;i++) blobs.push({x:5+i*5+R()*2, y:8+R()*2, r:4+R()*2});
  for(const b of blobs) pxDisc(g,b.x,b.y,b.r+1,PAL.K);
  for(const b of blobs) pxDisc(g,b.x,b.y,b.r,PAL.g);
  for(const b of blobs) pxDisc(g,b.x,b.y-1,b.r*0.8,PAL.G);
  for(const b of blobs) pxDisc(g,b.x-1,b.y-2,b.r*0.4,PAL.h);
  if(R()<0.5){ g.fillStyle=PAL.R; for(let i=0;i<3;i++) g.fillRect(4+Math.floor(R()*12), 6+Math.floor(R()*5), 1,1); }
  return { img:c, ghost:makeGhost(c), w, h, anchorY:h-1 };
}
// --- Fels -----------------------------------------------------------
function makeRock(seed){
  const R=mulberry(seed*15485863+3), w=18, h=14, c=cvs(w,h), g=c.getContext('2d');
  const blobs=[{x:6+R()*2,y:8,r:4+R()*1.5},{x:11+R()*2,y:9,r:3+R()*2}];
  for(const b of blobs) pxDisc(g,b.x,b.y,b.r+1,PAL.K);
  for(const b of blobs) pxDisc(g,b.x,b.y,b.r,PAL.i);
  for(const b of blobs) pxDisc(g,b.x-0.5,b.y-1,b.r*0.75,PAL.m);
  for(const b of blobs) pxDisc(g,b.x-1,b.y-2,b.r*0.35,PAL.M);
  return { img:c, w, h, anchorY:h-1 };
}
// --- Baumstumpf (Deko) ----------------------------------------------
function makeStump(seed){
  const R=mulberry(seed*2654435761+11), w=14, h=12, c=cvs(w,h), g=c.getContext('2d');
  pxDisc(g,7,7,5,PAL.K); pxDisc(g,7,7,4,PAL.b); pxDisc(g,7,6,3.2,PAL.B); pxDisc(g,7,6,1.6,PAL.n);
  if(R()<0.5){ pxDisc(g,3,9,2,PAL.K); pxDisc(g,3,9,1.4,PAL.G); }
  return { img:c, w, h, anchorY:h-1 };
}

/* --- Die Burg ------------------------------------------------------
   Mauerring mit vier Tuermen und einem Tor nach Osten. Gezeichnet wird
   sie in Segmenten, damit die Spielfigur korrekt davor/dahinter liegt. */
const CAS = { x:56, y:186, w:140, h:230, wall:16 };
CAS.gate = { x:CAS.x+CAS.w-CAS.wall, y:CAS.y+CAS.h/2-26, w:CAS.wall, h:52 };
CAS.center = { x:CAS.x+CAS.w/2, y:CAS.y+CAS.h/2 };
CAS.gatePost = { x:CAS.gate.x+CAS.gate.w+14, y:CAS.gate.y+CAS.gate.h/2 };   // Ziel der Bots

function stoneFill(g,x,y,w,h,seed){
  const R=mulberry(seed);
  g.fillStyle=PAL.K; g.fillRect(x,y,w,h);
  for(let by=0; by<h-1; by+=4){
    const off=(by/4)%2 ? 3 : 0;
    for(let bx=-off; bx<w-1; bx+=7){
      const r=R();
      const bw=Math.min(6, w-1-Math.max(0,bx)), bh=Math.min(3, h-1-by);
      if(bw<=0||bh<=0) continue;
      g.fillStyle = r<0.18 ? PAL.i : (r<0.62 ? PAL.m : PAL.M);
      g.fillRect(x+Math.max(0,bx)+1, y+by+1, bw, bh);
    }
  }
}
function crenel(g,x,y,w,seed){                    // Zinnen auf der Mauerkrone
  const R=mulberry(seed+99);
  for(let bx=0; bx<w; bx+=8){
    const bw=Math.min(5,w-bx);
    g.fillStyle=PAL.K; g.fillRect(x+bx, y-4, bw, 4);
    g.fillStyle=R()<0.5?PAL.m:PAL.M; g.fillRect(x+bx+1, y-3, Math.max(1,bw-2), 3);
  }
}
function makeCastle(){
  const pad=8, W2=CAS.w+pad*2, H2=CAS.h+pad*2;
  const c=cvs(W2,H2), g=c.getContext('2d');
  const ox=pad, oy=pad, wl=CAS.wall;
  // Innenhof
  const R=mulberry(4242);
  for(let y=0;y<CAS.h;y++) for(let x=0;x<CAS.w;x++){
    const t=hash2(x>>2,y>>2,99);
    g.fillStyle = t<0.3 ? '#3a3f42' : (t<0.7 ? '#474d50' : '#525a5c');
    g.fillRect(ox+x, oy+y, 1,1);
  }
  // Gras-Flecken im Hof
  for(let i=0;i<70;i++){ const x=ox+8+R()*(CAS.w-16), y=oy+8+R()*(CAS.h-16);
    g.fillStyle=R()<0.5?PAL.g:PAL.G; g.fillRect(x|0,y|0,1+((R()*2)|0),1); }
  // Mauern
  stoneFill(g, ox, oy, CAS.w, wl, 11);                       // Nord
  stoneFill(g, ox, oy+CAS.h-wl, CAS.w, wl, 22);              // Sued
  stoneFill(g, ox, oy, wl, CAS.h, 33);                       // West
  const gy=CAS.gate.y-CAS.y;
  stoneFill(g, ox+CAS.w-wl, oy, wl, gy, 44);                 // Ost oben
  stoneFill(g, ox+CAS.w-wl, oy+gy+CAS.gate.h, wl, CAS.h-gy-CAS.gate.h, 55); // Ost unten
  crenel(g, ox, oy, CAS.w, 1);
  crenel(g, ox+CAS.w-wl, oy+gy+CAS.gate.h+2, wl, 2);
  // Tuerme an den Ecken
  const towers=[[0,0],[CAS.w-24,0],[0,CAS.h-24],[CAS.w-24,CAS.h-24]];
  towers.forEach((t,i)=>{ stoneFill(g, ox+t[0]-3, oy+t[1]-3, 30, 30, 70+i);
    crenel(g, ox+t[0]-3, oy+t[1]-3, 30, 7+i); });
  return { img:c, ox, oy, w:W2, h:H2 };
}
const CASTLE_IMG = makeCastle();

// Das Tor selbst: eigenes Bild, damit es Schaden zeigen kann
function makeGate(dmg){                        // dmg 0..3 Stufen
  const c=cvs(CAS.gate.w, CAS.gate.h), g=c.getContext('2d');
  g.fillStyle=PAL.K; g.fillRect(0,0,c.width,c.height);
  for(let y=1;y<c.height-1;y++) for(let x=1;x<c.width-1;x++){
    const t=hash2(x, y>>1, 5);
    g.fillStyle = (x%5===0) ? PAL.b : (t<0.4 ? PAL.b : (t<0.8 ? PAL.B : PAL.n));
    g.fillRect(x,y,1,1);
  }
  g.fillStyle=PAL.m; g.fillRect(1,4,c.width-2,2); g.fillRect(1,c.height-7,c.width-2,2);
  g.fillStyle=PAL.M; g.fillRect(2,c.height/2-1,3,3);
  if(dmg>0){                                     // Risse und Loecher
    const R=mulberry(dmg*777);
    for(let i=0;i<dmg*14;i++){
      const x=1+Math.floor(R()*(c.width-2)), y=2+Math.floor(R()*(c.height-4));
      g.fillStyle = R()<0.5 ? PAL.K : '#2a1d12'; g.fillRect(x,y,1,1+((R()*2)|0));
    }
  }
  return c;
}
const GATE_IMG = [0,1,2,3].map(makeGate);

// Kollisionsrechtecke der Burg (das Tor blockiert nur Bots)
const WALLS = [
  {x:CAS.x, y:CAS.y-3, w:CAS.w, h:CAS.wall+3},
  {x:CAS.x, y:CAS.y+CAS.h-CAS.wall, w:CAS.w, h:CAS.wall},
  {x:CAS.x-3, y:CAS.y, w:CAS.wall+3, h:CAS.h},
  {x:CAS.x+CAS.w-CAS.wall, y:CAS.y, w:CAS.wall, h:CAS.gate.y-CAS.y},
  {x:CAS.x+CAS.w-CAS.wall, y:CAS.gate.y+CAS.gate.h, w:CAS.wall, h:CAS.y+CAS.h-CAS.gate.y-CAS.gate.h}
];
const GATE_RECT = {x:CAS.gate.x, y:CAS.gate.y, w:CAS.gate.w, h:CAS.gate.h};
const COURT = {x:CAS.x+CAS.wall, y:CAS.y+CAS.wall, w:CAS.w-CAS.wall*2, h:CAS.h-CAS.wall*2};
const inRect=(x,y,r)=> x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h;
const FIRE = { x:CAS.x+CAS.w*0.36, y:CAS.y+CAS.h*0.62 };

/* ------------------------------------------------------------------
   4. Weltbau: Boden malen, Wald pflanzen
   ------------------------------------------------------------------ */
const PATH = [ {x:CAS.gate.x+CAS.gate.w, y:CAS.center.y}, {x:300,y:330}, {x:470,y:288}, {x:640,y:330}, {x:890,y:300} ];
const GLADES = [ {x:470,y:300,r:96}, {x:700,y:150,r:70}, {x:660,y:520,r:78}, {x:300,y:120,r:56}, {x:300,y:530,r:60} ];

function distToPath(x,y){
  let best=1e9;
  for(let i=0;i<PATH.length-1;i++){
    const a=PATH[i], b=PATH[i+1];
    const vx=b.x-a.x, vy=b.y-a.y, wx=x-a.x, wy=y-a.y;
    const t=clamp((wx*vx+wy*vy)/(vx*vx+vy*vy),0,1);
    best=Math.min(best, Math.hypot(wx-vx*t, wy-vy*t));
  }
  return best;
}
function gladeDepth(x,y){                    // >0 = innerhalb einer Lichtung
  let d=0; for(const g of GLADES) d=Math.max(d, g.r-Math.hypot(x-g.x,y-g.y));
  return d;
}

// Bodenbild einmalig malen (Pixel fuer Pixel, danach nur noch Blit)
const GROUND = cvs(WW,WH);
(function paintGround(){
  const g=GROUND.getContext('2d'), id=g.createImageData(WW,WH), d=id.data;
  const cols = {
    dark:  [0x1b,0x33,0x1f], base:[0x27,0x4c,0x2a], mid:[0x31,0x5e,0x33],
    light: [0x3d,0x72,0x3a], glade:[0x4a,0x85,0x42],
    dirt:  [0x6b,0x53,0x33], dirt2:[0x7d,0x63,0x3e], dirt3:[0x57,0x42,0x29]
  };
  for(let y=0;y<WH;y++) for(let x=0;x<WW;x++){
    const n = vnoise(x,y,26,1)*0.6 + vnoise(x,y,9,2)*0.3 + hash2(x,y,3)*0.1;
    const gl = gladeDepth(x,y);
    let c;
    if(n<0.34) c=cols.dark; else if(n<0.5) c=cols.base; else if(n<0.66) c=cols.mid; else c=cols.light;
    if(gl>0 && n>0.42) c=cols.glade;
    const pd=distToPath(x,y) - vnoise(x,y,11,4)*5;
    if(pd < 11){
      const t=hash2(x,y,7);
      c = t<0.25 ? cols.dirt3 : (t<0.7 ? cols.dirt : cols.dirt2);
      if(pd > 8 && t<0.5) c = cols.base;          // ausgefranster Rand
    }
    const i=(y*WW+x)*4; d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; d[i+3]=255;
  }
  g.putImageData(id,0,0);
  // Grasbueschel, Bluemchen, Steinchen
  const R=mulberry(1337);
  for(let i=0;i<2600;i++){
    const x=Math.floor(R()*WW), y=Math.floor(R()*WH);
    if(inRect(x,y,{x:CAS.x-6,y:CAS.y-6,w:CAS.w+12,h:CAS.h+12})) continue;
    const r=R();
    if(distToPath(x,y)<10){ if(r<0.5){ g.fillStyle='#5a462c'; g.fillRect(x,y,1,1);} continue; }
    if(r<0.55){ g.fillStyle=PAL.h; g.fillRect(x,y,1,2); g.fillRect(x+1,y+1,1,1); }
    else if(r<0.8){ g.fillStyle=PAL.H; g.fillRect(x,y,1,1); g.fillRect(x-1,y+1,3,1); }
    else if(r<0.9){ g.fillStyle=R()<0.5?PAL.y:PAL.C; g.fillRect(x,y,1,1); g.fillStyle=PAL.h; g.fillRect(x,y+1,1,1); }
    else { g.fillStyle=PAL.i; g.fillRect(x,y,2,1); }
  }
  // Burg einbrennen (Hofboden + Mauern liegen fest)
  g.drawImage(CASTLE_IMG.img, CAS.x-CASTLE_IMG.ox, CAS.y-CASTLE_IMG.oy);

  // --- Hof-Deko: Steinweg zum Tor, Feuerstelle, Wimpel ---
  for(let x=COURT.x; x<CAS.gate.x; x+=1){
    for(let y=CAS.center.y-5; y<=CAS.center.y+5; y++){
      const t=hash2(x>>1,y>>1,17);
      g.fillStyle = t<0.35 ? '#5d6468' : (t<0.75 ? '#6e767a' : '#4e5457');
      g.fillRect(x,y,1,1);
    }
  }
  pxDisc(g, FIRE.x, FIRE.y, 8, '#3d3f42');
  pxDisc(g, FIRE.x, FIRE.y, 6, '#2a2126');
  for(let i=0;i<9;i++){ const a=i/9*TAU;
    g.fillStyle = i%2 ? PAL.m : PAL.M;
    g.fillRect(Math.round(FIRE.x+Math.cos(a)*7.5)-1, Math.round(FIRE.y+Math.sin(a)*6)-1, 2,2); }
  g.fillStyle=PAL.b; g.fillRect(FIRE.x-4,FIRE.y-1,8,2); g.fillRect(FIRE.x-1,FIRE.y-4,2,7);
  // Wimpel an der Nordmauer
  for(let i=0;i<3;i++){
    const bx=CAS.x+30+i*40, by=CAS.y+CAS.wall;
    g.fillStyle=PAL.b; g.fillRect(bx-1,by,9,1);
    g.fillStyle=PAL.G; g.fillRect(bx,by+1,7,9);
    g.fillStyle=PAL.H; g.fillRect(bx+2,by+3,3,3);
    g.fillStyle=PAL.g; g.fillRect(bx,by+10,7,1); g.fillRect(bx+2,by+11,3,1);
  }
})();

// --- Requisiten (werden nach y sortiert gezeichnet) ------------------
const props   = [];        // {img,x,y,w,h,sort,kind}
const solids  = [];        // {x,y,r} Kollisionskreise
const bushes  = [];        // {x,y,r} bremsen und verstecken
const spots=[];          // nur fuer den Abstand beim Pflanzen, keine Kollision
(function plantForest(){
  const R=mulberry(20240914);
  const free=(x,y,pad)=>{
    if(x<14||x>WW-14||y<18||y>WH-10) return false;
    if(inRect(x,y,{x:CAS.x-22,y:CAS.y-26,w:CAS.w+44,h:CAS.h+46})) return false;
    if(distToPath(x,y) < 20+pad) return false;
    for(const s of spots) if(dist2(x,y,s.x,s.y) < (s.r+pad+7)*(s.r+pad+7)) return false;
    return true;
  };
  // Baeume: dicht am Rand, licht in den Lichtungen
  let guard=0;
  for(let i=0;i<560 && props.length<230; i++){
    const x=8+R()*(WW-16), y=20+R()*(WH-28);
    const gl=gladeDepth(x,y);
    const p = gl>0 ? 0.05 : 0.72;                 // Lichtungen bleiben frei
    if(R()>p) continue;
    if(!free(x,y,4)) continue;
    const t=TREES[Math.floor(R()*TREES.length)];
    // Baeume sind Deckung, keine Mauer: man laeuft hindurch, sie werden dabei blass
    props.push({img:t.img, ghost:t.ghost, x:x-t.w/2, y:y-t.anchorY, w:t.w, h:t.h, sort:y, kind:'tree'});
    spots.push({x, y:y-1, r:5.5});
    guard++;
  }
  for(let i=0;i<90;i++){                          // Felsen
    const x=10+R()*(WW-20), y=24+R()*(WH-32);
    if(!free(x,y,2)) continue;
    const t=ROCKS[Math.floor(R()*ROCKS.length)];
    props.push({img:t.img, x:x-t.w/2, y:y-t.anchorY, w:t.w, h:t.h, sort:y, kind:'rock'});
    solids.push({x, y, r:5}); spots.push({x, y, r:5});
  }
  for(let i=0;i<150;i++){                         // Buesche (Deckung, keine Mauer)

const touchUI = document.getElementById('touch');
const sticks = {
  L:{el:document.getElementById('stickL'), knob:document.getElementById('knobL'), id:null, ox:0, oy:0, dx:0, dy:0},
  R:{el:document.getElementById('stickR'), knob:document.getElementById('knobR'), id:null, ox:0, oy:0, dx:0, dy:0, t0:0, moved:false}
};
let isTouch=false;
function setStick(s, x, y){
  s.el.style.left=s.ox+'px'; s.el.style.top=s.oy+'px';
  const max=s.el.offsetWidth/2 - 6;
  let dx=x-s.ox, dy=y-s.oy; const d=Math.hypot(dx,dy);
  if(d>max){ dx=dx/d*max; dy=dy/d*max; }
  s.knob.style.left=(s.el.offsetWidth/2+dx)+'px'; s.knob.style.top=(s.el.offsetHeight/2+dy)+'px';
  const n=Math.max(1,max); s.dx=dx/n; s.dy=dy/n;
}
function touchStart(e){
  isTouch=true; touchUI.classList.add('on'); audioUnlock();
  const r=touchUI.getBoundingClientRect();
  for(const t of e.changedTouches){
    const x=t.clientX-r.left, y=t.clientY-r.top;
    lastTap={ x:x/r.width*VW, y:y/r.height*VH };
    const s = x < r.width*0.45 ? sticks.L : sticks.R;
    if(s.id!==null) continue;
    s.id=t.identifier; s.ox=x; s.oy=y; s.dx=0; s.dy=0;
    s.el.classList.add('on'); setStick(s,x,y);
    if(s===sticks.R){ s.t0=performance.now(); s.moved=false; }
    if(x >= r.width*0.45 && y > r.height*0.62 && x > r.width*0.82) { /* Platz fuer Rolle-Taste */ }
  }
  e.preventDefault();
}
function touchMove(e){
  const r=touchUI.getBoundingClientRect();
  for(const t of e.changedTouches){
    for(const key of ['L','R']){ const s=sticks[key];
      if(s.id===t.identifier){
        const x=t.clientX-r.left, y=t.clientY-r.top;
        setStick(s,x,y);
        if(Math.hypot(x-s.ox,y-s.oy) > 14) s.moved=true;
      }
    }
  }
  e.preventDefault();
}
function touchEnd(e){
  for(const t of e.changedTouches){
    for(const key of ['L','R']){ const s=sticks[key];
      if(s.id===t.identifier){
        if(s===sticks.R && !s.moved && performance.now()-s.t0 < 260) pressed.add('__attack');
        s.id=null; s.dx=0; s.dy=0; s.el.classList.remove('on');
      }
    }
  }
  e.preventDefault();
}

/* ------------------------------------------------------------------
   6. Ton: alles zur Laufzeit synthetisiert
   ------------------------------------------------------------------ */
let AC=null, master=null, musicGain=null, muted=false;
function audioUnlock(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    musicGain=AC.createGain(); musicGain.gain.value=0.22; musicGain.connect(master);
  }catch(e){ AC=null; }
}
function env(node, t, a, d, peak){
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
  node.connect(g); return g;
}
function tone(freq, t, dur, type='square', peak=0.25, slide=0){
  if(!AC||muted) return;
  const o=AC.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t+dur);
  const g=env(o,t,0.008,dur,peak); g.connect(master);
  o.start(t); o.stop(t+dur+0.05);
}
let noiseBuf=null;
function noise(t, dur, peak=0.2, filt=1800, q=1){
  if(!AC||muted) return;
  if(!noiseBuf){
    noiseBuf=AC.createBuffer(1, AC.sampleRate*0.5, AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=filt; f.Q.value=q;
  s.connect(f); const g=env(f,t,0.005,dur,peak); g.connect(master);
  s.start(t); s.stop(t+dur+0.05);
}
const SFX = {

// --- kleine Endlosmusik ---------------------------------------------
const SCALE=[0,3,5,7,10];                                   // Moll-Pentatonik
const MUSIC={ step:0, next:0 };
function musicTick(){
  if(!AC||muted) return;
  const bpm = game.phase==='wave' ? (138 + Math.min(30, game.wave*2)) : 96;
  const spb = 60/bpm/2;
  while(MUSIC.next < AC.currentTime + 0.25){
    const t=Math.max(MUSIC.next, AC.currentTime+0.01), s=MUSIC.step;
    const root = game.phase==='wave' ? 55 : 49;
    if(s%4===0){ const o=AC.createOscillator(); o.type='triangle';
      o.frequency.setValueAtTime(root*(s%16===8?1.5:1), t);
      const g=env(o,t,0.01,spb*2.4,0.5); g.connect(musicGain); o.start(t); o.stop(t+spb*3); }
    if(game.phase==='wave' && s%2===0){ noise(t,0.05,0.06,3000,1); }
    const deg=SCALE[(s*3)%SCALE.length] + (s%8<4?0:12);
    const o2=AC.createOscillator(); o2.type='square';
    o2.frequency.setValueAtTime(root*4*Math.pow(2,deg/12), t);
    const g2=env(o2,t,0.008,spb*0.9,0.16); g2.connect(musicGain);
    o2.start(t); o2.stop(t+spb*1.2);
    MUSIC.next = t + spb; MUSIC.step = (s+1)%32;
  }
}

function part(x,y,vx,vy,life,col,size=1,grav=0){
  if(parts.length>460) parts.shift();
  parts.push({x,y,vx,vy,life,max:life,col,size,grav});
}
function burst(x,y,n,col,spd=40,life=0.4,size=1){
  for(let i=0;i<n;i++){ const a=rr(0,TAU), s=rr(spd*0.3,spd);
    part(x,y,Math.cos(a)*s,Math.sin(a)*s,rr(life*0.5,life),col,size,0); }
}
function floater(x,y,txt,col){ floaters.push({x,y,txt,col,t:0}); }
function shake(v){ game.shake=Math.min(2.5, game.shake+v*0.25); }  // nur noch ein Hauch

/* --- Kollision ------------------------------------------------------ */
function collideWorld(e, isEnemy){
  // Baeume, Felsen
  for(const s of solids){
    const dx=e.x-s.x, dy=e.y-s.y, rr2=(s.r+e.r);
    if(dx*dx+dy*dy < rr2*rr2){
      const d=Math.hypot(dx,dy)||0.01;
      e.x = s.x + dx/d*rr2; e.y = s.y + dy/d*rr2;
    }
  }
  // Mauern (+ Tor fuer Bots)
  const rects = isEnemy ? WALLS.concat([GATE_RECT]) : WALLS;
  for(const r of rects){
    const cx=clamp(e.x, r.x, r.x+r.w), cy=clamp(e.y, r.y, r.y+r.h);
    const dx=e.x-cx, dy=e.y-cy, d2=dx*dx+dy*dy;
    if(d2 < e.r*e.r){
      if(d2>0.0001){ const d=Math.sqrt(d2); e.x=cx+dx/d*e.r; e.y=cy+dy/d*e.r; }
      else {         // Mittelpunkt im Rechteck: auf die naechste Kante schieben
        const l=e.x-r.x, ri2=r.x+r.w-e.x, t=e.y-r.y, b=r.y+r.h-e.y;
        const m=Math.min(l,ri2,t,b);
        if(m===l) e.x=r.x-e.r; else if(m===ri2) e.x=r.x+r.w+e.r;
        else if(m===t) e.y=r.y-e.r; else e.y=r.y+r.h+e.r;
      }
    }
  }
  e.x=clamp(e.x, 8, WW-8); e.y=clamp(e.y, 14, WH-8);
}
function blockedByWall(x,y){
  for(const r of WALLS) if(inRect(x,y,r)) return true;
  return inRect(x,y,GATE_RECT);
}
function inBush(x,y){
  for(const b of bushes) if(dist2(x,y,b.x,b.y) < b.r*b.r) return true;
  return false;
}

/* --- Spieler: Angriff und Rolle ------------------------------------- */
function playerAttack(){
  if(player.atkCd>0 || player.dashT>0 || !player.alive) return;
  const heavy = player.combo>=2;
  const dur = (heavy?0.34:0.26) / player.atkSpeed;
  player.swing = { t:0, dur, dir:player.aim, arc:player.arc*(heavy?1.45:1),
                   reach:player.reach*(heavy?1.2:1), heavy, hit:new Set() };
  player.atkCd = dur + (heavy?0.26:0.1)/player.atkSpeed;
  player.comboT = 0.55; player.combo = heavy ? 0 : player.combo+1;
  // kleiner Schritt nach vorn — fuehlt sich satter an
  player.vx += Math.cos(player.aim)*(heavy?70:40);
  player.vy += Math.sin(player.aim)*(heavy?70:40);
  slashes.push({x:player.x, y:player.y-8, ang:player.aim, arc:player.swing.arc,
                reach:player.swing.reach, t:0, dur:dur*0.9, heavy});
  heavy ? SFX.heavy() : SFX.swing();
}
function playerShoot(){
  if(player.bowCd>0 || player.dashT>0 || player.swing || !player.alive) return;
  player.bowCd = player.bowCdMax; player.shootT = 0.2;
  const a=player.aim, n=1+player.extraArrows;
  for(let i=0;i<n;i++){
    const w = n===1 ? 0 : (i-(n-1)/2)*0.16;
    bullets.push({ x:player.x+Math.cos(a+w)*7, y:player.y-7+Math.sin(a+w)*5,
      vx:Math.cos(a+w)*player.arrowSpeed, vy:Math.sin(a+w)*player.arrowSpeed,
      dmg:player.arrowDmg, t:0, col:PAL.S, own:true, ang:a+w });
  }
  player.vx -= Math.cos(a)*18; player.vy -= Math.sin(a)*18;      // kleiner Rueckstoss
  SFX.bow();
}
function playerHeal(){
  if(!player.alive || player.healCd>0) return;
  if(player.hp>=player.maxHp){ SFX.no(); return; }        // nicht verschenken
  player.healCd = player.healCdMax;
  player.hp = Math.min(player.maxHp, player.hp+2);        // ein ganzes Herz
  SFX.heal(); floater(player.x, player.y-20, 'HEILUNG', PAL.R);
  for(let i=0;i<14;i++) part(player.x+rr(-5,5), player.y-rr(2,14), rr(-10,10), rr(-26,-8), 0.6, i%2?PAL.H:PAL.R, 1);
}
function playerDash(){
  if(player.dashCd>0 || player.dashT>0 || !player.alive) return;
  const mv=Math.hypot(IN.mx,IN.my);
  player.dashDir = mv>0.2 ? Math.atan2(IN.my,IN.mx) : player.aim;
  player.dashT=0.22; player.dashCd=player.dashCdMax; player.inv=Math.max(player.inv,0.28);
  SFX.dash();
  for(let i=0;i<8;i++) part(player.x+rr(-3,3), player.y+rr(-6,0), rr(-14,14), rr(-14,6), 0.3, '#cfe8c2', 1);
}
function hurtPlayer(dmg, fromX, fromY){
  if(player.inv>0 || !player.alive) return;
  if(player.shield>0){                                  // Schutzschild faengt den Schlag
    player.shield--; player.shieldT=0; player.inv=0.8;
    burst(player.x, player.y-7, 16, PAL.C, 80, 0.5);
    floater(player.x, player.y-20, 'SCHILD', PAL.C); SFX.hit();
    return;
  }
  player.hp -= dmg; player.inv=1.0; player.hurtT=0.3;
  const a=Math.atan2(player.y-fromY, player.x-fromX);
  player.vx += Math.cos(a)*120; player.vy += Math.sin(a)*120;
  shake(1.4); game.redFlash=0.5; game.hitstop=0.06; SFX.hurt();
  burst(player.x, player.y-7, 8, PAL.R, 60, 0.4);
  if(player.hp<=0){
    if(player.revive>0){                                // Zweites Leben
      player.revive--; player.hp=Math.min(player.maxHp,6); player.inv=2.6;
      say('ZWEITES LEBEN', 2.2, PAL.R); SFX.heal();
      burst(player.x, player.y-8, 40, PAL.H, 130, 0.9, 2); shake(2);
      return;
    }
    player.hp=0; player.alive=false; gameOver('DU BIST GEFALLEN');
  }
}
function damageEnemy(e, dmg, kb, ang, heavy){
  e.hp -= dmg; e.flash=0.14;
  e.kx += Math.cos(ang)*kb*e.d.kbR; e.ky += Math.sin(ang)*kb*e.d.kbR;
  burst(e.x, e.y-e.r, heavy?10:6, PAL.C, heavy?90:60, 0.3);
  burst(e.x, e.y-e.r, 3, PAL.O, 50, 0.35);
  game.hitstop = Math.max(game.hitstop, heavy?0.08:0.045); if(heavy) shake(1.2);
  chargeUltra(dmg*0.6);
  heavy ? SFX.heavy() : SFX.hit();
  if(player.lifesteal>0 && Math.random()<player.lifesteal && player.hp<player.maxHp){
    player.hp=Math.min(player.maxHp, player.hp+1); SFX.heal(); floater(player.x, player.y-18, '+', PAL.R);
  }
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  e.dead=true;
  game.kills++; game.score += e.d.score; chargeUltra(e.d.boss?40:5);
  burst(e.x, e.y-e.r, e.d.boss?46:16, PAL.M, e.d.boss?150:80, 0.6, e.d.boss?2:1);
  burst(e.x, e.y-e.r, e.d.boss?26:8, PAL.C, 70, 0.5);
  burst(e.x, e.y-e.r, 6, PAL.O, 60, 0.45);
  SFX.botDie(); if(e.d.boss) shake(4);
  const n = e.d.scrap + (Math.random()<0.4?1:0) + Math.round(e.d.scrap*player.greed);
  for(let i=0;i<n;i++) drops.push({x:e.x, y:e.y-4, vx:rr(-40,40), vy:rr(-50,10), z:0, vz:rr(20,50), t:0, type:'scrap'});
  const heartChance = e.d.boss ? 1 : 0.07;
  if(Math.random()<heartChance) drops.push({x:e.x, y:e.y-4, vx:rr(-20,20), vy:rr(-20,10), z:0, vz:40, t:0, type:'heart'});
  if(e.d.boss){ say('KOLOSSUS ZERSCHLAGEN', 2.2, PAL.O); game.slow=0.9; }
}
function damageCastle(dmg, x, y){
  if(game.castleHp<=0) return;
  game.castleHp = Math.max(0, game.castleHp - dmg);
  shake(1.2); game.flash=0.25; SFX.gate();
  burst(x, y, 8, PAL.B, 60, 0.45);
  if(game.castleHp<=0) gameOver('DAS TOR IST GEFALLEN');
}

/* --- Ultras: ab Welle 10 freigeschaltet, aufgeladen durch ausgeteilten Schaden --- */
const ULTRAS = [
  { id:'bolt',  name:'DONNERBLITZ',  wave:3,  hint:'NEUN EINSCHLAEGE AUF DIE DICKSTEN BOTS' },
  { id:'storm', name:'KLINGENSTURM', wave:10, hint:'WIRBEL, DER ALLES UM DICH TRIFFT' },
  { id:'rain',  name:'PFEILREGEN',   wave:15, hint:'PFEILE IN ALLE RICHTUNGEN' },
  { id:'quake', name:'DONNERSCHLAG', wave:20, hint:'DRUCKWELLE, BETAEUBUNG, HEILUNG' }
];
function ownedUltras(){ return ULTRAS.filter(u=> game.ultras.includes(u.id)); }
function activeUltra(){ const o=ownedUltras(); return o.length ? o[player.ultraSel % o.length] : null; }
function ultraReady(){ return activeUltra() && player.ultra >= player.ultraMax; }
function chargeUltra(v){
  if(!ownedUltras().length) return;
  if(player.stormT>0 || player.rainLeft>0 || player.boltLeft>0) return;  // laedt sich nicht selbst
  player.ultra = Math.min(player.ultraMax, player.ultra + v*player.ultraGain);
}
function cycleUltra(){
  const o=ownedUltras(); if(o.length<2) return;
  player.ultraSel=(player.ultraSel+1)%o.length; SFX.pick();
  say('ULTRA: '+activeUltra().name, 1.2, PAL.C);
}
function fireUltra(){
  if(!ultraReady() || !player.alive) return;
  const u=activeUltra(); player.ultra=0;
  say(u.name+'!', 1.4, PAL.y); game.flash=0.4;
  if(u.id==='bolt'){
    player.boltLeft=9; player.boltT=0; game.white=0.5; shake(2); SFX.boom();
  } else if(u.id==='storm'){
    player.stormT=1.5; player.stormTick=0; player.inv=Math.max(player.inv,1.6);
    SFX.heavy();
  } else if(u.id==='rain'){
    player.rainT=0; player.rainLeft=3; SFX.bow();
  } else {
    shocks.push({x:player.x, y:player.y, r:8, max:74, t:0, col:PAL.C});
    shocks.push({x:player.x, y:player.y, r:4, max:52, t:0, col:PAL.y});
    SFX.boom(); shake(3);
    for(const e of enemies){
      if(e.dead||e.spawnT>0) continue;
      const d=dist(player.x,player.y,e.x,e.y);
      if(d<74){
        damageEnemy(e, player.dmg*2.4, 220, Math.atan2(e.y-player.y,e.x-player.x), true);
        if(!e.dead){ e.st='cool'; e.t=0; e.cd=1.8; }        // kurz betaeubt
      }
    }
    player.hp=Math.min(player.maxHp, player.hp+2);
    burst(player.x, player.y-6, 34, PAL.C, 150, 0.7, 2);
  }
}
function updateUltra(dt){
  const p=player;
  if(p.boltLeft>0){
    p.boltT-=dt;
    if(p.boltT<=0){
      p.boltT=0.12; p.boltLeft--;
      // Ziel: der dickste Bot in der Naehe, Bosse zuerst
      let ziel=null, best=-1;
      for(const e of enemies){
        if(e.dead||e.spawnT>0) continue;
        const d=dist(p.x,p.y,e.x,e.y); if(d>160) continue;
        const w=(e.d.boss?9999:0) + e.hp - d*0.3 - (e.getroffen||0)*40;
        if(w>best){ best=w; ziel=e; }
      }
      const tx = ziel ? ziel.x : p.x+rr(-50,50), ty = ziel ? ziel.y : p.y+rr(-40,40);
      if(ziel) ziel.getroffen=(ziel.getroffen||0)+1;
      blitze.push({x:tx, y:ty, t:0, dur:0.28, seed:rr(0,9)});
      shocks.push({x:tx, y:ty, r:4, max:26, t:0, col:PAL.C});
      game.white=Math.max(game.white||0, 0.45); shake(1.4); SFX.boom();
      burst(tx, ty-4, 16, PAL.C, 100, 0.45);
      for(const e of enemies){
        if(e.dead||e.spawnT>0) continue;
        if(dist(tx,ty,e.x,e.y) < 24+e.r){
          damageEnemy(e, p.dmg*3, 100, Math.atan2(e.y-ty, e.x-tx), true);
          if(!e.dead){ e.st='cool'; e.t=0; e.cd=Math.max(e.cd,1.1); }   // betaeubt
        }
      }
      if(p.boltLeft===0) for(const e of enemies) e.getroffen=0;
    }
  }
  if(p.stormT>0){
    p.stormT-=dt; p.inv=Math.max(p.inv,0.2);
    p.stormTick-=dt;
    if(p.stormTick<=0){
      p.stormTick=0.17;
      const ang=game.time*11;
      slashes.push({x:p.x, y:p.y-8, ang, arc:2.6, reach:p.reach+12, t:0, dur:0.24, heavy:true});
      for(const e of enemies){
        if(e.dead||e.spawnT>0) continue;
        if(dist(p.x,p.y-6,e.x,e.y-e.r*0.6) < 38+e.r)
          damageEnemy(e, p.dmg*0.95, 140, Math.atan2(e.y-p.y,e.x-p.x), true);
      }
      SFX.swing();
    }
    for(let i=0;i<2;i++){ const a=rr(0,TAU), r=rr(10,26);
      part(p.x+Math.cos(a)*r, p.y-8+Math.sin(a)*r*0.7, 0,0, 0.25, i?PAL.C:PAL.w, 1); }
  }
  if(p.rainLeft>0){
    p.rainT-=dt;
    if(p.rainT<=0){
      p.rainT=0.2; p.rainLeft--;
      const n=14, off=rr(0,TAU);
      for(let i=0;i<n;i++){
        const a=off+i/n*TAU;
        bullets.push({ x:p.x+Math.cos(a)*7, y:p.y-7+Math.sin(a)*5,
          vx:Math.cos(a)*p.arrowSpeed, vy:Math.sin(a)*p.arrowSpeed,
          dmg:p.arrowDmg*1.5, t:0, col:PAL.S, own:true });
      }
      SFX.bow();
    }
  }
}

const MSGQ=[];                                  // Nachrichten laufen nacheinander durch
function say(txt, dur=2.0, col){
  if(MSGQ.length>2) MSGQ.length=2;              // nichts aufstauen lassen
  MSGQ.push({txt, dur, col:col||PAL.y});
}
function buildWave(n){
  const list=[], add=(t,c)=>{ for(let i=0;i<c;i++) list.push(t); };
  add('scout', 3 + Math.round(n*1.1));
  if(n>=3) add('blade',   Math.round((n-1)*0.6));
  if(n>=4) add('archer',  1 + Math.round((n-3)*0.35));
  if(n>=5) add('bruiser', Math.round((n-3)*0.3));
  if(n>=7) add('bomber',  Math.round((n-5)*0.3));
  if(n%5===0) add('boss', 1 + Math.floor(n/15));
  // durchmischen, damit die Gruppen bunt anrücken
  for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  return list;
}
// Welle 10-19: 10, dann 20/30/40, ab Welle 50 das Doppelte der Wellenzahl
// (Welle 50 gibt 100, Welle 100 gibt 200) - dazu ein kleiner Zufallsaufschlag.
function waveBonus(n){
  if(n < 10) return 0;
  const grund = n >= 50 ? n*2 : Math.floor(n/10)*10;
  return grund + ri(0, Math.ceil(grund*0.3));
}
function startWave(){
  game.wave++;
  game.phase='wave'; game.shopOpen=false; game.spawnList=buildWave(game.wave); game.spawnT=0.4;
  say((game.wave%5===0) ? 'WELLE '+game.wave+': KOLOSSUS' : 'WELLE '+game.wave, 2.0);
  SFX.wave();
}
function endWave(){
  game.phase='rest';
  game.restT = 5;                      // kurze Verschnaufpause, der Shop haelt sie an
  say('WELLE '+game.wave+' GESCHAFFT', 2.0, PAL.H);
  game.score += 50 + game.wave*10;
  // Ultras freischalten
  for(const u of ULTRAS){
    if(game.wave >= u.wave && !game.ultras.includes(u.id)){
      game.ultras.push(u.id);
      player.ultraSel = game.ultras.length-1;
      player.ultra = player.ultraMax;                 // gleich einmal voll
      say('ULTRA FREI: '+u.name, 2.6, PAL.y);
      say(u.hint, 2.2, PAL.C);
      SFX.buy();
    }
  }
  // Praemie ab Welle 10, ab Welle 50 das Doppelte der Wellenzahl
  const bonus = waveBonus(game.wave);
  if(bonus>0){
    game.scrap += bonus;
    say('PRÄMIE +'+bonus+' SCHRAUBEN', 2.0, PAL.y);
  }
  rollCards();
  if(game.score>game.best){ game.best=game.score; try{ localStorage.setItem('waldwacht_best',String(game.best)); }catch(e){} }
}
function doSpawns(dt){
  if(!game.spawnList.length) return;
  game.spawnT-=dt;
  if(game.spawnT>0) return;
  const group = Math.min(game.spawnList.length, ri(1,2)+Math.floor(game.wave/5));
  const s = pick(SPAWNS);
  for(let i=0;i<group;i++){
    const t=game.spawnList.pop();
    let x=s.x+rr(-16,16), y=s.y+rr(-16,16);
    x=clamp(x,10,WW-10); y=clamp(y,16,WH-10);
    spawnEnemy(t, x, y);
    for(let k=0;k<6;k++) part(x,y-6,rr(-20,20),rr(-20,20),0.4,PAL.C,1);
    if(t==='boss'){
      if(!game.ultras.length){                    // Hilfe fuer den ersten Kolossus
        game.ultras.push('bolt'); player.ultraSel=0;
        say('ULTRA FREI: DONNERBLITZ', 2.4, PAL.y);
      }
      player.ultra = player.ultraMax;              // zum Boss ist die Ultra immer geladen
      say('ULTRA BEREIT', 1.6, PAL.C);
      say('KOLOSSUS ERWACHT', 2.2, PAL.R);
      shake(4); SFX.boom(); burst(x, y-10, 30, PAL.R, 110, 0.7, 2);
    }
  }
  game.spawnT = Math.max(0.9, 3.1 - game.wave*0.08);
}

function rollCards(){

  const out=[];
  const bag=pool.slice();
  while(out.length<4 && bag.length){ out.push(bag.splice(Math.floor(Math.random()*bag.length),1)[0]); }
  game.cards = out.map(u=>({u, cost:u.cost(lvl(u.id))}));
  game.cardSel=0;
}
function buyCard(i){

}

   9. Aktualisierung: Spielfigur
   ------------------------------------------------------------------ */
function nearestEnemy(x,y,maxD,ang,maxSpread){
  let best=null, bd=maxD*maxD;
  for(const e of enemies){
    if(e.dead) continue;
    const d2=dist2(x,y,e.x,e.y);
    if(d2>bd) continue;
    if(maxSpread!==undefined){
      const a=Math.atan2(e.y-y, e.x-x);
      if(Math.abs(angDiff(ang,a))>maxSpread) continue;
    }
    bd=d2; best=e;
  }
  return best;
}
function updatePlayer(dt){
  const p=player;
  p.anim += dt;
  p.inv=Math.max(0,p.inv-dt); p.hurtT=Math.max(0,p.hurtT-dt);
  p.atkCd=Math.max(0,p.atkCd-dt); p.dashCd=Math.max(0,p.dashCd-dt);
  p.comboT-=dt; if(p.comboT<=0) p.combo=0;

  // --- Zielrichtung ---
  const moving = Math.hypot(IN.mx,IN.my)>0.15;
  if(IN.aimHeld) p.aim=IN.aim;
  else if(!isTouch && mouseInside && IN.mouseAim) p.aim=Math.atan2(mouseWY-(p.y-7), mouseWX-p.x);
  else if(moving) p.aim=Math.atan2(IN.my,IN.mx);

  // --- Bewegung / Rolle ---
  if(p.dashT>0){
    p.dashT-=dt;
    p.vx=Math.cos(p.dashDir)*186; p.vy=Math.sin(p.dashDir)*186;
    for(let i=0;i<2;i++) part(p.x+rr(-3,3), p.y-rr(0,4), rr(-16,16), rr(-14,2), 0.3, i?'#c9b48a':'#a9d98a',1);
  } else {
    const slow = inBush(p.x,p.y) ? 0.68 : 1;
    const tvx=IN.mx*p.speed*slow, tvy=IN.my*p.speed*slow;
    p.vx=lerp(p.vx,tvx,1-Math.pow(0.0006,dt));
    p.vy=lerp(p.vy,tvy,1-Math.pow(0.0006,dt));
  }
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  collideWorld(p,false);

  // --- Blickrichtung fuer das Sprite ---
  const ca=Math.cos(p.aim), sa=Math.sin(p.aim);
  if(Math.abs(ca)>Math.abs(sa)*1.15){ p.face='side'; p.flip = ca<0; }
  else p.face = sa<0 ? 'up' : 'down';

  // --- Angriff ---
  p.bowCd=Math.max(0,p.bowCd-dt); p.shootT=Math.max(0,p.shootT-dt);
  const assist=(range,spread)=>{
    if(IN.aimHeld || (mouseInside && IN.mouseAim && !isTouch)) return;
    const t=nearestEnemy(p.x,p.y-6, range, p.aim, spread);
    if(t) p.aim=Math.atan2(t.y-(p.y-6), t.x-p.x);
  };
  if(IN.attackEdge){ assist(p.reach+26, 1.1); playerAttack(); }
  if(IN.bowEdge){ assist(150, 0.9); playerShoot(); }
  if(IN.dashEdge) playerDash();
  if(IN.healEdge) playerHeal();
  // Schutzschild laedt sich nach
  if(p.shieldMax>0 && p.shield<p.shieldMax){
    p.shieldT+=dt;
    if(p.shieldT>=p.shieldEvery){ p.shieldT=0; p.shield++; SFX.pick();
      burst(p.x,p.y-8,8,PAL.C,40,0.4); }
  }
  if(IN.swapEdge) cycleUltra();
  if(IN.ultraEdge) fireUltra();
  updateUltra(dt);
  // langsame Selbstheilung: alle 20 Sekunden ein halbes Herz
  p.healCd=Math.max(0,p.healCd-dt);
  if(p.hp<p.maxHp){
    p.regenT+=dt;
    if(p.regenT>=p.regenEvery){ p.regenT=0; p.hp=Math.min(p.maxHp,p.hp+1);
      SFX.heal(); floater(p.x,p.y-18,'+',PAL.R); burst(p.x,p.y-8,5,PAL.H,26,0.5); }
  } else p.regenT=0;

  // --- Schwunghitbox ---
  if(p.swing){
    const s=p.swing; s.t+=dt;
    const act = s.t > s.dur*0.12 && s.t < s.dur*0.75;
    if(act){
      for(const e of enemies){
        if(e.dead || s.hit.has(e) || e.spawnT>0) continue;
        const dx=e.x-p.x, dy=(e.y-4)-(p.y-6), d=Math.hypot(dx,dy);
        if(d > s.reach+e.r) continue;
        if(Math.abs(angDiff(s.dir, Math.atan2(dy,dx))) > s.arc*0.5) continue;
        s.hit.add(e);
        damageEnemy(e, p.dmg*(s.heavy?1.7:1), s.heavy?150:95, Math.atan2(dy,dx), s.heavy);
        if(p.burn>0 && !e.dead){ e.burnDps=p.burn; e.burnT=3; }
      }
    }
    if(s.t>=s.dur) p.swing=null;
  }

  // --- Heilen im Burghof waehrend der Ruhe ---
  if(game.phase==='rest' && inRect(p.x,p.y,COURT)){
    p.healT=(p.healT||0)+dt;
    if(p.healT>1.1 && p.hp<p.maxHp){ p.healT=0; p.hp++; SFX.heal();
      floater(p.x,p.y-18,'+',PAL.R); burst(p.x,p.y-8,6,PAL.R,30,0.5); }
  } else p.healT=0;
}

   10. Aktualisierung: Bots
   ------------------------------------------------------------------ */
function gateDist(e){
  const cx=clamp(e.x, GATE_RECT.x, GATE_RECT.x+GATE_RECT.w);
  const cy=clamp(e.y, GATE_RECT.y, GATE_RECT.y+GATE_RECT.h);
  return { d:Math.hypot(e.x-cx, e.y-cy), x:cx, y:cy };
}
function explode(e){
  shocks.push({x:e.x, y:e.y-4, r:4, max:30, t:0, col:PAL.O});
  burst(e.x,e.y-4, 30, PAL.O, 140, 0.6, 2); burst(e.x,e.y-4, 16, PAL.R, 100, 0.5);
  SFX.boom(); shake(3);
  if(player.alive && dist(e.x,e.y,player.x,player.y) < 30) hurtPlayer(e.dmg, e.x, e.y);
  for(const o of enemies){
    if(o===e||o.dead) continue;
    if(dist(e.x,e.y,o.x,o.y) < 28) damageEnemy(o, 16, 120, Math.atan2(o.y-e.y,o.x-e.x), false);
  }
  const g=gateDist(e); if(g.d<24) damageCastle(6, g.x, g.y);
  e.hp=0; e.dead=true;
  game.score+=5;
}
function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead) continue;
    e.flash=Math.max(0,e.flash-dt);
    e.anim+=dt*(2.2+Math.hypot(e.vx,e.vy)*0.06);
    if(e.burnT>0){                                   // Feuerklinge brennt nach
      e.burnT-=dt; e.burnAcc=(e.burnAcc||0)+e.burnDps*dt;
      if(e.burnAcc>=1){
        const d=Math.floor(e.burnAcc); e.burnAcc-=d;
        e.hp-=d; e.flash=0.06; chargeUltra(d*0.4);
        if(e.hp<=0){ killEnemy(e); continue; }
      }
      if(Math.random()<dt*22) part(e.x+rr(-4,4), e.y-rr(2,10), rr(-6,6), rr(-24,-10), 0.4,
        Math.random()<0.5?PAL.O:PAL.y, 1);
    }
    if(e.slowT>0){
      e.slowT-=dt;
      if(Math.random()<dt*10) part(e.x+rr(-4,4), e.y-rr(2,8), 0,0, 0.3, PAL.C, 1);
    }
    if(e.spawnT>0){ e.spawnT-=dt; continue; }

    // Ziel waehlen: die Spielfigur, wenn sie draussen und nah ist — sonst das Tor
    const pOut = player.alive && !inRect(player.x,player.y,COURT);
    const dp = pOut ? dist(e.x,e.y,player.x,player.y) : 1e9;
    const onPlayer = dp < e.d.aggro;
    const tx = onPlayer ? player.x : CAS.gatePost.x;
    const ty = onPlayer ? player.y : CAS.gatePost.y;
    const gd = gateDist(e);

    // --- Lenkung: Ziel + Hindernisse + Abstand zu anderen Bots ---
    let ax=0, ay=0;
    let ang=Math.atan2(ty-e.y, tx-e.x);
    const wantRange = e.d.ranged ? e.d.range*0.75 : 0;
    if(e.d.ranged && onPlayer){
      if(dp < wantRange*0.75) ang += Math.PI;                    // zu nah: zurueck
      else if(dp < wantRange)  ang += Math.PI/2*(e.hp%2?1:-1);   // umkreisen
    }
    ax+=Math.cos(ang); ay+=Math.sin(ang);
    for(const s of solids){
      const dx=e.x-s.x, dy=e.y-s.y, d=Math.hypot(dx,dy), rng=s.r+e.r+12;
      if(d<rng && d>0.01){ const w=(1-d/rng)*1.6; ax+=dx/d*w; ay+=dy/d*w; }
    }
    for(const r of WALLS){
      const cx=clamp(e.x,r.x,r.x+r.w), cy=clamp(e.y,r.y,r.y+r.h);
      const dx=e.x-cx, dy=e.y-cy, d=Math.hypot(dx,dy), rng=e.r+10;
      if(d<rng && d>0.01){ const w=(1-d/rng)*1.4; ax+=dx/d*w; ay+=dy/d*w; }
    }
    for(const o of enemies){
      if(o===e||o.dead) continue;
      const dx=e.x-o.x, dy=e.y-o.y, d2=dx*dx+dy*dy, rng=e.r+o.r+2;
      if(d2<rng*rng && d2>0.01){ const d=Math.sqrt(d2), w=(1-d/rng)*1.1; ax+=dx/d*w; ay+=dy/d*w; }
    }
    const al=Math.hypot(ax,ay)||1; ax/=al; ay/=al;
    e.ang=Math.atan2(ay,ax);

    let spd = e.d.speed * (inBush(e.x,e.y)?0.75:1) * (e.slowT>0?0.5:1);
    if(e.d.boss && e.hp < e.hpMax*0.5) spd *= 1.35;          // angeschlagen wird er wild
    if(e.st!=='walk') spd *= (e.st==='windup'?0.25:0.5);
    if(e.st==='fuse') spd *= 1.35;
    e.vx = lerp(e.vx, ax*spd, 1-Math.pow(0.002,dt));
    e.vy = lerp(e.vy, ay*spd, 1-Math.pow(0.002,dt));
    e.x += (e.vx+e.kx)*dt; e.y += (e.vy+e.ky)*dt;
    e.kx*=Math.pow(0.0009,dt); e.ky*=Math.pow(0.0009,dt);
    collideWorld(e,true);
    if(Math.abs(e.vx)>4) e.flip = e.vx<0;

    // --- Kampfzustaende ---
    e.cd=Math.max(0,e.cd-dt);
    const reachP = onPlayer && dp < e.d.range + player.r + 2;
    const reachG = !onPlayer && gd.d < (e.d.ranged ? e.d.range : e.d.range*0.8);
    if(e.st==='walk'){
      if(e.cd<=0 && (reachP || reachG || (e.d.ranged && onPlayer && dp<e.d.range)
                     || (e.d.boss && onPlayer && dp<150))){
        e.st = e.d.fuse ? 'fuse' : 'windup'; e.t=0;
        e.aimX = onPlayer ? player.x : gd.x; e.aimY = onPlayer ? player.y : gd.y;
      }
    } else if(e.st==='windup'){
      e.t+=dt;
      if(e.d.lunge && e.t<e.d.windup*0.5){ e.vx*=0.6; e.vy*=0.6; }
      if(e.t>=e.d.windup){
        strike(e, onPlayer, gd);
        e.st='cool'; e.t=0; e.cd=e.d.cd;
      }
    } else if(e.st==='cool'){
      e.t+=dt; if(e.t>=e.d.cd*0.45){ e.st='walk'; e.t=0; }
    } else if(e.st==='fuse'){
      e.t+=dt;
      if(Math.random()<dt*14) part(e.x+rr(-4,4), e.y-8, rr(-8,8), rr(-24,-8), 0.3, PAL.y,1);
      if(e.t>=e.d.windup) explode(e);
    }

    // --- Boss ruft Verstaerkung ---
    if(e.d.boss){
      e.callT=(e.callT||6)-dt;
      if(e.callT<=0 && enemies.filter(x=>!x.dead).length<44){
        const wut = e.hp < e.hpMax*0.5;
        e.callT = wut ? 5 : 7;
        for(let i=0;i<(wut?3:2);i++) spawnEnemy('scout', e.x+rr(-24,24), e.y+rr(-16,16));
        burst(e.x,e.y-10,14,PAL.C,70,0.5);
      }
    }
  }
  // Aufraeumen
  for(let i=enemies.length-1;i>=0;i--) if(enemies[i].dead) enemies.splice(i,1);
}
function strike(e, onPlayer, gd){
  const d=e.d;
  if(d.lunge){ e.kx+=Math.cos(e.ang)*90; e.ky+=Math.sin(e.ang)*90; }
  if(d.ranged){
    const tx = onPlayer ? player.x : gd.x, ty = onPlayer ? (player.y-6) : gd.y;
    const a=Math.atan2(ty-(e.y-6), tx-e.x);
    bullets.push({x:e.x+Math.cos(a)*6, y:e.y-6+Math.sin(a)*6, vx:Math.cos(a)*104, vy:Math.sin(a)*104,
                  dmg:e.dmg, t:0, col:PAL.P});
    SFX.shoot(); return;
  }
  if(d.boss){
    const wut = e.hp < e.hpMax*0.5;                      // zweite Phase: er dreht durch
    const dp = player.alive ? dist(e.x,e.y,player.x,player.y) : 1e9;
    if(dp < 52 || !onPlayer){
      // Stampfer: Druckwelle am Boden
      shocks.push({x:e.x, y:e.y+2, r:8, max:wut?62:48, t:0, col:PAL.R});
      if(wut) shocks.push({x:e.x, y:e.y+2, r:4, max:36, t:0, col:PAL.O});
      shake(2.5); SFX.boom();
      burst(e.x,e.y+2, wut?30:22, PAL.n, 110, 0.55);
      if(player.alive && dp < (wut?58:46)) hurtPlayer(e.dmg, e.x, e.y);
      if(gd.d<38) damageCastle(d.gateDmg, gd.x, gd.y);
    } else {
      // Salve aus den Schulterwerfern
      const n = wut?7:5, weite=wut?0.95:0.6;
      const basis = Math.atan2((player.y-6)-(e.y-12), player.x-e.x);
      for(let i=0;i<n;i++){
        const a = basis + (i-(n-1)/2) * (weite/(n-1));
        bullets.push({ x:e.x+Math.cos(a)*11, y:e.y-12+Math.sin(a)*9,
          vx:Math.cos(a)*120, vy:Math.sin(a)*120, dmg:2, t:0, col:PAL.R });
      }
      SFX.shoot(); SFX.heavy(); shake(1.2);
    }
    return;
  }
  if(onPlayer){
    if(dist(e.x,e.y,player.x,player.y) < d.range+player.r+5){
      hurtPlayer(e.dmg, e.x, e.y);
      if(player.thorns>0) damageEnemy(e, player.thorns, 60, Math.atan2(e.y-player.y,e.x-player.x), false);
    } else {                                    // daneben — kleine Staubwolke
      burst(e.x+Math.cos(e.ang)*8, e.y+Math.sin(e.ang)*8, 4, '#7a6a4a', 30, 0.3);
    }
  } else if(gd.d < d.range){
    damageCastle(d.gateDmg||d.dmg, gd.x, gd.y);
  }
}

   11. Geschosse, Beute, Partikel
   ------------------------------------------------------------------ */
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.t+=dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
    let gone = b.t>3.5 || b.x<4||b.x>WW-4||b.y<8||b.y>WH-4;
    if(!gone) for(const s of solids) if(dist2(b.x,b.y+4,s.x,s.y) < s.r*s.r*0.8){ gone=true; break; }
    if(!gone) for(const r of WALLS) if(inRect(b.x,b.y+4,r)){ gone=true; break; }
    if(b.own){
      if(!gone) for(const e of enemies){
        if(e.dead || e.spawnT>0) continue;
        if(dist(b.x, b.y, e.x, e.y-e.r*0.7) < e.r+3.5){
          damageEnemy(e, b.dmg, 80, Math.atan2(b.vy,b.vx), false);
          if(player.ice>0 && !e.dead) e.slowT=1.8;
          gone=true; break;
        }
      }
    } else {
      if(!gone && inRect(b.x,b.y+4,GATE_RECT)){ damageCastle(1,b.x,b.y); gone=true; }
      if(!gone && player.alive && player.inv<=0 && dist(b.x,b.y,player.x,player.y-6) < 6.5){
        hurtPlayer(b.dmg, b.x, b.y); gone=true;
      }
    }
    if(gone){ burst(b.x,b.y,5,b.col,50,0.25); bullets.splice(i,1); continue; }
    if(!b.own && Math.random()<dt*30) part(b.x,b.y,0,0,0.25,b.col,1);
  }
}
function updateDrops(dt){
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.t+=dt;
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.vx*=Math.pow(0.02,dt); d.vy*=Math.pow(0.02,dt);
    d.vz-=140*dt; d.z+=d.vz*dt;
    if(d.z<0){ d.z=0; d.vz*=-0.42; }
    if(player.alive){
      const dd=dist(d.x,d.y,player.x,player.y);
      const mag = d.type==='heart' ? player.magnet*0.8 : player.magnet;
      if(dd<mag && d.t>0.25){
        const a=Math.atan2(player.y-d.y, player.x-d.x), s=(1-dd/mag)*260+40;
        d.vx=lerp(d.vx,Math.cos(a)*s,0.25); d.vy=lerp(d.vy,Math.sin(a)*s,0.25);
      }
      if(dd<7){
        if(d.type==='scrap'){ game.scrap++; game.score+=3; SFX.pick(); }
        else { player.hp=Math.min(player.maxHp, player.hp+2); SFX.heal();
               floater(player.x,player.y-20,'HERZ',PAL.R); }
        burst(d.x,d.y,4,d.type==='heart'?PAL.R:PAL.M,40,0.25);
        drops.splice(i,1); continue;
      }
    }
    if(d.t>32) drops.splice(i,1);
  }
}
function updateFX(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt;
    p.vx*=Math.pow(0.25,dt); p.vy*=Math.pow(0.25,dt);
  }
  for(let i=slashes.length-1;i>=0;i--){ const s=slashes[i]; s.t+=dt; if(s.t>=s.dur) slashes.splice(i,1); }
  for(let i=shocks.length-1;i>=0;i--){
    const s=shocks[i]; s.t+=dt; s.r+=(s.max-s.r)*Math.min(1,dt*7);
    if(s.r>s.max-1.5) shocks.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.t+=dt; f.y-=14*dt; if(f.t>1) floaters.splice(i,1); }
  for(let i=blitze.length-1;i>=0;i--){ const b=blitze[i]; b.t+=dt; if(b.t>=b.dur) blitze.splice(i,1); }
}

   12. Haupt-Aktualisierung
   ------------------------------------------------------------------ */
let lastTap=null;
const SHOP = { w:176, h:126 };
function shopPanelRect(){ return { x:Math.round((VW-SHOP.w)/2), y:Math.round((VH-SHOP.h)/2)-4, w:SHOP.w, h:SHOP.h }; }
function shopBtnRect(){ return { x:4, y:VH-52, w:48, h:16 }; }
function ultraChipRect(){
  const u=activeUltra(); if(!u) return null;
  return { x:4, y:53, w:textW(u.name,1)+8, h:11 };
}
function cardRects(){
  if(!game.shopOpen) return [];
  const p=shopPanelRect();
  return game.cards.map((c,i)=>({ x:p.x+5, y:p.y+16+i*20, w:p.w-10, h:20, i }));
}
function codeRowRect(){
  const p=shopPanelRect();
  return { x:p.x+5, y:p.y+SHOP.h-22, w:p.w-10, h:16 };
}
const hitRect=(t,r)=> t.x>=r.x && t.x<=r.x+r.w && t.y>=r.y && t.y<=r.y+r.h;
function tryTapCards(){
  if(!lastTap || game.state!=='play') return false;
  const uc=ultraChipRect();
  if(uc && !game.shopOpen && hitRect(lastTap, uc)){ cycleUltra(); return true; }
  if(game.phase==='rest' && hitRect(lastTap, shopBtnRect())){
    game.shopOpen=!game.shopOpen; SFX.pick(); return true;
  }
  if(game.shopOpen){
    for(const r of cardRects()) if(hitRect(lastTap,r)){ buyCard(r.i); return true; }
    if(!hitRect(lastTap, shopPanelRect())){ game.shopOpen=false; SFX.pick(); }
    return true;
  }
  return false;
}
function update(dt){
  readInput();
  game.time+=dt; game.dt=dt;
  const startEdge = pressed.has(' ')||pressed.has('Enter')||pressed.has('__attack')||pressed.has('e');
  if(pressed.has('m')){ muted=!muted; if(muted&&AC){ master.gain.value=0; } else if(AC){ master.gain.value=0.5; } }

  if(game.state==='title'){
    if(startEdge){ audioUnlock(); newGame(); }
    pressed.clear(); return;
  }
  if(game.state==='over'){
    game.slow=Math.max(0,game.slow-dt);
    updateFX(dt*0.4);
    if(game.deadT===undefined) game.deadT=0;
    game.deadT+=dt;
    if(startEdge && game.deadT>1.0){ game.deadT=undefined; game.state='title'; }
    pressed.clear(); return;
  }
  if(pressed.has('p')||pressed.has('Escape')) game.paused=!game.paused;
  if(game.paused){ pressed.clear(); return; }

  // Werkstatt
  if(game.phase==='rest'){
    if(pressed.has('b')||pressed.has('Tab')) game.shopOpen=!game.shopOpen;
    if(pressed.has('1')){ game.shopOpen=true; buyCard(0); }
    if(pressed.has('2')){ game.shopOpen=true; buyCard(1); }
    if(pressed.has('3')){ game.shopOpen=true; buyCard(2); }
    if(pressed.has('4')){ game.shopOpen=true; buyCard(3); }
    if((pressed.has('Enter')||pressed.has('e')) && game.restT>0.6){ game.shopOpen=false; game.restT=0.3; }
  } else game.shopOpen=false;
  if(tryTapCards()) IN.attackEdge=false;
  lastTap=null;

  // Trefferstopp und Zeitlupe
  let sim=dt;
  if(game.hitstop>0){ game.hitstop-=dt; sim*=0.08; }
  if(game.slow>0){ game.slow-=dt; sim*=0.4; }

  updatePlayer(sim);
  updateEnemies(sim);
  updateBullets(sim);
  updateDrops(sim);
  updateFX(sim);

  // Turmwache: die Burg feuert auf alles in Torna(e)he
  if(game.turret>0){
    game.turretT-=sim;
    if(game.turretT<=0){
      game.turretT = 2.4/game.turret;
      let ziel=null, bd=140*140;
      for(const e of enemies){
        if(e.dead||e.spawnT>0) continue;
        const d2=dist2(CAS.gatePost.x, CAS.gatePost.y, e.x, e.y);
        if(d2<bd){ bd=d2; ziel=e; }
      }
      if(ziel){
        const a=Math.atan2(ziel.y-CAS.gatePost.y, ziel.x-CAS.gatePost.x);
        bullets.push({ x:CAS.gatePost.x, y:CAS.gatePost.y-8,
          vx:Math.cos(a)*170, vy:Math.sin(a)*170,
          dmg:4+game.turret*2, t:0, col:PAL.S, own:true });
        SFX.bow();
      }
    }
  }

  // Wellenablauf
  if(game.phase==='wave'){
    doSpawns(sim);
    if(!game.spawnList.length && enemies.length===0) endWave();
  } else {
    if(!game.shopOpen) game.restT-=dt;        // in Ruhe stoebern
    if(game.restT<=0) startWave();
  }

  // Kamera: fest auf die Spielfigur gerastert — kein Vorhalten, kein Nachziehen,
  // dadurch steht das Bild relativ zum Helden absolut ruhig.
  cam.x = clamp(q(player.x - VW/2), 0, WW-VW-1);
  cam.y = clamp(q(player.y - VH/2), 0, WH-VH-1);

  game.shake=Math.max(0,game.shake-dt*22);
  game.flash=Math.max(0,game.flash-dt*2);
  game.redFlash=Math.max(0,game.redFlash-dt*2);
  game.white=Math.max(0,(game.white||0)-dt*3.2);
  game.msgT=Math.max(0,game.msgT-dt);
  if(game.msgT<=0 && MSGQ.length){ const m=MSGQ.shift(); game.msg=m.txt; game.msgT=m.dur; game.msgCol=m.col; }
  game.tutorial=Math.max(0,game.tutorial-dt);
  musicTick();
  pressed.clear();
}

/* ------------------------------------------------------------------
   13. Zeichnen
   ------------------------------------------------------------------ */
function drawSpr(s, x, y, flip, flash){
  const img = flash ? s.flash : s.img;
  x=q(x); y=q(y);
  if(flip){ ctx.save(); ctx.translate(x+s.w, y); ctx.scale(-1,1); ctx.drawImage(img,0,0); ctx.restore(); }
  else ctx.drawImage(img, x, y);
}
function shadow(x,y,w,a=0.28){
  ctx.globalAlpha=a;
  pxDisc(ctx, Math.round(x), Math.round(y)-1, w/2, '#0a1408');
  ctx.globalAlpha=1;
}
function pxLine(x0,y0,x1,y1,col,th=1){
  ctx.fillStyle=col;
  const dx=x1-x0, dy=y1-y0, n=Math.max(Math.abs(dx),Math.abs(dy))|0;
  for(let i=0;i<=n;i++){
    const x=Math.round(x0+dx*i/n), y=Math.round(y0+dy*i/n);
    ctx.fillRect(x,y,th,th);
  }
}
function panel(x,y,w,h,bg='rgba(10,18,12,.86)',bd='#2f5c31'){
  ctx.fillStyle=bg; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=bd; ctx.fillRect(x,y,w,1); ctx.fillRect(x,y+h-1,w,1);
  ctx.fillRect(x,y,1,h); ctx.fillRect(x+w-1,y,1,h);
  ctx.fillStyle='#141019'; ctx.fillRect(x+1,y+1,1,1); ctx.fillRect(x+w-2,y+1,1,1);
  ctx.fillRect(x+1,y+h-2,1,1); ctx.fillRect(x+w-2,y+h-2,1,1);
}

function drawSlash(s){
  const p=clamp(s.t/s.dur,0,1);
  const cur = s.ang - s.arc*0.5 + s.arc*p;
  const span = s.arc*0.5;
  const r0=s.reach*0.5, r1=s.reach;
  for(let k=0;k<7;k++){
    const a = cur - span*(k/7);
    if(a < s.ang-s.arc*0.5) break;
    const fade = 1-k/7;
    ctx.fillStyle = s.heavy ? (k<2?'#fff3c4':(k<4?PAL.O:PAL.o)) : (k<2?'#ffffff':(k<4?'#dff0ff':PAL.C));
    ctx.globalAlpha = fade*(1-p*0.35);
    const rr0 = r0 + (1-fade)*3;
    for(let r=rr0; r<=r1; r+=1.1){
      const x=Math.round(s.x+Math.cos(a)*r), y=Math.round(s.y+Math.sin(a)*r*0.85);
      ctx.fillRect(x,y,1,1);
    }
  }
  ctx.globalAlpha=1;
}
function drawPlayer(){
  const p=player;
  shadow(p.x, p.y, 11);
  // --- Rolle: eingerollte Figur, die sich einmal ueberschlaegt ---
  if(p.dashT>0){
    const t=1-clamp(p.dashT/0.22,0,1);
    const dir=Math.cos(p.dashDir)>=0 ? 1 : -1;
    ctx.save();
    ctx.translate(Math.round(p.x), Math.round(p.y-6));
    ctx.rotate(t*TAU*1.15*dir);
    ctx.drawImage(SPR.roll.img, -7, -7);
    ctx.restore();
    return;
  }
  const moving=Math.hypot(p.vx,p.vy)>10;
  const fr = moving ? WALK_CYCLE[Math.floor(p.anim*6)%4] : 0;
  const set = p.face==='side' ? SPR.pSide : (p.face==='up' ? SPR.pUp : SPR.pDown);
  const s=set[fr];
  const px=p.x-8, py=p.y-15;
  // Schwert in der Hand (zeigt in Zielrichtung)
  const hx=p.x+Math.cos(p.aim)*5, hy=p.y-8+Math.sin(p.aim)*4;
  const tipx=hx+Math.cos(p.aim)*8, tipy=hy+Math.sin(p.aim)*7;
  const behind = Math.sin(p.aim) < -0.35;
  if(behind && !p.swing){ pxLine(hx,hy,tipx,tipy,PAL.M); pxLine(hx,hy+1,tipx,tipy+1,PAL.K); }
  if(p.shootT>0){                                   // Bogen kurz sichtbar
    const bx=p.x+Math.cos(p.aim)*6, by=p.y-8+Math.sin(p.aim)*5, n=p.aim+Math.PI/2;
    pxLine(bx+Math.cos(n)*4, by+Math.sin(n)*3, bx-Math.cos(n)*4, by-Math.sin(n)*3, PAL.B);
    pxLine(bx+Math.cos(n)*3+Math.cos(p.aim), by+Math.sin(n)*2, bx-Math.cos(n)*3+Math.cos(p.aim), by-Math.sin(n)*2, PAL.n);
  }
  const blink = p.inv>0 && Math.floor(p.inv*18)%2===0;
  if(!blink) drawSpr(s, px, py, p.flip, p.hurtT>0);
  if(!behind && !p.swing){ pxLine(hx,hy+1,tipx,tipy+1,PAL.K); pxLine(hx,hy,tipx,tipy,PAL.w); }
}
function drawEnemy(e){
  const s = e.d.spr[Math.floor(e.anim)%2];
  const bob = (e.st==='walk') ? (Math.floor(e.anim)%2) : 0;
  const x=e.x-s.w/2, y=e.y-s.h+2-bob;
  shadow(e.x, e.y, e.r*2.1);
  let flash = e.flash>0;
  if(e.st==='windup' && e.t > e.d.windup*0.45) flash = Math.floor(e.t*22)%2===0;
  if(e.st==='fuse') flash = Math.floor(e.t*(6+e.t*22))%2===0;
  if(e.spawnT>0){ ctx.globalAlpha=0.35+0.65*(1-e.spawnT/0.35); }
  drawSpr(s, x, y, e.flip, flash);
  ctx.globalAlpha=1;
  // Lebensbalken fuer dicke Brocken
  if((e.d.boss || e.hpMax>30) && e.hp<e.hpMax){
    const w=Math.round(s.w*0.9), bx=Math.round(e.x-w/2), by=Math.round(y-4);
    ctx.fillStyle='#141019'; ctx.fillRect(bx-1,by-1,w+2,4);
    ctx.fillStyle=PAL.r; ctx.fillRect(bx,by,Math.round(w*e.hp/e.hpMax),2);
  }
}
function drawBlitz(b){
  const a = 1 - b.t/b.dur, oben = b.y-78, n = 10;
  let px = b.x + Math.sin(b.seed)*9, py = oben;
  ctx.globalAlpha = Math.max(0, a);
  for(let i=1;i<=n;i++){
    const f=i/n;
    const nx = b.x + (1-f)*Math.sin(b.seed + i*2.7)*13;
    const ny = oben + (b.y-oben)*f;
    pxLine(px, py, nx, ny, i%3===0 ? PAL.C : '#ffffff', 1);
    if(i%3===1) pxLine(nx, ny, nx + Math.sin(b.seed+i*1.7)*8, ny+6, PAL.C, 1);
    px=nx; py=ny;
  }
  ctx.globalAlpha=1;
}
function drawShocks(){
  for(const s of shocks){
    const a=1-s.r/s.max;
    ctx.globalAlpha=Math.max(0,a*0.9); ctx.fillStyle=s.col;
    const steps=Math.max(12, Math.round(s.r*2.2));
    for(let i=0;i<steps;i++){
      const an=i/steps*TAU;
      ctx.fillRect(Math.round(s.x+Math.cos(an)*s.r), Math.round(s.y+Math.sin(an)*s.r*0.65), 1,1);
    }
    ctx.globalAlpha=1;
  }
}
function drawWorld(){
  const cx=Math.floor(cam.x), cy=Math.floor(cam.y);
  const fx=cam.x-cx, fy=cam.y-cy;                 // Bruchteil: immer ein Drittelvielfaches
  ctx.drawImage(GROUND, cx, cy, VW+1, VH+1, -fx, -fy, VW+1, VH+1);
  ctx.save(); ctx.translate(-cam.x, -cam.y);

  // Tor (mit Schadensstufe)
  const stage = game.castleHp<=0 ? 3 : (game.castleHp/game.castleMax>0.66 ? 0 : (game.castleHp/game.castleMax>0.33 ? 1 : 2));
  ctx.drawImage(GATE_IMG[stage], CAS.gate.x, CAS.gate.y);
  if(game.flash>0){ ctx.globalAlpha=game.flash; ctx.fillStyle='#ffd9a0';
    ctx.fillRect(CAS.gate.x, CAS.gate.y, CAS.gate.w, CAS.gate.h); ctx.globalAlpha=1; }

  // Lagerfeuer im Hof
  {
    const f=game.time*9;
    for(let i=0;i<7;i++){
      const h=i*1.3, w=3.2-i*0.38;
      const off=Math.sin(f+i*0.8)*w*0.5;
      ctx.fillStyle = i<2 ? PAL.y : (i<4 ? PAL.O : PAL.o);
      ctx.fillRect(Math.round(FIRE.x+off-w/2), Math.round(FIRE.y-2-h), Math.max(1,Math.round(w)), 2);
    }
    ctx.fillStyle='rgba(255,180,80,.10)';
    pxDisc(ctx, FIRE.x, FIRE.y, 16+Math.sin(f*0.7)*1.5, 'rgba(255,180,80,.10)');
    if(Math.random()<0.25) part(FIRE.x+rr(-2,2), FIRE.y-6, rr(-6,6), rr(-22,-10), 0.7, PAL.O, 1);
  }

  // Beute liegt unter allem anderen
  for(const d of drops){
    const y=d.y-d.z;
    shadow(d.x, d.y+1, 5, 0.22);
    if(d.type==='scrap'){ drawSpr(SPR.bolt, d.x-2.5, y-5, false, Math.floor(game.time*8)%6===0); }
    else drawSpr(SPR.heart, d.x-3.5, y-8, false, false);
  }
  // Geschosse
  for(const b of bullets){
    if(b.own){
      const a=Math.atan2(b.vy,b.vx);
      pxLine(b.x-Math.cos(a)*5, b.y-Math.sin(a)*5, b.x, b.y, PAL.B);
      ctx.fillStyle=PAL.w; ctx.fillRect(Math.round(b.x),Math.round(b.y),1,1);
      ctx.fillStyle=PAL.S;
      ctx.fillRect(Math.round(b.x-Math.cos(a)*6),Math.round(b.y-Math.sin(a)*6),1,1);
    } else {
      ctx.fillStyle=PAL.P; ctx.fillRect(Math.round(b.x)-1, Math.round(b.y)-1, 3,3);
      ctx.fillStyle='#ffffff'; ctx.fillRect(Math.round(b.x), Math.round(b.y), 1,1);
    }
  }
  // Alles Sortierbare nach Fusslinie zeichnen
  const list=[];
  const vx0=cx-40, vx1=cx+VW+40, vy0=cy-60, vy1=cy+VH+60;   // grosszuegiger Rand
  for(const p of props){
    if(p.x+p.w<vx0||p.x>vx1||p.y+p.h<vy0||p.y>vy1) continue;
    list.push({s:p.sort, kind:'prop', o:p});
  }
  for(const e of enemies){
    if(e.x<vx0||e.x>vx1||e.y<vy0||e.y>vy1) continue;
    list.push({s:e.y, kind:'bot', o:e});
  }
  if(player.alive) list.push({s:player.y, kind:'player', o:player});
  list.sort((a,b)=>a.s-b.s);
  // Wer laesst Laub durchscheinen: die Spielfigur und Bots dicht bei ihr
  const boxen=[];
  if(player.alive) boxen.push({x0:player.x-6, x1:player.x+6, y0:player.y-16, y1:player.y+2});
  for(const e of enemies){
    if(e.dead || e.spawnT>0) continue;
    if(dist2(e.x,e.y,player.x,player.y) > 90*90) continue;
    boxen.push({x0:e.x-e.r, x1:e.x+e.r, y0:e.y-e.r*2.2, y1:e.y+2});
  }
  for(const it of list){
    if(it.kind==='prop'){
      const p=it.o;
      const x=Math.round(p.x), y=Math.round(p.y);
      if(p.ghost){
        // Steckt jemand im Laub? Dann durchscheinend zeichnen.
        let drin=false;
        for(const b of boxen)
          if(b.x1>p.x && b.x0<p.x+p.w && b.y1>p.y && b.y0<p.y+p.h){ drin=true; break; }
        const ziel = drin ? 1 : 0;
        if(p.gh===undefined) p.gh=ziel;
        p.gh = lerp(p.gh, ziel, 1-Math.pow(0.0008, game.dt||0.016));
        if(p.gh>0.02){
          if(p.gh<0.98){ ctx.globalAlpha=1-p.gh; ctx.drawImage(p.img, x, y); }
          ctx.globalAlpha=p.gh; ctx.drawImage(p.ghost, x, y);
          ctx.globalAlpha=1;
        } else ctx.drawImage(p.img, x, y);
      } else ctx.drawImage(p.img, x, y);
    }
    else if(it.kind==='bot') drawEnemy(it.o);
    else drawPlayer();
  }
  // Effekte obenauf
  for(const s of slashes) drawSlash(s);
  for(const b of blitze) drawBlitz(b);
  drawShocks();
  for(const p of parts){
    const a=p.life/p.max;
    ctx.globalAlpha=a>0.35?1:a*2.8; ctx.fillStyle=p.col;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }
  ctx.globalAlpha=1;
  for(const f of floaters){
    ctx.globalAlpha=1-f.t;
    drawTextC(ctx, f.txt, f.x, f.y, f.col, 1);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

   14. Anzeige (HUD) und Bildschirme

function drawHearts(){

  for(let i=0;i<n;i++){
    const x=4+i*8, y=3;
    drawSpr(SPR.heartE, x, y, false, false);
    const v=player.hp-i*2;
    if(v>=2) drawSpr(SPR.heart, x, y, false, false);

function bar(x,y,w,frac,col,label,dim){

function drawSchild(){

function drawRegen(){

function drawGateBar(){

  drawSpr(SPR.tower, x-9, y-1, false, false);
