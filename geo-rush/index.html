"use strict";
(function(){
/* ============================================================
   GEO RUSH  —  ein Rhythmus-Plattformer im Stil von Geometry Dash
   Alles in einer Datei: kein Build, keine Assets, kein Server.
   ============================================================ */

/* ------------------------- Physik-Konstanten ------------------------ */
const T      = 40;            // Kachelgroesse in px
const PS     = 36;            // Spieler-Hitbox (Quadrat)
const HALF   = PS / 2;
const INNER  = 7;             // halbe Kantenlaenge der inneren Hitbox (Block-Tod)
const SNAP   = 10;            // Toleranz beim Aufsetzen auf Bloecke
const GRAV   = 4760;          // px/s^2  (Wuerfel)
const JUMP   = 918;           // Absprunggeschwindigkeit
const VMAX   = 1250;          // maximale Fallgeschwindigkeit
const SHIP_UP = 2600, SHIP_DN = 2200, SHIP_V = 520;
const SPEEDS = [416, 540];    // normal, schnell
const CEIL   = -10 * T;       // Decke im Schiff-Modus
const SKY    = -26 * T;       // darueber: ins All gefallen = tot
const DT     = 1 / 240;       // feste Simulationsrate 240 Hz
const PAD_V  = { y: 1.40 * JUMP, p: 0.86 * JUMP };
const ORB_V  = { o: 1.00 * JUMP, q: 0.72 * JUMP };

/* ------------------------------ Level ------------------------------- *
   Jedes Level ist eine Liste aus Zahlen (= so viele leere Spalten) und
   kleinen ASCII-Bloecken. Die unterste Zeile eines Blocks liegt auf dem
   Boden, Bloecke werden nebeneinander gehaengt.

   #  Block          -  Halbblock (Plattform)
   ^  Stachel        v  haengender Stachel      .  kleiner Stachel
   y  gelbes Pad     p  pinkes Pad
   o  gelber Orb     q  pinker Orb              b  blauer Orb (Schwerkraft)
   S  Schiff-Portal  C  Wuerfel-Portal
   G  Schwerkraft umdrehen   N  Schwerkraft normal
   >  schnell        <  normale Geschwindigkeit
   *  Muenze (3 pro Level)
   -------------------------------------------------------------------- */

// Schiff-Abschnitt: Saeulen von Boden und Decke mit einer Luecke dazwischen.
// spec: [unterkante, lueckengroesse] je Saeule; floorSpikes legt Stacheln auf den Boden.
function pillars(spec, spacing, floorSpikes){
  const rows = [];
  for (let r = 0; r < 10; r++) rows.push('');
  const col = (fn) => { for (let r = 0; r < 10; r++) rows[r] += fn(r); };
  for (const [lo, gap] of spec){
    for (let s = 0; s < spacing; s++) col(r => (floorSpikes && r === 0) ? '^' : ' ');
    col(r => (r < lo || r >= lo + gap) ? '#' : ' ');
  }
  for (let s = 0; s < spacing; s++) col(r => (floorSpikes && r === 0) ? '^' : ' ');
  return rows.reverse();          // oberste Zeile zuerst
}

function parseLevel(def){
  const cells = []; let col = 0;
  for (const ch of def.chunks){
    if (typeof ch === 'number'){ col += ch; continue; }
    const h = ch.length; let w = 0;
    for (let i = 0; i < h; i++){
      const line = ch[i]; w = Math.max(w, line.length);
      for (let j = 0; j < line.length; j++)
        if (line[j] !== ' ') cells.push([line[j], col + j, h - 1 - i]);
    }
    col += w;
  }
  const blocks = new Set();
  for (const [c, cc, r] of cells) if (c === '#') blocks.add(cc + ',' + r);
  const has = (c, r) => blocks.has(c + ',' + r);
  const objs = [];
  for (const [c, cc, r] of cells){
    const x0 = cc * T, y0 = -(r + 1) * T; let o;
    switch (c){
      case '#': o = { k:'block', solid:1, x:x0, y:y0, w:T, h:T,
                      nt:has(cc,r+1), nb:r===0||has(cc,r-1), nl:has(cc-1,r), nr:has(cc+1,r) }; break;
      case '-': o = { k:'slab', solid:1, x:x0, y:y0, w:T, h:T/2 }; break;
      case '^': o = { k:'spike', haz:1, dir:1,  x:x0+.36*T, y:y0+.32*T, w:.28*T, h:.68*T }; break;
      case 'v': o = { k:'spike', haz:1, dir:-1, x:x0+.36*T, y:y0,       w:.28*T, h:.68*T }; break;
      case '.': o = { k:'mini',  haz:1, x:x0+.36*T, y:y0+.62*T, w:.28*T, h:.38*T }; break;
      case 'y': case 'p': o = { k:'pad', c, x:x0+.08*T, y:y0+.72*T, w:.84*T, h:.28*T }; break;
      case 'o': case 'q': case 'b': o = { k:'orb', c, x:x0-.12*T, y:y0-.12*T, w:1.24*T, h:1.24*T }; break;
      case 'S': case 'C': case 'G': case 'N': case '>': case '<':
        o = { k:'portal', c, x:x0+T/2, y:y0-T, w:0, h:3*T }; break;
      case '*': o = { k:'coin', x:x0+.12*T, y:y0+.12*T, w:.76*T, h:.76*T }; break;
      default: continue;
    }
    o.cx = x0 + T/2; o.cy = y0 + T/2; o.col = cc; o.row = r;
    objs.push(o);
  }
  objs.sort((a, b) => a.cx - b.cx);
  let ci = 0;
  objs.forEach((o, i) => { o.id = i; if (o.k === 'coin') o.ci = ci++; });
  const nCols = col + 24;
  const buckets = Array.from({ length: nCols }, () => []);
  for (const o of objs){
    const a = Math.max(0, Math.floor(o.x / T)), b = Math.min(nCols - 1, Math.floor((o.x + o.w) / T));
    for (let i = a; i <= b; i++) buckets[i].push(o);
  }
  return { def, objs, buckets, nCols, endX: (col + 6) * T, coins: ci };
}

let stamp = 0;
function near(L, x0, x1, out){
  stamp++; out.length = 0;
  const a = Math.max(0, Math.floor(x0 / T) - 1), b = Math.min(L.nCols - 1, Math.floor(x1 / T) + 1);
  for (let i = a; i <= b; i++) for (const o of L.buckets[i])
    if (o._s !== stamp){ o._s = stamp; out.push(o); }
  return out;
}

/* ---------------------------- Simulation ---------------------------- */
function newPlayer(L){
  return { x:0, y:-PS, vy:0, g:1, mode:'cube', spd:L.def.speed || 0, grounded:true,
           held:false, buf:false, used:[], coins:[], rot:0, dead:false, won:false, jumps:0 };
}
function clonePlayer(p){ return Object.assign({}, p, { used:p.used.slice(), coins:p.coins.slice() }); }

function applyPortal(p, o, ev){
  switch (o.c){
    case 'S': if (p.mode !== 'ship'){ p.mode = 'ship'; p.vy *= 0.5; ev && ev.push('portal'); } break;
    case 'C': if (p.mode !== 'cube'){ p.mode = 'cube'; ev && ev.push('portal'); } break;
    case 'G': if (p.g !== -1){ p.g = -1; p.vy *= 0.5; p.grounded = false; ev && ev.push('portal'); } break;
    case 'N': if (p.g !== 1){ p.g = 1; p.vy *= 0.5; p.grounded = false; ev && ev.push('portal'); } break;
    case '>': if (p.spd !== 1){ p.spd = 1; ev && ev.push('speed'); } break;
    case '<': if (p.spd !== 0){ p.spd = 0; ev && ev.push('speed'); } break;
  }
}

const tmp = [];
function die(p, ev){ p.dead = true; ev && ev.push('die'); }
const hit = (ax, ay, aw, ah, o) => ax < o.x + o.w && ax + aw > o.x && ay < o.y + o.h && ay + ah > o.y;

// Ein Simulationsschritt (1/240 s). ev sammelt Ereignisse fuer Sound/Effekte.
function step(p, L, held, ev){
  if (held && !p.held) p.buf = true;
  if (!held) p.buf = false;
  p.held = held;
  const x0 = p.x, y0 = p.y, wasGrounded = p.grounded;
  p.x += SPEEDS[p.spd] * DT;
  const list = near(L, x0, p.x + PS, tmp);

  const cPrev = x0 + HALF, cNow = p.x + HALF;
  for (const o of list) if (o.k === 'portal' && cPrev < o.x && cNow >= o.x) applyPortal(p, o, ev);

  const g = p.g;
  if (p.mode === 'cube'){
    if (p.grounded && held){
      p.vy = -JUMP * g; p.buf = false; p.grounded = false; p.jumps++;
      ev && ev.push('jump');
    }
    p.vy += GRAV * g * DT;
    if (p.vy * g > VMAX) p.vy = VMAX * g;
  } else {
    p.vy += (held ? -SHIP_UP : SHIP_DN) * g * DT;
    if (p.vy >  SHIP_V) p.vy =  SHIP_V;
    if (p.vy < -SHIP_V) p.vy = -SHIP_V;
  }
  p.y += p.vy * DT;
  p.grounded = false;

  if (p.y + PS > 0){ p.y = -PS; if (p.vy > 0) p.vy = 0; if (g === 1) p.grounded = true; }
  if (p.mode === 'ship' && p.y < CEIL){ p.y = CEIL; if (p.vy < 0) p.vy = 0; if (g === -1) p.grounded = true; }

  // Aufsetzen auf Bloecken (je nach Schwerkraft oben oder unten)
  for (const o of list){
    if (!o.solid || !hit(p.x, p.y, PS, PS, o)) continue;
    const top = o.y, bot = o.y + o.h;
    if (g === 1){
      if (p.vy >= 0 && y0 + PS <= top + SNAP){ p.y = top - PS; p.vy = 0; p.grounded = true; }
      else if (p.mode === 'ship' && p.vy <= 0 && y0 >= bot - SNAP){ p.y = bot; p.vy = 0; }
    } else {
      if (p.vy <= 0 && y0 >= bot - SNAP){ p.y = bot; p.vy = 0; p.grounded = true; }
      else if (p.mode === 'ship' && p.vy >= 0 && y0 + PS <= top + SNAP){ p.y = top - PS; p.vy = 0; }
    }
  }

  const ix = p.x + HALF - INNER, iy = p.y + HALF - INNER, is = INNER * 2;
  for (const o of list){
    if (o.solid){ if (hit(ix, iy, is, is, o)) return die(p, ev); continue; }
    if (o.k === 'portal' || !hit(p.x, p.y, PS, PS, o)) continue;
    if (o.haz) return die(p, ev);
    if (o.k === 'pad' && !p.used.includes(o.id)){
      p.used.push(o.id);
      p.vy = -PAD_V[o.c] * p.g * (p.mode === 'ship' ? 0.55 : 1);
      p.grounded = false; ev && ev.push('pad');
    } else if (o.k === 'orb' && p.buf && !p.used.includes(o.id)){
      p.used.push(o.id); p.buf = false; p.grounded = false;
      if (o.c === 'b'){ p.g = -p.g; p.vy = p.g * 0.45 * JUMP; }
      else p.vy = -ORB_V[o.c] * p.g * (p.mode === 'ship' ? 0.6 : 1);
      ev && ev.push('orb');
    } else if (o.k === 'coin' && !p.coins.includes(o.ci)){
      p.coins.push(o.ci); ev && ev.push('coin');
    }
  }
  if (p.y < SKY || p.y > 200) return die(p, ev);
  if (p.x >= L.endX){ p.won = true; ev && ev.push('win'); }
  if (!wasGrounded && p.grounded && p.mode === 'cube') ev && ev.push('land');

  if (p.mode === 'cube'){
    if (p.grounded){
      const t = Math.round(p.rot / 90) * 90;
      p.rot += (t - p.rot) * Math.min(1, DT * 28);
    } else p.rot += 430 * DT * p.g;
  }
}

const cv  = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 960, H = 540;
const CAM0 = -470;               // Boden liegt bei Bildschirm-y 470
const PLAYER_SX = 250;           // Bildschirm-x des Spielers

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);

let scale = 1;
function resize(){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const bw = Math.max(1, Math.round(r.width * dpr)), bh = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== bw || cv.height !== bh){ cv.width = bw; cv.height = bh; }
  scale = bw / W;
}
window.addEventListener('resize', resize);

/* ------------------------------ Speicher ---------------------------- */
const SAVE_KEY = 'georush-v1';
let save = { best:{}, practice:{}, coins:{}, attempts:{}, muted:false, skin:0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch(e){}
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){} }

/* ------------------------------ Figuren ----------------------------- */
// a = Koerper, b = Maske/Details, c = dunkle Kante des Koerpers
const SKINS = [
  { name:'Zack',  a:'#8dff3a', b:'#19c8ff', c:'#3d9a12' },
  { name:'Glut',  a:'#ff8a1f', b:'#ffe14a', c:'#b2440a' },
  { name:'Frost', a:'#7fe9ff', b:'#ffffff', c:'#2a8fb8' },
  { name:'Nacht', a:'#b25cff', b:'#ff5fd2', c:'#5b1fa3' },
  { name:'Gold',  a:'#ffd84a', b:'#ff5a3d', c:'#b88a00' }
];
const skin = () => SKINS[save.skin] || SKINS[0];
function cycleSkin(d){ save.skin = ((save.skin || 0) + d + SKINS.length) % SKINS.length; persist(); SFX.click(); }

/* ------------------------------- Audio ------------------------------ */
const A = { ctx:null, master:null, music:null, sfx:null, noise:null };
function initAudio(){
  if (A.ctx){ if (A.ctx.state === 'suspended' && Game.state !== 'pause') A.ctx.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  A.ctx = new C();
  A.master = A.ctx.createGain(); A.master.gain.value = save.muted ? 0 : 0.7;
  const comp = A.ctx.createDynamicsCompressor();
  A.master.connect(comp); comp.connect(A.ctx.destination);
  A.music = A.ctx.createGain(); A.music.gain.value = 0.55; A.music.connect(A.master);
  A.sfx = A.ctx.createGain(); A.sfx.gain.value = 0.8; A.sfx.connect(A.master);
  const len = A.ctx.sampleRate;
  A.noise = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
  const d = A.noise.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}
function setMuted(m){
  save.muted = m; persist();
  if (A.master) A.master.gain.setTargetAtTime(m ? 0 : 0.7, A.ctx.currentTime, 0.02);
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function voice(dest, t, type, f1, f2, vol, atk, dec, cut){
  const c = A.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + atk + dec);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t + atk + dec);
  let n = o;
  if (cut){ const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; o.connect(f); n = f; }
  n.connect(g); g.connect(dest);
  o.start(t); o.stop(t + atk + dec + 0.05);
}
function noiseHit(dest, t, type, freq, vol, dec, q){
  const c = A.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = A.noise; f.type = type; f.frequency.value = freq; f.Q.value = q || 0.8;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
  s.connect(f); f.connect(g); g.connect(dest);
  s.start(t, Math.random() * 0.5); s.stop(t + dec + 0.05);
}

const SFX = {
  ok(){ return A.ctx && !save.muted; },
  die(){ if (!this.ok()) return; const t = A.ctx.currentTime;
    noiseHit(A.sfx, t, 'lowpass', 1800, 0.9, 0.5); voice(A.sfx, t, 'sawtooth', 220, 40, 0.35, 0.005, 0.45, 900); },
  orb(){ if (!this.ok()) return; const t = A.ctx.currentTime;
    voice(A.sfx, t, 'sine', 700, 1400, 0.22, 0.004, 0.12); },
  pad(){ if (!this.ok()) return; const t = A.ctx.currentTime;
    voice(A.sfx, t, 'triangle', 260, 780, 0.25, 0.004, 0.16); },
  portal(){ if (!this.ok()) return; const t = A.ctx.currentTime;
    voice(A.sfx, t, 'sawtooth', 180, 1100, 0.12, 0.01, 0.3, 2400); noiseHit(A.sfx, t, 'bandpass', 2500, 0.2, 0.3, 0.6); },
  coin(){ if (!this.ok()) return; const t = A.ctx.currentTime;
    voice(A.sfx, t, 'square', 1319, 0, 0.1, 0.004, 0.1, 5000); voice(A.sfx, t + 0.08, 'square', 1760, 0, 0.1, 0.004, 0.25, 5000); },
  win(){ if (!this.ok()) return; const t = A.ctx.currentTime;
    [0, 4, 7, 12, 16, 19, 24].forEach((n, i) => voice(A.sfx, t + i * 0.07, 'square', mtof(72 + n), 0, 0.09, 0.004, 0.35, 4000)); },
  click(){ if (!this.ok()) return; voice(A.sfx, A.ctx.currentTime, 'square', 900, 1200, 0.06, 0.002, 0.05, 4000); },
  check(){ if (!this.ok()) return; const t = A.ctx.currentTime;
    voice(A.sfx, t, 'triangle', 880, 0, 0.15, 0.004, 0.18); voice(A.sfx, t + 0.06, 'triangle', 1320, 0, 0.12, 0.004, 0.2); }
};

// Kleiner Step-Sequencer: Bassdrum, Clap, Hi-Hat, Bass, Arpeggio, Flaechen.
const MINOR = [0, 2, 3, 5, 7, 8, 10];
const Music = {
  on:false, song:null, bus:null, step:0, next:0, start:0, timer:null,
  play(song){
    if (!A.ctx) return;
    this.stop();
    this.song = song; this.step = 0;
    this.bus = A.ctx.createGain(); this.bus.connect(A.music);
    this.start = this.next = A.ctx.currentTime + 0.05;
    this.on = true;
    this.timer = setInterval(() => this.tick(), 25);
    this.tick();
  },
  stop(){
    if (!this.on) return;
    this.on = false; clearInterval(this.timer);
    const b = this.bus, t = A.ctx.currentTime;
    b.gain.setValueAtTime(b.gain.value, t); b.gain.linearRampToValueAtTime(0, t + 0.08);
    setTimeout(() => b.disconnect(), 400);
  },
  tick(){
    if (!this.on) return;
    const sd = 60 / this.song.bpm / 4;
    while (this.next < A.ctx.currentTime + 0.12){ this.note(this.step, this.next, sd); this.step++; this.next += sd; }
  },
  beat(){ return (this.on && A.ctx) ? Math.max(0, (A.ctx.currentTime - this.start) * this.song.bpm / 60) : -1; },
  deg(d){ const s = this.song; return s.root + MINOR[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7); },
  note(i, t, sd){
    const s = this.song, b = this.bus, k = i % 16, bar = Math.floor(i / 16);
    const ch = s.prog[bar % s.prog.length];
    const intro = bar < 2, drop = bar >= 4;
    if (k % 4 === 0 && !(intro && k !== 0)) voice(b, t, 'sine', 150, 42, 0.9, 0.002, 0.22);
    if (!intro && (k === 4 || k === 12)) noiseHit(b, t, 'bandpass', 1600, 0.35, 0.14, 0.9);
    if (!intro && k % 2 === 0) noiseHit(b, t, 'highpass', 7500, k % 4 === 2 ? 0.16 : 0.07, 0.04);
    if (!intro && k % 2 === 0){
      const oct = (k % 4 === 2) ? 12 : 0;
      voice(b, t, 'sawtooth', mtof(this.deg(ch) - 24 + oct), 0, 0.2, 0.004, sd * 1.7, 700);
    }
    const arp = [0, 2, 4, 7, 4, 2, 0, 2, 4, 7, 9, 7, 4, 2, 4, 7];
    voice(b, t, 'square', mtof(this.deg(ch + arp[k]) + 12), 0, drop ? 0.06 : 0.045, 0.003, sd * 1.4, drop ? 3400 : 1800);
    if (k === 0){
      for (const d of [0, 2, 4]) voice(b, t, 'sawtooth', mtof(this.deg(ch + d)), 0, 0.035, 0.08, sd * 15, 1100);
    }
    if (drop && (k === 0 || k === 6 || k === 10)){
      voice(b, t, 'triangle', mtof(this.deg(ch + (k === 0 ? 7 : k === 6 ? 9 : 11)) + 12), 0, 0.09, 0.005, sd * 3);
    }
  }
};

/* ------------------------------ Eingabe ----------------------------- */
const JUMP_KEYS = new Set(['Space', 'ArrowUp', 'KeyW']);
const keysHeld = new Set();
const pointers = new Set();
let latch = false;          // ganz kurze Tipper gehen nicht verloren
let needRelease = false;    // nach Start mit Taste erst loslassen

/* ------------------------------ Zustand ----------------------------- */
const PARSED = LEVELS.map(parseLevel);
const Game = {
  state:'menu', sel:0, practice:false, L:null, li:0, p:null, attempt:1,
  cps:[], deadT:0, winT:0, parts:[], shake:0, camX:-PLAYER_SX, camY:CAM0, t:0,
  best0:0, newBest:false, hits:[], shipA:0, menuX:0, runJumps:0, runTime:0,
  sq:0, sqV:0, blink:0, nextBlink:2.5,
  cur:{ kind:'main', i:0 },      // was gerade gespielt wird (Hauptlevel oder eigenes Level)
  modal:null, toast:null
};

function heldNow(){
  if (needRelease){
    if (keysHeld.size === 0 && pointers.size === 0) needRelease = false;
    else return false;
  }
  return keysHeld.size > 0 || pointers.size > 0 || latch;
}

function startLevel(i){
  Game.li = i;
  startDef(PARSED[i], { kind:'main', i });
}
function startCustom(id, test){
  const lv = customById(id);
  if (!lv) return;
  startDef(parseLevel(customDef(lv)), { kind:'custom', id, test:!!test });
}
function restartCurrent(){
  const c = Game.cur;
  if (c.kind === 'main') startLevel(c.i); else startCustom(c.id, c.test);
}
// Verlassen eines Laufs: zurueck dahin, wo man herkam
function exitPlay(){
  Music.stop();
  if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
  const c = Game.cur;
  if (c.kind === 'custom' && c.test) openEditor(c.id, true);
  else if (c.kind === 'custom') Game.state = 'mylevels';
  else Game.state = 'menu';
}
function exitLabel(){ const c = Game.cur; return c.kind === 'custom' ? (c.test ? 'Editor' : 'Zurück') : 'Menü'; }
function startDef(L, cur){
  initAudio();
  Game.cur = cur; Game.L = L; Game.modal = null;
  Game.p = newPlayer(Game.L);
  Game.attempt = 1; Game.cps = []; Game.parts = []; Game.shake = 0; Game.sq = 0; Game.sqV = 0;
  Game.camX = Game.p.x - PLAYER_SX; Game.camY = CAM0; Game.shipA = 0;
  Game.best0 = (Game.practice ? save.practice : save.best)[Game.L.def.id] || 0;
  Game.newBest = false; Game.runJumps = 0; Game.runTime = 0;
  bumpAttempts();
  Game.state = 'play';
  needRelease = true;              // die Starttaste loest keinen Sprung aus
  Music.play(Game.L.def.song);
}
function bumpAttempts(){
  const id = Game.L.def.id;
  save.attempts[id] = (save.attempts[id] || 0) + 1; persist();
}
function respawn(){
  const L = Game.L;
  if (Game.practice && Game.cps.length){
    Game.p = clonePlayer(Game.cps[Game.cps.length - 1].p);
    Game.p.held = false; Game.p.buf = false;
  } else {
    Game.p = newPlayer(L);
    Music.play(L.def.song);
  }
  if (!Game.practice) Game.runJumps = 0, Game.runTime = 0;
  Game.attempt++; bumpAttempts();
  Game.parts = []; Game.state = 'play';
  Game.camX = Game.p.x - PLAYER_SX;
  Game.shipA = Game.p.mode === 'ship' ? 1 : 0;
  if (Game.p.mode === 'ship') Game.camY = CAM0;
}
function progress(){ return clamp(Math.floor(Game.p.x / Game.L.endX * 100), 0, 100); }
function recordProgress(pc){
  const tbl = Game.practice ? save.practice : save.best, id = Game.L.def.id;
  if (pc > (tbl[id] || 0)){ tbl[id] = pc; persist(); if (pc > Game.best0) Game.newBest = true; }
}
function addCheckpoint(){
  if (!Game.practice || Game.state !== 'play') return;
  const p = Game.p;
  if (p.mode === 'cube' && !p.grounded) return;   // nur mit festem Boden unter den Fuessen
  Game.cps.push({ p: clonePlayer(p) }); SFX.check();
}
function removeCheckpoint(){ if (Game.practice) Game.cps.pop(); }
function togglePause(){
  if (Game.state === 'play'){ Game.state = 'pause'; if (A.ctx) A.ctx.suspend(); }
  else if (Game.state === 'pause'){ Game.state = 'play'; needRelease = true; if (A.ctx) A.ctx.resume(); }
}

/* ----------------------------- Partikel ----------------------------- */
function stretch(v){ Game.sq = v; Game.sqV = 0; }
function dust(p, n){
  const fy = p.g === 1 ? p.y + PS : p.y, c = skin().a;
  for (let i = 0; i < n; i++){
    const dir = i % 2 ? 1 : -1;
    Game.parts.push({ x:p.x + HALF + dir * rnd(4, 16), y:fy, vx:dir * rnd(40, 140) - 60, vy:-rnd(10, 70) * p.g,
                      life:.3, max:.3, size:rnd(3, 6), col:c, g:0, soft:1 });
  }
}
// Die Figur zerspringt in Stuecke
function shatter(x, y){
  const sk = skin();
  for (let i = 0; i < 16; i++){
    const a = Math.random() * Math.PI * 2, s = rnd(120, 460);
    Game.parts.push({ x:x + rnd(-10, 10), y:y + rnd(-10, 10), vx:Math.cos(a) * s, vy:Math.sin(a) * s - 180,
      life:rnd(.6, 1), max:1, size:rnd(6, 13), col:[sk.a, sk.b, sk.c, '#111'][i % 4], g:900, rot:rnd(0, 6), vr:rnd(-12, 12) });
  }
}
function burst(x, y, n, col, spd, life, size){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = rnd(spd * .3, spd);
    Game.parts.push({ x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:rnd(life * .5, life), max:life, size:rnd(size * .5, size), col, g:0 });
  }
}

/* ------------------------------ Update ------------------------------ */
let acc = 0;
function update(dt){
  Game.t += dt;
  Game.shake = Math.max(0, Game.shake - dt * 30);
  // Squash & Stretch als gedaempfte Feder
  Game.sqV += (-Game.sq * 260 - Game.sqV * 16) * dt;
  Game.sq += Game.sqV * dt;
  // Blinzeln
  Game.nextBlink -= dt;
  if (Game.nextBlink <= 0){ Game.blink = 0.13; Game.nextBlink = rnd(2, 4.5); }
  Game.blink = Math.max(0, Game.blink - dt);
  Game.menuX += dt * SPEEDS[0];

  for (const q of Game.parts){
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt; q.vx *= 0.98; q.life -= dt;
    if (q.vr) q.rot += q.vr * dt;
  }
  Game.parts = Game.parts.filter(q => q.life > 0);

  if (Game.toast){ Game.toast.t -= dt; if (Game.toast.t <= 0) Game.toast = null; }
  if (Game.state === 'editor'){ edUpdate(dt); return; }
  if (Game.state === 'dead'){
    Game.deadT += dt;
    if (Game.deadT > 1.0) respawn();
    return;
  }
  if (Game.state === 'win'){ Game.winT += dt; updateCam(dt); return; }
  if (Game.state !== 'play'){ acc = 0; return; }

  const p = Game.p, L = Game.L;
  acc += dt;
  let steps = 0;
  const ev = [];
  while (acc >= DT && steps < 40){
    acc -= DT; steps++;
    step(p, L, heldNow(), ev);
    if (p.dead || p.won) break;
  }
  latch = false;
  Game.runTime += dt;
  for (const e of ev) onEvent(e);
  Game.shipA += ((p.mode === 'ship' ? 1 : 0) - Game.shipA) * Math.min(1, dt * 5);

  // Spur
  const cx = p.x + HALF, cy = p.y + HALF;
  const sk = skin();
  if (p.mode === 'ship'){
    for (let i = 0; i < 2; i++)
      Game.parts.push({ x:cx - 22, y:cy + 6 * p.g, vx:rnd(-160, -60), vy:rnd(-30, 30), life:.3, max:.3, size:rnd(4, 8), col:i ? sk.b : '#ffb13b', g:0, soft:1 });
  } else if (p.grounded && Math.random() < 0.5){
    const fy = p.g === 1 ? p.y + PS : p.y;
    Game.parts.push({ x:p.x + 2, y:fy - 3 * p.g, vx:rnd(-110, -40), vy:rnd(-50, 0) * p.g, life:.35, max:.35, size:rnd(3, 5), col:sk.a, g:0, soft:1 });
  }
  updateCam(dt);
}

function onEvent(e){
  const p = Game.p, cx = p.x + HALF, cy = p.y + HALF;
  switch (e){
    case 'jump': Game.runJumps++; stretch(0.22); dust(p, 6); break;
    case 'land': stretch(-0.2); dust(p, 8); break;
    case 'orb': SFX.orb(); stretch(0.2); burst(cx, cy, 10, '#fff27a', 260, .35, 4); Game.runJumps++; break;
    case 'pad': SFX.pad(); stretch(0.3); burst(cx, p.y + PS, 10, '#ffd23f', 240, .35, 4); break;
    case 'portal': SFX.portal(); stretch(0.15); break;
    case 'speed': SFX.portal(); break;
    case 'coin': SFX.coin(); burst(cx, cy, 16, '#ffd84a', 300, .5, 5); break;
    case 'die': {
      SFX.die(); Game.shake = 7;
      shatter(cx, cy);
      Game.parts.push({ x:cx, y:cy, vx:0, vy:0, life:.45, max:.45, size:0, col:'ring', ring:skin().a, g:0 });
      if (!Game.practice) Music.stop();
      recordProgress(progress());
      Game.state = 'dead'; Game.deadT = 0;
      break;
    }
    case 'win': {
      Music.stop(); SFX.win();
      recordProgress(100);
      if (Game.cur.kind === 'custom'){
        const lv = customById(Game.cur.id);
        if (lv && !lv.verified){ lv.verified = true; persist(); }
      }
      if (!Game.practice){
        const id = Game.L.def.id, got = save.coins[id] || [];
        for (const c of p.coins) got[c] = true;
        save.coins[id] = got; persist();
      }
      for (let i = 0; i < 6; i++) burst(Game.L.endX + rnd(-40, 40), rnd(-360, -60), 20, ['#fff27a', skin().a, skin().b, '#ff5fd2'][i % 4], 380, 1.2, 6);
      Game.state = 'win'; Game.winT = 0;
      break;
    }
  }
}

function updateCam(dt){
  const p = Game.p;
  const tx = p.x - PLAYER_SX;
  Game.camX = Game.state === 'win' ? Game.camX + (Math.min(tx, Game.L.endX - 600) - Game.camX) * Math.min(1, dt * 3) : tx;
  let ty = Game.camY;
  if (p.mode === 'ship') ty = CAM0;
  else {
    const sy = p.y - Game.camY;
    if (sy < 150) ty = p.y - 150; else if (sy > 330) ty = p.y - 330;
    ty = Math.min(ty, CAM0);
  }
  Game.camY += (ty - Game.camY) * Math.min(1, dt * 6);
}

/* ------------------------------ Zeichnen ---------------------------- */
function hexA(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function pulse(){
  const b = Music.beat();
  if (b < 0) return 0;
  return Math.pow(1 - (b % 1), 3);
}

function drawBackground(col, camX, camY){
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, col.top); gr.addColorStop(1, col.bot);
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  // grosse Parallax-Quadrate
  for (const [f, sz, a] of [[0.08, 150, 0.06], [0.2, 90, 0.08]]){
    const ox = camX * f, oy = camY * f * 0.5;
    const i0 = Math.floor(ox / 240) - 1;
    for (let i = i0; i < i0 + 7; i++){
      const h = Math.sin(i * 12.9898 + sz) * 43758.5453, r = h - Math.floor(h);
      const x = i * 240 - ox, y = 40 + r * 300 - oy * 0.3;
      ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 3;
      ctx.save(); ctx.translate(x + sz / 2, y + sz / 2); ctx.rotate(r * 0.6 - 0.3);
      ctx.strokeRect(-sz / 2, -sz / 2, sz, sz);
      ctx.fillStyle = `rgba(0,0,0,${a * 0.8})`; ctx.fillRect(-sz / 2 + 8, -sz / 2 + 8, sz - 16, sz - 16);
      ctx.restore();
    }
  }
}

function drawGround(col, camX, camY){
  const gy = -camY;
  if (gy > H) return;
  const gr = ctx.createLinearGradient(0, gy, 0, H);
  gr.addColorStop(0, col.ground); gr.addColorStop(1, '#000');
  ctx.fillStyle = gr; ctx.fillRect(0, gy, W, H - gy);
  ctx.strokeStyle = hexA('#000000', 0.25); ctx.lineWidth = 2;
  const off = -(camX % (T * 3));
  for (let x = off; x < W; x += T * 3){ ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, H); ctx.stroke(); }
  const lg = ctx.createLinearGradient(0, 0, W, 0);
  lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.3, '#fff'); lg.addColorStop(0.7, '#fff'); lg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, gy - 1, W, 3);
}

function drawCeiling(col, camX, camY, a){
  if (a < 0.02) return;
  const cy = CEIL - camY;
  ctx.globalAlpha = a;
  const gr = ctx.createLinearGradient(0, cy, 0, 0);
  gr.addColorStop(0, col.ground); gr.addColorStop(1, '#000');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, cy);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, cy - 2, W, 3);
  ctx.globalAlpha = 1;
}

function drawBlock(o, col){
  ctx.fillStyle = hexA(col.block, 0.92);
  ctx.fillRect(o.x, o.y, o.w, o.h);
  ctx.strokeStyle = hexA(col.line, 0.18); ctx.lineWidth = 1.5;
  ctx.strokeRect(o.x + 8, o.y + 8, o.w - 16, o.h - 16);
  ctx.strokeStyle = col.line; ctx.lineWidth = 2.5; ctx.beginPath();
  const x = o.x, y = o.y, w = o.w, h = o.h;
  if (!o.nt){ ctx.moveTo(x, y); ctx.lineTo(x + w, y); }
  if (!o.nb){ ctx.moveTo(x, y + h); ctx.lineTo(x + w, y + h); }
  if (!o.nl){ ctx.moveTo(x, y); ctx.lineTo(x, y + h); }
  if (!o.nr){ ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + h); }
  ctx.stroke();
}
function drawSlab(o, col){
  ctx.fillStyle = hexA(col.block, 0.92); ctx.fillRect(o.x, o.y, o.w, o.h);
  ctx.strokeStyle = col.line; ctx.lineWidth = 2.5; ctx.strokeRect(o.x, o.y, o.w, o.h);
}
function drawSpike(o){
  const x0 = o.col * T, y0 = -(o.row + 1) * T;
  ctx.beginPath();
  if (o.k === 'mini'){
    ctx.moveTo(x0 + 6, y0 + T); ctx.lineTo(x0 + T / 2, y0 + T * 0.5); ctx.lineTo(x0 + T - 6, y0 + T);
  } else if (o.dir === 1){
    ctx.moveTo(x0 + 2, y0 + T); ctx.lineTo(x0 + T / 2, y0 + 2); ctx.lineTo(x0 + T - 2, y0 + T);
  } else {
    ctx.moveTo(x0 + 2, y0); ctx.lineTo(x0 + T / 2, y0 + T - 2); ctx.lineTo(x0 + T - 2, y0);
  }
  ctx.closePath();
  ctx.fillStyle = '#000'; ctx.fill();
  ctx.lineJoin = 'miter'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  // ganz feiner Glanz auf der linken Kante, damit man die Form auch auf dunklem Grund erkennt
  ctx.beginPath();
  if (o.k === 'mini'){ ctx.moveTo(x0 + 9, y0 + T - 2); ctx.lineTo(x0 + T / 2, y0 + T * 0.55); }
  else if (o.dir === 1){ ctx.moveTo(x0 + 6, y0 + T - 2); ctx.lineTo(x0 + T / 2, y0 + 7); }
  else { ctx.moveTo(x0 + 6, y0 + 2); ctx.lineTo(x0 + T / 2, y0 + T - 7); }
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1.5; ctx.stroke();
}
const ORB_COL = { o:'#ffe53b', q:'#ff5fd2', b:'#38c8ff', y:'#ffd23f', p:'#ff5fd2' };
function drawPad(o, used){
  const x0 = o.col * T, y0 = -(o.row + 1) * T, c = ORB_COL[o.c];
  ctx.save();
  ctx.shadowColor = c; ctx.shadowBlur = 14;
  ctx.fillStyle = c; ctx.beginPath();
  ctx.ellipse(x0 + T / 2, y0 + T, T * 0.42, T * 0.22, 0, Math.PI, 0); ctx.fill();
  ctx.restore();
  const t = Game.t * 2;
  ctx.fillStyle = hexA(c, 0.35);
  for (let i = 0; i < 3; i++){
    const f = (t + i / 3) % 1;
    ctx.fillRect(x0 + 8 + i * 10, y0 + T - 8 - f * 26, 3, 3);
  }
}
function drawOrb(o, used){
  const c = ORB_COL[o.c], a0 = Game.t * 2;
  ctx.save();
  ctx.globalAlpha = used ? 0.35 : 1;
  ctx.strokeStyle = c; ctx.lineWidth = 3;
  for (let i = 0; i < 4; i++){
    ctx.beginPath(); ctx.arc(o.cx, o.cy, T * 0.52, a0 + i * Math.PI / 2, a0 + i * Math.PI / 2 + 1.1); ctx.stroke();
  }
  ctx.shadowColor = c; ctx.shadowBlur = 18;
  const gr = ctx.createRadialGradient(o.cx - 4, o.cy - 4, 2, o.cx, o.cy, T * 0.34);
  gr.addColorStop(0, '#fff'); gr.addColorStop(0.4, c); gr.addColorStop(1, hexA(c, 0.6));
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(o.cx, o.cy, T * 0.32, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
const PORTAL = {
  S:{ c:'#ff4fd8', t:'SCHIFF' }, C:{ c:'#5dff7a', t:'WÜRFEL' },
  G:{ c:'#ffd23f', t:'↕' },      N:{ c:'#38c8ff', t:'↕' },
  '>':{ c:'#ff9a2e', t:'»' },    '<':{ c:'#38c8ff', t:'›' }
};
function drawPortal(o){
  const P = PORTAL[o.c], cx = o.cx, cy = o.cy;
  ctx.save();
  if (o.c === '>' || o.c === '<'){
    ctx.fillStyle = P.c; ctx.shadowColor = P.c; ctx.shadowBlur = 16;
    ctx.font = 'bold 54px Trebuchet MS, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(o.c === '>' ? '»' : '‹', cx, cy);
    ctx.restore(); return;
  }
  const w = T * 0.42, h = T * 1.6;
  const gr = ctx.createRadialGradient(cx, cy, 2, cx, cy, h);
  gr.addColorStop(0, hexA(P.c, 0.45)); gr.addColorStop(1, hexA(P.c, 0));
  ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(cx, cy, w, h, 0, 0, Math.PI * 2); ctx.fill();
  ctx.shadowColor = P.c; ctx.shadowBlur = 20;
  ctx.strokeStyle = P.c; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.ellipse(cx, cy, w, h, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(cx, cy, w - 5, h - 5, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
function drawCoin(o, taken){
  const s = Math.abs(Math.cos(Game.t * 3 + o.cx * 0.01));
  ctx.save();
  ctx.translate(o.cx, o.cy + Math.sin(Game.t * 4 + o.cx) * 3);
  ctx.scale(Math.max(0.15, s), 1);
  ctx.globalAlpha = taken ? 0.4 : 1;
  ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 16;
  ctx.fillStyle = taken ? '#b8c4d8' : '#ffd84a';
  ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = taken ? '#6c7890' : '#b87a00'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
function drawFinish(L, camY = Game.camY){
  const x = L.endX;
  const gr = ctx.createLinearGradient(x - 60, 0, x + 20, 0);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(255,255,255,0.5)');
  ctx.fillStyle = gr; ctx.fillRect(x - 60, camY, 80, H);
  ctx.fillStyle = '#fff'; ctx.fillRect(x + 18, camY, 4, H);
}

// Die Spielfigur: abgerundeter Wuerfel mit Maske, grossen Augen und Mund.
// look: -1..1 Blickrichtung nach oben/unten, air: in der Luft (Mund offen)
function drawHero(size, sk, look, air, blink){
  const s = size / 2, r = size * 0.2;
  // Koerper
  roundRect(-s, -s, size, size, r);
  const gr = ctx.createLinearGradient(0, -s, 0, s);
  gr.addColorStop(0, sk.a); gr.addColorStop(1, sk.c);
  ctx.fillStyle = gr; ctx.fill();
  ctx.lineWidth = size * 0.085; ctx.strokeStyle = '#000'; ctx.stroke();
  // Glanz
  roundRect(-s * 0.72, -s * 0.8, size * 0.42, size * 0.13, size * 0.06);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
  // Maske
  roundRect(-s * 0.86, -s * 0.42, size * 0.86, size * 0.44, size * 0.14);
  ctx.fillStyle = sk.b; ctx.fill();
  ctx.lineWidth = size * 0.06; ctx.stroke();
  // Augen
  const ey = -s * 0.2, lk = clamp(look, -1, 1) * s * 0.1;
  for (const ex of [-s * 0.38, s * 0.3]){
    if (blink){
      ctx.fillStyle = '#000'; ctx.fillRect(ex - s * 0.2, ey - s * 0.03, s * 0.4, s * 0.07);
      continue;
    }
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(ex, ey, s * 0.2, s * 0.24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = size * 0.04; ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(ex + s * 0.08, ey + lk, s * 0.1, 0, Math.PI * 2); ctx.fill();
  }
  // Mund
  ctx.fillStyle = '#000';
  if (air){
    ctx.beginPath(); ctx.ellipse(s * 0.02, s * 0.46, s * 0.12, s * 0.15, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.lineWidth = size * 0.06; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(s * 0.02, s * 0.3, s * 0.24, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
    ctx.lineCap = 'butt';
  }
}
const HERO = 44;                  // sichtbare Groesse (Hitbox bleibt 36)
function drawPlayer(p){
  const sk = skin(), g = p.g, cx = p.x + HALF;
  const sq = Game.sq, sy = 1 + sq, sx = 1 - sq * 0.7;
  ctx.save();
  if (p.mode === 'cube'){
    // Squash & Stretch am Fusspunkt verankert
    const footY = g === 1 ? p.y + PS : p.y;
    ctx.translate(cx, footY);
    ctx.scale(sx, sy);
    ctx.translate(0, -g * HERO / 2);
    ctx.rotate(p.rot * Math.PI / 180);
    if (g === -1) ctx.scale(1, -1);
    ctx.shadowColor = hexA(sk.a, 0.6); ctx.shadowBlur = 16;
    drawHero(HERO, sk, clamp(p.vy / 700, -1, 1) * g, !p.grounded, Game.blink > 0);
  } else {
    const ang = Math.atan2(p.vy, SPEEDS[p.spd]) * 0.9;
    ctx.translate(cx, p.y + HALF);
    ctx.rotate(ang);
    if (g === -1) ctx.scale(1, -1);
    ctx.scale(sx, sy);
    // Pilot
    ctx.save(); ctx.translate(-3, -11); drawHero(22, sk, -0.3, false, Game.blink > 0); ctx.restore();
    // Rumpf
    ctx.shadowColor = hexA(sk.a, 0.6); ctx.shadowBlur = 14;
    ctx.fillStyle = sk.a; ctx.strokeStyle = '#000'; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-26, -2); ctx.lineTo(12, -2); ctx.lineTo(28, 7); ctx.lineTo(12, 16); ctx.lineTo(-26, 16); ctx.lineTo(-19, 7);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = sk.b; ctx.beginPath();
    ctx.moveTo(-14, 3); ctx.lineTo(10, 3); ctx.lineTo(18, 7); ctx.lineTo(10, 11); ctx.lineTo(-14, 11); ctx.closePath();
    ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = sk.c; ctx.fillRect(-26, 12, 38, 4);
  }
  ctx.restore();
}

function drawParticles(){
  for (const q of Game.parts){
    const a = clamp(q.life / q.max, 0, 1);
    if (q.col === 'ring'){
      const r = 20 + (1 - a) * 110;
      ctx.globalAlpha = a * 0.8; ctx.strokeStyle = q.ring; ctx.lineWidth = 3 * a + 1;
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.stroke();
      continue;
    }
    ctx.fillStyle = q.col;
    if (q.soft){
      ctx.globalAlpha = a * 0.6;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (0.5 + a * 0.5), 0, Math.PI * 2); ctx.fill();
    } else if (q.vr){
      ctx.globalAlpha = Math.min(1, a * 1.5);
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.fillRect(-q.size / 2, -q.size / 2, q.size, q.size);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(-q.size / 2, -q.size / 2, q.size, q.size);
      ctx.restore();
    } else {
      ctx.globalAlpha = a;
      ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
    }
  }
  ctx.globalAlpha = 1;
}

function drawWorld(){
  const L = Game.L, p = Game.p, col = L.def.colors;
  const sx = Game.shake ? rnd(-Game.shake, Game.shake) : 0, sy = Game.shake ? rnd(-Game.shake, Game.shake) : 0;
  const camX = Game.camX + sx, camY = Game.camY + sy;
  drawBackground(col, camX, camY);
  drawCeiling(col, camX, camY, Game.shipA);

  ctx.save();
  ctx.translate(-camX, -camY);
  // Versuchsanzeige in der Welt
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = 'bold 34px Trebuchet MS, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText((Game.practice ? 'Übung · ' : '') + 'Versuch ' + Game.attempt, 200, -250);

  const vis = near(L, camX - T, camX + W + T, []);
  const taken = save.coins[L.def.id] || [];
  for (const o of vis){
    if (o.k === 'portal') continue;
    switch (o.k){
      case 'block': drawBlock(o, col); break;
      case 'slab':  drawSlab(o, col); break;
      case 'spike': case 'mini': drawSpike(o); break;
      case 'pad':   drawPad(o); break;
      case 'orb':   drawOrb(o, p.used.includes(o.id)); break;
      case 'coin':  if (!p.coins.includes(o.ci)) drawCoin(o, !Game.practice && taken[o.ci]); break;
    }
  }
  for (const o of vis) if (o.k === 'portal') drawPortal(o);
  drawFinish(L);
  for (const c of Game.cps){
    const q = c.p;
    ctx.save(); ctx.translate(q.x + HALF, q.y + HALF); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#5dff7a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.fillRect(-7, -7, 14, 14); ctx.strokeRect(-7, -7, 14, 14); ctx.restore();
  }
  drawParticles();
  if (!p.dead) drawPlayer(p);
  ctx.restore();

  drawGround(col, camX, camY);
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, size, col, align, weight){
  ctx.font = `${weight || 'bold'} ${size}px Trebuchet MS, Verdana, sans-serif`;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y);
}
function outlined(s, x, y, size, col){
  ctx.font = `bold ${size}px Trebuchet MS, Verdana, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.16; ctx.strokeStyle = '#000'; ctx.strokeText(s, x, y);
  ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y);
}
function button(label, x, y, w, h, fn, hot, size){
  roundRect(x, y, w, h, 12);
  ctx.fillStyle = hot === 2 ? 'rgba(255,216,74,0.95)' : hot ? 'rgba(125,255,79,0.95)' : 'rgba(0,0,0,0.45)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = hot ? '#000' : 'rgba(255,255,255,0.8)'; ctx.stroke();
  if (typeof label === 'function') label(x + w / 2, y + h / 2, hot ? '#000' : '#fff');
  else text(label, x + w / 2, y + h / 2 + 1, size || 20, hot ? '#000' : '#fff');
  Game.hits.push({ x, y, w, h, fn });
}
// Vollbild-Symbol: vier Ecken
function fsIcon(cx, cy, col){
  const a = 9, b = 4;
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]){
    ctx.moveTo(cx + sx * a, cy + sy * (a - b)); ctx.lineTo(cx + sx * a, cy + sy * a); ctx.lineTo(cx + sx * (a - b), cy + sy * a);
  }
  ctx.stroke(); ctx.lineCap = 'butt';
}

function drawHUD(){
  const L = Game.L, pc = progress();
  // Fortschrittsbalken
  const bw = 380, bx = (W - bw) / 2, by = 16;
  roundRect(bx, by, bw, 14, 7); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.stroke();
  if (pc > 0){
    roundRect(bx + 2, by + 2, (bw - 4) * pc / 100, 10, 5);
    ctx.fillStyle = Game.practice ? '#5dff7a' : '#7dff4f'; ctx.fill();
  }
  const best = (Game.practice ? save.practice : save.best)[L.def.id] || 0;
  if (best > 0 && best < 100){
    ctx.fillStyle = '#fff'; ctx.fillRect(bx + 2 + (bw - 4) * best / 100 - 1, by - 3, 2, 20);
  }
  outlined(pc + '%', bx + bw + 36, by + 8, 20);
  if (Game.practice){
    outlined('ÜBUNGSMODUS', 90, 24, 16, '#5dff7a');
    text('Z: Checkpoint  ·  X: löschen', 90, 46, 12, 'rgba(255,255,255,.8)', 'center', 'normal');
    button('◆+', 16, 470, 64, 52, addCheckpoint);
    button('◆−', 90, 470, 64, 52, removeCheckpoint);
  }
  // Pause- und Vollbild-Knopf
  button('II', W - 64, 12, 48, 40, togglePause);
  button(fsIcon, W - 120, 12, 48, 40, toggleFS);
  if (Game.cur.kind === 'custom' && !Game.practice)
    outlined(Game.cur.test ? 'TESTLAUF' : clipText(Game.L.def.name, 200, 16), 110, 24, 16, Game.cur.test ? '#ffd84a' : '#fff');
  // Muenzen dieses Laufs
  for (let i = 0; i < L.coins; i++){
    const got = Game.p.coins.includes(i);
    ctx.beginPath(); ctx.arc(W - 200 + i * 24, 32, 8, 0, Math.PI * 2);
    ctx.fillStyle = got ? '#ffd84a' : 'rgba(0,0,0,.35)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = got ? '#b87a00' : 'rgba(255,255,255,.5)'; ctx.stroke();
  }
}

function drawDim(a){ ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, W, H); }

function drawPause(){
  drawDim(0.55);
  outlined('PAUSE', W / 2, 150, 64);
  const pc = progress();

  button('Neustart', W / 2 - 110, 326, 220, 54, () => { togglePause(); Game.cps = []; Game.p.dead = true; Game.state = 'dead'; Game.deadT = 1; });

function drawWin(){

  ctx.fillStyle = 'rgba(10,6,30,0.85)'; ctx.fill();

function drawMenu(){
  const L0 = PARSED[Game.sel].def, col = L0.colors;
  drawBackground(col, Game.menuX, CAM0);
  drawGround(col, Game.menuX, CAM0 - 40);
  // laufender Deko-Wuerfel
  const t = Game.t, ph = (t * 1.6) % 1;
  const jy = ph < 0.4 ? -Math.sin(ph / 0.4 * Math.PI) * 22 : 0;
  ctx.save(); ctx.translate(120 + ((t * 60) % 780), 510 - 17 + jy);
  ctx.rotate(ph < 0.4 ? ph / 0.4 * Math.PI / 2 : 0);
  drawHero(34, skin(), 0, ph < 0.4, Game.blink > 0); ctx.restore();

  // Figurauswahl oben links
  const sk = skin();
  roundRect(16, 16, 150, 124, 16); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.stroke();
  const bob = Math.sin(t * 3) * 3;
  ctx.save(); ctx.translate(91, 64 + bob); ctx.shadowColor = hexA(sk.a, 0.7); ctx.shadowBlur = 18;
  drawHero(52, sk, 0, false, Game.blink > 0); ctx.restore();
  text(sk.name, 91, 118, 16, '#fff');
  button('◀', 22, 44, 32, 40, () => cycleSkin(-1));
  button('▶', 128, 44, 32, 40, () => cycleSkin(1));

  ctx.save();
  ctx.shadowColor = '#7dff4f'; ctx.shadowBlur = 30 + pulse() * 20;
  outlined('GEO RUSH', W / 2, 78, 76, '#7dff4f');
  ctx.restore();
  text('Springen · Fliegen · Nicht sterben', W / 2, 130, 18, 'rgba(255,255,255,.85)', 'center', 'normal');

  const cw = 260, ch = 200, gap = 24, x0 = (W - (cw * 3 + gap * 2)) / 2, y0 = 160;
  PARSED.forEach((L, i) => {
    const d = L.def, x = x0 + i * (cw + gap), sel = i === Game.sel;
    const y = y0 - (sel ? 6 : 0);
    roundRect(x, y, cw, ch, 18);
    const gr = ctx.createLinearGradient(0, y, 0, y + ch);
    gr.addColorStop(0, d.colors.top); gr.addColorStop(1, d.colors.bot);

    ctx.lineWidth = sel ? 5 : 2; ctx.strokeStyle = sel ? '#fff' : 'rgba(255,255,255,.4)'; ctx.stroke();
    outlined(d.name, x + cw / 2, y + 34, 26);
    text('★'.repeat(d.stars) + '☆'.repeat(3 - d.stars), x + cw / 2, y + 68, 22, '#ffd84a');
    const b = save.best[d.id] || 0, pr = save.practice[d.id] || 0;
    const bar = (label, v, yy, c) => {
      text(label, x + 18, yy, 13, 'rgba(255,255,255,.85)', 'left', 'normal');
      text(v + '%', x + cw - 18, yy, 13, '#fff', 'right');
      roundRect(x + 18, yy + 10, cw - 36, 10, 5); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
      if (v > 0){ roundRect(x + 18, yy + 10, (cw - 36) * v / 100, 10, 5); ctx.fillStyle = c; ctx.fill(); }
    };
    bar('Normal', b, y + 98, '#7dff4f');
    bar('Übung', pr, y + 132, '#38e1ff');
    const got = save.coins[d.id] || [];
    for (let k = 0; k < L.coins; k++){
      ctx.beginPath(); ctx.arc(x + cw / 2 - 24 + k * 24, y + 176, 8, 0, Math.PI * 2);
      ctx.fillStyle = got[k] ? '#ffd84a' : 'rgba(0,0,0,.35)'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = got[k] ? '#b87a00' : 'rgba(255,255,255,.5)'; ctx.stroke();
    }
    Game.hits.push({ x, y, w:cw, h:ch, fn: () => { if (Game.sel === i) startLevel(i); else { Game.sel = i; SFX.click(); } } });
  });

  button('Übung: ' + (Game.practice ? 'AN' : 'AUS'), 64, 390, 166, 44, () => { Game.practice = !Game.practice; SFX.click(); }, false, 18);
  button('▶  SPIELEN', 244, 384, 240, 56, () => startLevel(Game.sel), true);
  button('Level bauen', 498, 390, 200, 44, openMyLevels, 2, 19);
  button('Ton: ' + (save.muted ? 'AUS' : 'AN'), 712, 390, 120, 44, () => { initAudio(); setMuted(!save.muted); SFX.click(); }, false, 18);
  button(fsIcon, 846, 390, 50, 44, toggleFS);
  text('Leertaste / Tippen = springen  ·  ←/→ Level  ·  ↑/↓ Figur  ·  Enter starten  ·  B Level bauen  ·  F Vollbild  ·  M Ton',
       W / 2, 460, 12.5, 'rgba(255,255,255,.8)', 'center', 'normal');
}

function render(){
  resize();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  Game.hits = [];
  const st = Game.state;
  if (st === 'menu') drawMenu();
  else if (st === 'mylevels') drawMyLevels();
  else if (st === 'editor') drawEditor();
  else {
    drawWorld();
    if (st === 'play' || st === 'dead') drawHUD();
    if (st === 'pause') drawPause();
    if (st === 'win') drawWin();
  }
  if (Game.modal) drawModal();
  drawToast();
}

/* ----------------------------- Vollbild ----------------------------- */
function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
function toggleFS(){
  const d = document.documentElement;
  const req = d.requestFullscreen || d.webkitRequestFullscreen;
  try {
    if (fsElement()){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    if (!req){ fsHelp(); return; }
    const lock = () => { try { const o = screen.orientation; if (o && o.lock) o.lock('landscape').catch(() => {}); } catch(_){} };
    const r = req.call(d, { navigationUI:'hide' });
    if (r && r.then) r.then(lock, fsHelp); else lock();
  } catch(_){ fsHelp(); }
}

/* --------------------------- Eigene Level --------------------------- */
if (!Array.isArray(save.custom)) save.custom = [];
const THEMES = [LEVELS[0].colors, LEVELS[1].colors, LEVELS[2].colors,
  { top:'#14c98d', bot:'#03362a', ground:'#0b7353', line:'#b8ffe2', block:'#04261c' },
  { top:'#ff9a2e', bot:'#4a1a02', ground:'#a8460c', line:'#ffe0b0', block:'#3a1202' },
  { top:'#30364f', bot:'#06070d', ground:'#1c2136', line:'#a9b8ff', block:'#0a0d18' }];
const THEME_NAMES = ['Blau', 'Lila', 'Rot', 'Grün', 'Orange', 'Nacht'];
const SONGS = [LEVELS[0].song, LEVELS[1].song, LEVELS[2].song,
  { bpm:118, root:55, prog:[0, 4, 5, 3] }, { bpm:172, root:52, prog:[0, 6, 5, 6] }];
const songName = i => 'Song ' + (i + 1) + ' · ' + SONGS[i].bpm + ' BPM';
const TOOL_CHARS = '#-^.vypoqbSCGN><*';
const MAX_COL = 1500, MAX_ROW = 10;

function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function customById(id){ return save.custom.find(l => l.id === id); }
function coinCount(cells){ let n = 0; for (const k in cells) if (cells[k] === '*') n++; return n; }

// Ein eigenes Level wird in dasselbe ASCII-Format uebersetzt wie die eingebauten
function customDef(lv){
  let maxC = -1;
  for (const k in lv.cells){ const c = +k.split(',')[0]; if (c > maxC) maxC = c; }
  const w = Math.max(maxC + 1, 24), lines = [];
  for (let r = MAX_ROW; r >= 0; r--){
    let line = '';
    for (let c = 0; c < w; c++) line += lv.cells[c + ',' + r] || ' ';
    lines.push(line);
  }
  return { id:'c_' + lv.id, name:lv.name, stars:0, speed:lv.speed ? 1 : 0,
           colors:THEMES[lv.theme] || THEMES[0], song:SONGS[lv.song] || SONGS[0], chunks:[lines, 14] };
}

// Teilen: Level -> kurzer Text-Code (JSON mit Lauflaengen, Base64url) und zurueck
function b64e(str){
  let bin = '';
  for (const x of new TextEncoder().encode(str)) bin += String.fromCharCode(x);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64d(s){
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s), b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}
function encodeLevel(lv){
  const cells = Object.keys(lv.cells).map(k => k.split(',').map(Number)).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  const runs = [];
  for (const [c, r] of cells){
    const ch = lv.cells[c + ',' + r], q = runs[runs.length - 1];
    if (q && q[1] === r && q[2] === ch && q[0] + q[3] === c) q[3]++;
    else runs.push([c, r, ch, 1]);
  }
  return 'GR1' + b64e(JSON.stringify({ n:lv.name, t:lv.theme | 0, m:lv.song | 0, s:lv.speed ? 1 : 0, d:runs }));
}
function decodeLevel(code){
  code = String(code || '');
  const i = code.indexOf('GR1');
  if (i < 0) return null;
  code = code.slice(i + 3).replace(/[^A-Za-z0-9_-]/g, '');
  let o;
  try { o = JSON.parse(b64d(code)); } catch(_){ return null; }
  if (!o || !Array.isArray(o.d)) return null;
  const cells = {};
  for (const q of o.d){
    if (!Array.isArray(q) || q.length < 4) continue;
    const [c, r, ch, n] = q;
    if (!Number.isInteger(c) || !Number.isInteger(r) || !Number.isInteger(n) || typeof ch !== 'string' ||
        ch.length !== 1 || !TOOL_CHARS.includes(ch) || r < 0 || r > MAX_ROW) continue;
    for (let k = 0; k < Math.min(n, MAX_COL); k++){
      const cc = c + k;
      if (cc < 0 || cc >= MAX_COL) continue;
      if (ch === '*' && coinCount(cells) >= 3) continue;
      cells[cc + ',' + r] = ch;
    }
  }
  return { id:newId(), name:String(o.n || 'Geteiltes Level').slice(0, 28) || 'Geteiltes Level',
           theme:clamp(o.t | 0, 0, THEMES.length - 1), song:clamp(o.m | 0, 0, SONGS.length - 1),
           speed:o.s ? 1 : 0, cells, verified:false };
}
function shareLevel(lv){
  const code = encodeLevel(lv);
  let top = false;
  try { top = window.top === window && /^https?:$/.test(location.protocol); } catch(_){}
  const link = top ? location.href.split('#')[0] + '#' + code : null;
  const buttons = [];
  if (link) buttons.push({ label:'Link kopieren', fn:({ el }) => { copyText(link, el); return false; } });
  buttons.push({ label:'Code kopieren', hot:true, fn:({ el }) => { copyText(code, el); return false; } });
  buttons.push({ label:'Schließen' });
  dialog({ title:'„' + lv.name + '“ teilen',
    text: link ? 'Schick den Link: Wer ihn öffnet, hat dein Level sofort im Spiel. Oder schick den Code – der lässt sich unter „Level bauen → Code einfügen“ laden.'
               : 'Kopier den Code und schick ihn weiter. Wer ihn unter „Level bauen → Code einfügen“ einfügt, kann dein Level spielen.',
    area:code, readonly:true, buttons });
}
function importDialog(){
  dialog({ title:'Level-Code einfügen', text:'Füge den Code ein, den du bekommen hast (er beginnt mit GR1).', area:'',
    buttons:[ { label:'Abbrechen' },

          const lv = decodeLevel(area);
          if (!lv){ dlgP.textContent = 'Das ist kein gültiger Level-Code. Prüf, ob er vollständig kopiert wurde.'; return false; }
          save.custom.unshift(lv); persist(); ML.scroll = 0; toast('„' + lv.name + '“ geladen');
        } } ] });
}
// Geteilter Link: #GR1... in der Adresse laedt das Level direkt
function importFromHash(){
  let h = '';
  try { h = decodeURIComponent(location.hash.slice(1)); } catch(_){}
  if (!h.startsWith('GR1')) return;
  const lv = decodeLevel(h);

  const code = encodeLevel(lv);
  const known = save.custom.find(l => encodeLevel(l) === code);
  if (!known){ save.custom.unshift(lv); persist(); }
  try { history.replaceState(null, '', location.pathname + location.search); } catch(_){}

}

/* ---------------------------- Level-Editor -------------------------- */
const ED_TOOLS = ['hand', 'erase', '#', '-', '^', '.', 'v', 'y', 'p', 'o', 'q', 'b', 'S', 'C', 'G', 'N', '>', '<', '*'];
const TOOL_NAMES = { hand:'Bewegen', erase:'Radierer', '#':'Block', '-':'Plattform', '^':'Stachel', '.':'Mini-Stachel',
  v:'Hängender Stachel', y:'Gelbes Pad (hoch)', p:'Pinkes Pad (flach)', o:'Gelber Orb', q:'Pinker Orb',
  b:'Blauer Orb (Schwerkraft)', S:'Schiff-Portal', C:'Würfel-Portal', G:'Schwerkraft umdrehen',
  N:'Schwerkraft normal', '>':'Schnell', '<':'Normales Tempo', '*':'Münze (max. 3)' };
const ICONS = {};
for (const ch of TOOL_CHARS) ICONS[ch] = parseLevel({ chunks:[[ch]] }).objs[0];
const ED_CAMY = CAM0, PAL_Y = 480;
const SB = { x:346, y:20, w:288, h:14 };          // Scrollleiste oben
const Ed = { lv:null, L:null, camX:-160, tool:'#', drag:null, undo:[], hover:null, keys:new Set(), last:null, prev:0 };

function openEditor(id, keepCam){
  const lv = customById(id);
  if (!lv) return;
  if (Ed.lv !== lv || !keepCam){ Ed.camX = -160; Ed.undo = []; }
  Ed.lv = lv; Ed.drag = null; Ed.hover = null;
  edRebuild();
  Music.stop();
  if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
  Game.modal = null; Game.state = 'editor';
}
function edRebuild(){ Ed.L = parseLevel(customDef(Ed.lv)); }
function edMaxCol(){ let m = 0; for (const k in Ed.lv.cells){ const c = +k.split(',')[0]; if (c > m) m = c; } return m; }
function edSpan(){ return Math.min(MAX_COL, Math.max(edMaxCol() + 50, 60)) * T; }
function edClampCam(){ Ed.camX = clamp(Ed.camX, -200, Math.max(0, edSpan() - W)); }
function edThumb(){ return Math.max(20, SB.w * W / edSpan()); }
function edScrollbarHit(pt){ return pt.x >= SB.x - 8 && pt.x <= SB.x + SB.w + 8 && pt.y >= SB.y - 12 && pt.y <= SB.y + SB.h + 12; }
function edScrollTo(x){
  const tw = edThumb();
  Ed.camX = clamp((x - SB.x - tw / 2) / (SB.w - tw), 0, 1) * (edSpan() - W);
  edClampCam();
}
function edCell(pt){
  if (pt.y >= PAL_Y - 4) return null;
  const c = Math.floor((pt.x + Ed.camX) / T), r = Math.floor(-(pt.y + ED_CAMY) / T);
  if (c < 0 || c >= MAX_COL || r < 0 || r > MAX_ROW) return null;
  return { c, r };
}
function edDown(pt, e){
  const cell = edCell(pt);
  if (Ed.tool === 'hand' || e.button === 1 || (!cell && pt.y < PAL_Y)){
    Ed.drag = { pan:true, x0:pt.x, cam0:Ed.camX }; return;
  }
  if (!cell) return;
  Ed.drag = { paint:true, erase:Ed.tool === 'erase' || e.button === 2, batch:[] };
  Ed.last = null;
  edPaint(cell);
}
function edMove(pt, e){
  Ed.hover = e.pointerType === 'mouse' ? edCell(pt) : null;
  const d = Ed.drag;
  if (!d) return;
  if (d.scroll) edScrollTo(pt.x);
  else if (d.pan){ Ed.camX = d.cam0 - (pt.x - d.x0); edClampCam(); }
  else if (d.paint){ const cell = edCell(pt); if (cell) edPaint(cell); }
}
function edUp(){
  const d = Ed.drag;
  if (d && d.paint && d.batch.length){
    Ed.undo.push(d.batch);
    if (Ed.undo.length > 200) Ed.undo.shift();
    Ed.lv.verified = false;
    persist();
  }
  Ed.drag = null;
}
function edPaint(cell){
  const k = cell.c + ',' + cell.r;
  if (Ed.last === k) return;
  Ed.last = k;
  const cells = Ed.lv.cells, old = cells[k] || null, ch = Ed.drag.erase ? null : Ed.tool;
  if (old === ch) return;
  if (ch === '*' && old !== '*' && coinCount(cells) >= 3){ toast('Höchstens 3 Münzen pro Level'); return; }
  Ed.drag.batch.push([k, old]);
  if (ch) cells[k] = ch; else delete cells[k];
  edRebuild();
}
function edUndo(){
  const b = Ed.undo.pop();
  if (!b){ toast('Nichts zum Rückgängigmachen'); return; }
  for (let i = b.length - 1; i >= 0; i--){
    const [k, old] = b[i];
    if (old) Ed.lv.cells[k] = old; else delete Ed.lv.cells[k];
  }
  Ed.lv.verified = false;
  edRebuild(); persist();
}
function edExit(){ persist(); clearTimeout(Ed.prev); Music.stop(); Game.state = 'mylevels'; SFX.click(); }
function edTest(){ persist(); clearTimeout(Ed.prev); startCustom(Ed.lv.id, true); }
function edUpdate(dt){
  const k = Ed.keys;
  const dir = (k.has('ArrowRight') || k.has('KeyD') ? 1 : 0) - (k.has('ArrowLeft') || k.has('KeyA') ? 1 : 0);
  if (dir){ Ed.camX += dir * 720 * dt; edClampCam(); }
}
function edKey(e){
  const c = e.code;
  if ((e.ctrlKey || e.metaKey) && c === 'KeyZ'){ e.preventDefault(); edUndo(); return; }
  if (c === 'Escape'){ edExit(); return; }
  if (c === 'Enter' || c === 'KeyT'){ edTest(); return; }
  if (c === 'ArrowLeft' || c === 'ArrowRight' || c === 'KeyA' || c === 'KeyD'){ Ed.keys.add(c); return; }
  if (c === 'KeyE'){ Ed.tool = 'erase'; return; }
  if (c === 'KeyH'){ Ed.tool = 'hand'; return; }
  const m = /^Digit(\d)$/.exec(c);
  if (m){ const i = (+m[1] + 9) % 10; Ed.tool = ED_TOOLS[2 + i]; toast(TOOL_NAMES[Ed.tool], 1.2); }
}
function edSettings(){
  Game.modal = { title:'Level-Einstellungen', buttons:() => {
    const lv = Ed.lv;
    return [
      { label:'Name: ' + lv.name, keep:true, fn:() => dialog({ title:'Levelname', input:lv.name, buttons:[
          { label:'Abbrechen' },
          { label:'Speichern', hot:true, fn:({ input }) => { const v = input.trim().slice(0, 28); if (v){ lv.name = v; persist(); edRebuild(); } } } ] }) },
      { label:'Farbe: ' + THEME_NAMES[lv.theme | 0], keep:true, fn:() => { lv.theme = ((lv.theme | 0) + 1) % THEMES.length; persist(); edRebuild(); } },
      { label:'Musik: ' + songName(lv.song | 0) + '  ♪', keep:true, fn:() => {
          lv.song = ((lv.song | 0) + 1) % SONGS.length; persist(); edRebuild();
          initAudio(); Music.play(SONGS[lv.song]);
          clearTimeout(Ed.prev); Ed.prev = setTimeout(() => { if (Game.state === 'editor') Music.stop(); }, 4500);
        } },
      { label:'Start-Tempo: ' + (lv.speed ? 'schnell' : 'normal'), keep:true, fn:() => { lv.speed = lv.speed ? 0 : 1; persist(); edRebuild(); } },
      { label:'Alles löschen', fn:() => modal('Alles löschen?', 'Alle Objekte in diesem Level werden entfernt.', [
          { label:'Ja, alles löschen', hot:2, fn:() => {
              const b = Object.entries(lv.cells);
              lv.cells = {}; Ed.undo.push(b); lv.verified = false; persist(); edRebuild();
            } },
          { label:'Abbrechen' } ]) },
      { label:'Fertig', hot:true, fn:() => { clearTimeout(Ed.prev); Music.stop(); } }
    ];
  } };
}

function drawToolIcon(t, cx, cy, col){
  if (t === 'hand'){
    ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - 13, cy); ctx.lineTo(cx + 13, cy); ctx.moveTo(cx, cy - 13); ctx.lineTo(cx, cy + 13); ctx.stroke();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){
      ctx.beginPath();
      ctx.moveTo(cx + dx * 16, cy + dy * 16);
      ctx.lineTo(cx + dx * 9 - dy * 6, cy + dy * 9 + dx * 6);
      ctx.lineTo(cx + dx * 9 + dy * 6, cy + dy * 9 - dx * 6);
      ctx.closePath(); ctx.fill();
    }
    ctx.lineCap = 'butt'; return;
  }
  if (t === 'erase'){
    ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - 10, cy - 10); ctx.lineTo(cx + 10, cy + 10); ctx.moveTo(cx + 10, cy - 10); ctx.lineTo(cx - 10, cy + 10); ctx.stroke();
    ctx.lineCap = 'butt'; return;
  }
  const o = ICONS[t];
  const s = (t === '>' || t === '<') ? 0.6 : o.k === 'portal' ? 0.3 : 0.78;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-T / 2, T / 2);
  drawObj(o, col, false, false);
  ctx.restore();
}
function drawObj(o, col, used, coinTaken){
  switch (o.k){
    case 'block':  drawBlock(o, col); break;
    case 'slab':   drawSlab(o, col); break;
    case 'spike': case 'mini': drawSpike(o); break;
    case 'pad':    drawPad(o); break;
    case 'orb':    drawOrb(o, used); break;
    case 'coin':   drawCoin(o, coinTaken); break;
    case 'portal': drawPortal(o); break;
  }
}

function drawEditor(){
  const lv = Ed.lv, L = Ed.L, col = L.def.colors, camX = Ed.camX, camY = ED_CAMY;
  drawBackground(col, camX, camY);
  ctx.save();
  ctx.translate(-camX, -camY);
  const c0 = Math.floor(camX / T), c1 = c0 + Math.ceil(W / T) + 1;
  if (camX < 0){ ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(camX, CEIL - 3 * T, -camX, -CEIL + 3 * T); }
  // Raster
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let c = Math.max(0, c0); c <= c1; c++){ ctx.moveTo(c * T, 0); ctx.lineTo(c * T, -(MAX_ROW + 1) * T); }
  for (let r = 1; r <= MAX_ROW + 1; r++){ ctx.moveTo(Math.max(0, c0) * T, -r * T); ctx.lineTo(c1 * T, -r * T); }
  ctx.stroke();
  // Decke im Schiff-Modus
  ctx.setLineDash([10, 8]); ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(Math.max(0, c0) * T, CEIL); ctx.lineTo(c1 * T, CEIL); ctx.stroke(); ctx.setLineDash([]);
  for (let c = Math.max(0, Math.ceil(c0 / 10) * 10); c <= c1; c += 10)
    text(String(c), c * T + 4, CEIL - 8, 11, 'rgba(255,255,255,.55)', 'left', 'normal');

  const vis = near(L, camX - T, camX + W + T, []);
  for (const o of vis) if (o.k !== 'portal') drawObj(o, col, false, false);
  for (const o of vis) if (o.k === 'portal') drawPortal(o);
  drawFinish(L, camY);
  // Startposition
  ctx.save(); ctx.globalAlpha = 0.6; ctx.translate(HALF, -HERO / 2); drawHero(HERO, skin(), 0, false, false); ctx.restore();
  text('START', HALF, -HERO - 14, 13, '#fff');
  // Zeiger
  if (Ed.hover && Ed.tool !== 'hand'){
    const { c, r } = Ed.hover, er = Ed.tool === 'erase';
    ctx.fillStyle = er ? 'rgba(255,90,90,.3)' : 'rgba(125,255,79,.22)';
    ctx.fillRect(c * T, -(r + 1) * T, T, T);
    ctx.strokeStyle = er ? '#ff6b6b' : '#7dff4f'; ctx.lineWidth = 2;
    ctx.strokeRect(c * T + 1, -(r + 1) * T + 1, T - 2, T - 2);
    if (!er){
      ctx.save(); ctx.globalAlpha = 0.5; ctx.translate(c * T, -r * T);   // Vorschau: Symbol liegt in Zelle (0,0)
      drawObj(ICONS[Ed.tool], col, false, false); ctx.restore();
    }
  }
  ctx.restore();
  drawGround(col, camX, camY);

  // Werkzeugleiste unten
  const n = ED_TOOLS.length, sw = 45, gap = 3, pw = n * (sw + gap) - gap, px0 = (W - pw) / 2;
  roundRect(px0 - 7, PAL_Y - 6, pw + 14, 62, 14); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fill();
  ED_TOOLS.forEach((t, i) => {
    const x = px0 + i * (sw + gap), y = PAL_Y, sel = Ed.tool === t;
    roundRect(x, y, sw, 50, 10);
    ctx.fillStyle = sel ? 'rgba(125,255,79,0.35)' : 'rgba(255,255,255,0.08)'; ctx.fill();
    ctx.lineWidth = sel ? 3 : 1.5; ctx.strokeStyle = sel ? '#7dff4f' : 'rgba(255,255,255,0.25)'; ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, sw, 50); ctx.clip();
    drawToolIcon(t, x + sw / 2, y + 25, col);
    ctx.restore();
    Game.hits.push({ x, y, w:sw, h:50, fn:() => { Ed.tool = t; SFX.click(); toast(TOOL_NAMES[t], 1.3); } });
  });

  // Leiste oben
  button('◀ Fertig', 10, 8, 112, 38, edExit, false, 17);
  ctx.save(); ctx.shadowColor = '#000'; ctx.shadowBlur = 6;
  text(clipText(lv.name, 200, 17), 132, 27, 17, '#fff', 'left');
  ctx.restore();
  roundRect(SB.x, SB.y, SB.w, SB.h, 7); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.stroke();
  const tw = edThumb(), f = clamp(Ed.camX / Math.max(1, edSpan() - W), 0, 1);
  roundRect(SB.x + f * (SB.w - tw), SB.y + 2, tw, SB.h - 4, 5); ctx.fillStyle = '#7dff4f'; ctx.fill();
  button('↶', 646, 8, 54, 38, edUndo, false, 24);
  button('Optionen', 708, 8, 112, 38, edSettings, false, 17);
  button('▶ Testen', 828, 8, 122, 38, edTest, true, 17);

  if (Object.keys(lv.cells).length < 4){
    ctx.save(); ctx.shadowColor = '#000'; ctx.shadowBlur = 6;
    text('Unten ein Objekt wählen, dann ins Raster tippen oder ziehen.  ✥ = verschieben, ✕ = löschen', W / 2, 70, 15, '#fff', 'center', 'normal');
    ctx.restore();
  }
}

/* ------------------------- Eingabe-Handler -------------------------- */
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H };
}
function hitTest(pt){
  for (let i = Game.hits.length - 1; i >= 0; i--){
    const h = Game.hits[i];
    if (pt.x >= h.x && pt.x <= h.x + h.w && pt.y >= h.y && pt.y <= h.y + h.h) return h;
  }
  return null;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const pt = canvasPos(e);
  if (Game.state === 'editor' && !Game.modal && edScrollbarHit(pt)){
    Ed.drag = { scroll:true }; edScrollTo(pt.x);
    try { cv.setPointerCapture(e.pointerId); } catch(_){}
    return;
  }
  const h = hitTest(pt);
  if (h){ h.fn(); return; }
  if (Game.modal) return;
  if (Game.state === 'play'){ pointers.add(e.pointerId); latch = true; try { cv.setPointerCapture(e.pointerId); } catch(_){} }
  else if (Game.state === 'editor'){ edDown(pt, e); try { cv.setPointerCapture(e.pointerId); } catch(_){} }
  else if (Game.state === 'mylevels'){ ML.drag = { y0:pt.y, s0:ML.scroll }; }
});
cv.addEventListener('pointermove', e => {
  const pt = canvasPos(e);
  if (Game.state === 'editor') edMove(pt, e);
  else if (Game.state === 'mylevels' && ML.drag && e.buttons) ML.scroll = ML.drag.s0 - (pt.y - ML.drag.y0);
});
cv.addEventListener('wheel', e => {
  if (Game.state === 'editor'){ e.preventDefault(); Ed.camX += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY); edClampCam(); }
  else if (Game.state === 'mylevels'){ e.preventDefault(); ML.scroll += e.deltaY; }
}, { passive:false });
const up = e => { pointers.delete(e.pointerId); if (Game.state === 'editor') edUp(); ML.drag = null; };
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (dlgOpen()){ if (e.code === 'Escape') closeDialog(); return; }
  if (JUMP_KEYS.has(e.code) || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.repeat) return;
  initAudio();
  const s = Game.state;
  if (Game.modal){ if (e.code === 'Escape') Game.modal = null; return; }
  if (e.code === 'KeyM'){ setMuted(!save.muted); return; }
  if (e.code === 'KeyF'){ toggleFS(); return; }
  if (s === 'editor'){ edKey(e); return; }
  if (s === 'mylevels'){
    if (e.code === 'Escape' || e.code === 'Backspace') Game.state = 'menu';
    else if (e.code === 'KeyN') newCustomLevel();
    return;
  }
  if (s === 'menu'){
    if (e.code === 'KeyB'){ openMyLevels(); return; }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA'){ Game.sel = (Game.sel + PARSED.length - 1) % PARSED.length; SFX.click(); }
    else if (e.code === 'ArrowRight' || e.code === 'KeyD'){ Game.sel = (Game.sel + 1) % PARSED.length; SFX.click(); }
    else if (e.code === 'Enter' || e.code === 'Space'){ keysHeld.add(e.code); startLevel(Game.sel); }
    else if (e.code === 'KeyP'){ Game.practice = !Game.practice; SFX.click(); }
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') cycleSkin(-1);
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') cycleSkin(1);
    return;
  }
  if (s === 'win'){
    if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyR'){ keysHeld.add(e.code); restartCurrent(); }
    else if (e.code === 'Escape') exitPlay();
    return;
  }
  if (e.code === 'Escape' || e.code === 'KeyP'){ togglePause(); return; }
  if (s === 'pause'){
    if (e.code === 'Enter' || e.code === 'Space'){ keysHeld.add(e.code); togglePause(); }
    else if (e.code === 'Backspace' || e.code === 'KeyQ') exitPlay();
    return;
  }
  if (e.code === 'KeyR' && s === 'play'){ Game.cps = []; Game.p.dead = true; Game.state = 'dead'; Game.deadT = 1; return; }
  if (e.code === 'KeyZ') addCheckpoint();
  if (e.code === 'KeyX') removeCheckpoint();
  if (JUMP_KEYS.has(e.code)){ keysHeld.add(e.code); latch = true; }
});
window.addEventListener('keyup', e => { keysHeld.delete(e.code); Ed.keys.delete(e.code); });
window.addEventListener('blur', () => { keysHeld.clear(); pointers.clear(); Ed.keys.clear(); if (Game.state === 'play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && Game.state === 'play') togglePause(); });

/* ------------------------------ Schleife ---------------------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
resize();
importFromHash();
requestAnimationFrame(frame);

// Zum Herumprobieren in der Konsole (und fuer den Level-Loeser in den Tests)
window.GEO_RUSH = { LEVELS, PARSED, parseLevel, newPlayer, clonePlayer, step, Game, save, SPEEDS, T, DT,
                    Ed, customDef, encodeLevel, decodeLevel, startCustom, openEditor, newCustomLevel };
})();
</script>
